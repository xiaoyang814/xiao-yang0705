<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>栖夜</title>
<style>
*,*::before,*::after{box-sizing:border-box;touch-action:manipulation;}
:root{
  --bg:#ffffff;--bg-2:#f7f7f8;--bg-3:#eeeef1;
  --fg:#1c1c1e;--muted:#8e8e93;--line:#e4e4e7;
  --accent:#0b93f6;--accent-hover:#0a7fd4;--wechat:#07c160;
  --danger:#ff3b30;
}
html,body{height:100%;}
body{margin:0;background:#fff;color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;overflow:hidden;-webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;}
input,textarea,select{font:inherit;color:inherit;}
img{max-width:100%;display:block;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
.screen[hidden]{display:none;}
.screen-body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
.screen-body[hidden]{display:none;}

.statusbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 6px) 22px 6px;font-size:14px;font-weight:600;}
.sb-right{letter-spacing:2px;font-size:12px;}

#home{transition:background .3s;}
.home-body{flex:1 1 auto;overflow-y:auto;padding:30px 22px 0;}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;}
.app-icon .ico{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;
  font-size:22px;color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.14);transition:transform .12s;}
.app-icon:active .ico{transform:scale(.9);}
.app-icon .lbl{font-size:11.5px;color:#3c3c43;font-weight:500;white-space:nowrap;}
.dock{flex:0 0 auto;margin:14px 16px calc(16px + env(safe-area-inset-bottom));padding:12px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:26px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;box-shadow:0 2px 14px rgba(0,0,0,.08);}
.dock .app-icon .lbl{display:none;}

.back{width:34px;height:34px;font-size:24px;color:var(--accent);display:grid;place-items:center;flex:0 0 auto;line-height:1;}

/* ====== 信息 ====== */
.imsg-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 12px 8px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;}
.imsg-peer{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;}
.imsg-avatar{width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#0b93f6,#5ac8fa);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;}
.imsg-name{font-size:11.5px;font-weight:600;}
.imsg-top .icon-btn{margin-left:auto;font-size:16px;color:var(--accent);width:34px;height:34px;display:grid;place-items:center;font-weight:600;}
.imsg-messages{flex:1 1 auto;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:5px;
  background:#fff;-webkit-overflow-scrolling:touch;}
.msg{display:flex;flex-direction:column;max-width:min(76%,600px);animation:pop .18s ease-out;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.msg.me{align-self:flex-end;align-items:flex-end;}
.msg.them{align-self:flex-start;align-items:flex-start;}
.msg .bubble{padding:8px 13px;border-radius:18px;line-height:1.4;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-size:15px;}
.msg.me .bubble{background:#0b93f6;color:#fff;border-bottom-right-radius:5px;}
.msg.them .bubble{background:#e9e9eb;color:#1c1c1e;border-bottom-left-radius:5px;}
.msg .sys-bubble{background:#f2f2f4;color:#8e8e93;font-size:12px;padding:6px 12px;border-radius:14px;text-align:center;}
.msg .img-bubble{padding:4px;background:#e9e9eb;border-radius:14px;overflow:hidden;max-width:220px;}
.msg.me .img-bubble{background:#0b93f6;}
.msg .img-bubble img{border-radius:12px;max-height:280px;object-fit:cover;}
.msg time{margin-top:2px;padding:0 4px;font-size:10.5px;color:#c7c7cc;user-select:none;}
.typing{display:flex;gap:4px;padding:12px 14px;background:#e9e9eb;border-radius:18px;border-bottom-left-radius:5px;width:fit-content;align-self:flex-start;}
.typing span{width:7px;height:7px;border-radius:50%;background:#a1a1a6;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}

.imsg-composer{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-bottom:calc(6px + env(safe-area-inset-bottom));}
.imsg-form{display:flex;align-items:flex-end;gap:8px;padding:8px 12px;}
.imsg-plus{width:32px;height:32px;border-radius:50%;border:1.5px solid #c7c7cc;color:#8e8e93;font-size:20px;display:grid;place-items:center;flex:0 0 auto;line-height:1;}
#input{flex:1 1 auto;max-height:130px;min-height:36px;padding:7px 14px;border:1px solid var(--line);border-radius:18px;background:#fff;outline:none;resize:none;line-height:1.4;}
#input:focus{border-color:#0b93f6;}
#sendBtn{width:32px;height:32px;border-radius:50%;background:#0b93f6;color:#fff;font-size:17px;display:grid;place-items:center;flex:0 0 auto;}
#sendBtn:disabled{opacity:.3;cursor:not-allowed;}
.func-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;border-bottom:1px solid var(--line);background:#fafafa;}
.func-panel[hidden]{display:none;}
.func-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:11px;color:#333;}
.func-btn .fi{font-size:16px;font-weight:600;color:#555;}

/* ====== 微信 ====== */
.wx-top{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:#EDEDED;border-bottom:1px solid #d9d9d9;position:relative;}
.wx-title{font-size:17px;font-weight:600;}
.wx-top .back{position:absolute;left:6px;color:#333;}
.wx-body{flex:1 1 auto;overflow-y:auto;background:#EDEDED;-webkit-overflow-scrolling:touch;}
.wx-tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:#F7F7F7;border-top:1px solid #d9d9d9;
  padding-bottom:calc(4px + env(safe-area-inset-bottom));}
.wx-tabbar button{padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#7a7a7a;}
.wx-tabbar button.active{color:#07c160;}
.wx-tabbar .ti{font-size:16px;line-height:1;font-weight:600;}
.wx-chat-item{display:flex;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid #f0f0f0;align-items:center;cursor:pointer;}
.wx-chat-item:active{background:#f2f2f2;}
.wx-avatar{width:46px;height:46px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:600;flex:0 0 auto;}
.wx-info{flex:1 1 auto;min-width:0;}
.wx-name{font-size:16px;font-weight:500;color:#1a1a1a;}
.wx-preview{font-size:13px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.wx-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:#b2b2b2;flex:0 0 auto;}
.wx-badge{background:#fa5151;color:#fff;border-radius:9px;min-width:18px;height:18px;padding:0 5px;font-size:11px;display:grid;place-items:center;}
.wx-cell{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #f0f0f0;font-size:16px;cursor:pointer;}
.wx-cell:active{background:#f2f2f2;}
.wx-cell .ci{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;}
.wx-cell .arrow{margin-left:auto;color:#c8c8cd;font-size:16px;}
.wx-chat-body{flex:1 1 auto;overflow-y:auto;background:#EDEDED;padding:14px 12px;-webkit-overflow-scrolling:touch;}
.wx-msg{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;}
.wx-msg.me{flex-direction:row-reverse;}
.wx-msg .av{width:36px;height:36px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:0 0 auto;}
.wx-msg .bb{max-width:66%;padding:9px 12px;border-radius:6px;background:#fff;font-size:15px;line-height:1.45;word-break:break-word;}
.wx-msg.me .bb{background:#95EC69;color:#111;}
.wx-msg .bb img{border-radius:4px;max-height:220px;object-fit:cover;}
.wx-msg.sys{justify-content:center;}
.wx-msg.sys .bb{background:transparent;color:#999;font-size:12px;text-align:center;padding:4px 12px;max-width:90%;}
.wx-composer{flex:0 0 auto;background:#F7F7F7;border-top:1px solid #d9d9d9;display:flex;gap:8px;padding:8px 12px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));align-items:flex-end;}
.wx-composer textarea{flex:1 1 auto;border:none;border-radius:5px;padding:8px 10px;background:#fff;outline:none;resize:none;max-height:110px;min-height:36px;line-height:1.4;}
.wx-send{background:#07c160;color:#fff;border-radius:5px;padding:8px 16px;font-size:14px;flex:0 0 auto;}
.wx-send:disabled{opacity:.4;}

/* 朋友圈 */
.moments-body{flex:1 1 auto;overflow-y:auto;background:#fff;}
.moments-head{height:200px;background:linear-gradient(135deg,#0b93f6,#5ac8fa);position:relative;}
.moments-head .mc-av{position:absolute;right:16px;bottom:-24px;width:52px;height:52px;border-radius:8px;
  background:#fff;display:grid;place-items:center;font-size:18px;color:#0b93f6;font-weight:600;
  border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.moment{display:flex;gap:10px;padding:16px;border-bottom:1px solid #f2f2f2;}
.moment .av{width:42px;height:42px;border-radius:5px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
.moment .ct{flex:1 1 auto;min-width:0;}
.moment .nm{color:#576b95;font-size:15px;font-weight:500;margin-bottom:4px;}
.moment .tx{font-size:15px;line-height:1.5;margin-bottom:8px;word-break:break-word;color:#1a1a1a;white-space:pre-wrap;}
.moment .imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;max-width:280px;}
.moment .imgs img{aspect-ratio:1;border-radius:3px;object-fit:cover;width:100%;}
.moment .imgs div{aspect-ratio:1;border-radius:3px;background:linear-gradient(135deg,#d8e8ff,#b8d4ff);}
.moment .ft{display:flex;justify-content:space-between;font-size:12px;color:#b2b2b2;}
.moment .acts{display:flex;gap:14px;color:#576b95;font-size:13px;margin-top:2px;}
.moment .acts button{color:#576b95;font-size:13px;}
.moment .likes{background:#f7f7f7;border-radius:4px;padding:6px 8px;font-size:13px;color:#576b95;margin-top:6px;line-height:1.6;}
.moment .comments{margin-top:4px;}
.moment .cmt{background:#f7f7f7;border-radius:4px;padding:6px 8px;font-size:13px;line-height:1.6;margin-bottom:2px;}
.moment .cmt b{color:#576b95;font-weight:500;margin-right:4px;}

/* ====== 音乐 ====== */
.net-top{flex:0 0 auto;background:linear-gradient(180deg,#e60026,#c20c0c);color:#fff;
  padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;display:flex;align-items:center;gap:10px;}
.net-top .back{color:#fff;}
.net-top h1{font-size:17px;margin:0;font-weight:600;}
.net-body{flex:1 1 auto;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch;}
.net-banner{margin:16px 16px 4px;height:120px;border-radius:10px;background:linear-gradient(135deg,#ff5f6d,#ffc371);display:flex;align-items:center;padding:0 20px;color:#fff;}
.net-banner b{font-size:20px;display:block;}
.net-banner span{font-size:13px;opacity:.9;}
.net-section{padding:16px;}
.net-section h3{margin:0 0 12px;font-size:16px;color:#111;}
.song{display:flex;gap:12px;padding:8px 0;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer;}
.song:active{background:#fafafa;}
.song .num{width:22px;text-align:center;color:#999;font-size:13px;flex:0 0 auto;}
.song .thumb{width:44px;height:44px;border-radius:4px;background:linear-gradient(135deg,#ff5f6d,#ffc371);flex:0 0 auto;}
.song .info{flex:1 1 auto;min-width:0;}
.song .ttl{font-size:15px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song .art{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.song.playing .ttl{color:#e60026;}
.net-player{flex:0 0 auto;background:#f7f7f7;border-top:1px solid #eee;display:flex;align-items:center;gap:12px;padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.net-player .pthumb{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff5f6d,#ffc371);flex:0 0 auto;}
.net-player.playing .pthumb{animation:spin 8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.net-player .pinfo{flex:1 1 auto;min-width:0;}
.net-player .pt{font-size:14px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.net-player .pa{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.net-player .pbtn{width:36px;height:36px;border-radius:50%;background:#e60026;color:#fff;display:grid;place-items:center;font-size:16px;flex:0 0 auto;}

/* ====== 设置 ====== */
.set-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#f7f7f8;border-bottom:1px solid var(--line);}
.set-top h1{font-size:17px;margin:0;font-weight:600;}
.set-body{flex:1 1 auto;overflow-y:auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom));background:#f7f7f8;-webkit-overflow-scrolling:touch;}
.set-group{background:#fff;border-radius:12px;margin-bottom:18px;overflow:hidden;}
.set-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f2f2f4;cursor:pointer;min-height:50px;}
.set-item:last-child{border-bottom:none;}
.set-item:active{background:#f5f5f7;}
.set-item .si{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:0 0 auto;}
.set-item .st{flex:1 1 auto;font-size:16px;color:#1c1c1e;}
.set-item .sv{color:#8e8e93;font-size:15px;max-width:52%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.set-item .arrow{color:#c8c8cd;font-size:17px;margin-left:2px;}
.set-title{font-size:13px;color:#8e8e93;margin:0 4px 8px;}

.btn{padding:9px 16px;border-radius:10px;background:var(--bg-3);font-size:14px;color:#1c1c1e;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.block{width:100%;}

.rule{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}

.empty-hint{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}

/* ====== 字卡库 ====== */
.card-tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-bottom:1px solid var(--line);}
.card-tabs button{padding:12px 0;font-size:14px;color:#666;border-bottom:2px solid transparent;font-weight:500;}
.card-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
.card-tools{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);}
.card-tools input[type=search]{flex:1 1 auto;padding:7px 12px;border:1px solid var(--line);border-radius:18px;outline:none;background:#f7f7f8;font-size:14px;min-width:0;}
.card-tools input:focus{border-color:var(--accent);}
.card-tools .ctool{padding:7px 12px;border-radius:18px;background:#f2f2f4;font-size:13px;color:#333;white-space:nowrap;flex:0 0 auto;}
.card-tools .ctool.active{background:var(--accent);color:#fff;}
.card-batch-bar{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:10px 12px;
  background:#fff;border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.card-batch-bar[hidden]{display:none;}
.card-batch-bar button{padding:7px 12px;border-radius:8px;background:#f2f2f4;font-size:13px;color:#333;}
.card-batch-bar button.danger{color:var(--danger);}
.card-batch-bar span{margin-left:auto;font-size:12px;color:var(--muted);}
.card-list-wrap{flex:1 1 auto;overflow-y:auto;background:#f7f7f8;-webkit-overflow-scrolling:touch;padding:12px;}
.card-list-wrap .group-title{font-size:12px;color:var(--muted);margin:12px 4px 8px;}
.word-card{border-radius:12px;padding:14px;color:#fff;font-size:15px;line-height:1.6;margin-bottom:8px;
  white-space:pre-wrap;word-break:break-word;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.word-card .del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.2);color:#fff;font-size:13px;display:grid;place-items:center;}
.card-item-wrap{position:relative;display:flex;align-items:stretch;gap:8px;margin-bottom:8px;}
.card-item-wrap .cb{flex:0 0 24px;display:flex;align-items:center;justify-content:center;}
.card-item-wrap .cb input{width:18px;height:18px;}
.card-item-wrap .body{flex:1 1 auto;min-width:0;}
.card-item-wrap.sel .word-card,.card-item-wrap.sel .sticker-card{outline:3px solid var(--accent);}
.sticker-card{background:#fff;border-radius:12px;padding:8px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 6px rgba(0,0,0,.06);position:relative;}
.sticker-card img{width:60px;height:60px;object-fit:contain;border-radius:8px;background:#f7f7f8;flex:0 0 auto;}
.sticker-card .name{flex:1 1 auto;font-size:13px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sticker-card .del{width:24px;height:24px;border-radius:50%;background:#f2f2f4;color:#999;font-size:14px;flex:0 0 auto;}

/* ====== 经期/倒数日/信箱 ====== */
.period-hero{background:linear-gradient(135deg,#ff6b9d,#ff9ec4);border-radius:16px;padding:22px 18px;color:#fff;margin-bottom:16px;box-shadow:0 6px 20px rgba(255,107,157,.3);}
.period-hero .big{font-size:38px;font-weight:700;line-height:1.1;}
.period-hero .sub{font-size:13px;opacity:.92;margin-top:6px;}
.period-stat{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
.period-stat .box{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.period-stat .box b{display:block;font-size:20px;color:#ff4d8d;margin-bottom:2px;}
.period-stat .box span{font-size:12px;color:var(--muted);}
.history-item{display:flex;justify-content:space-between;padding:12px 14px;background:#fff;border-radius:10px;margin-bottom:8px;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.history-item .del{color:var(--danger);font-size:13px;}
.form-panel{background:#fff;border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.form-panel label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px;}
.form-panel input[type=text],.form-panel input[type=date],.form-panel input[type=datetime-local]{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff;margin-bottom:12px;font-size:15px;}
.form-panel textarea{width:100%;min-height:80px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;outline:none;resize:vertical;line-height:1.5;margin-bottom:12px;font-size:15px;}
.form-panel input:focus,.form-panel textarea:focus{border-color:var(--accent);}
.cd-item{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.06);}

/* ====== 弹窗 ====== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-mask[hidden]{display:none;}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:360px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);max-height:85vh;overflow-y:auto;}
.modal-box h3{margin:0 0 14px;font-size:16px;text-align:center;font-weight:600;}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;outline:none;margin-bottom:10px;font-size:14px;background:#fff;}
.modal-box input:focus,.modal-box textarea:focus{border-color:var(--accent);}
.modal-box textarea{min-height:80px;resize:vertical;line-height:1.5;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-actions button{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:500;}
.modal-actions .cancel{background:#f2f2f4;color:#333;}
.modal-actions .ok{background:var(--accent);color:#fff;}
.modal-actions .ok.green{background:var(--wechat);}
.modal-actions .ok.red{background:var(--danger);}
.modal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.modal-grid button{padding:14px 0;border-radius:10px;background:#f7f7f8;font-size:13px;color:#333;}

/* ====== 通话界面 ====== */
.call-screen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1c1c1e,#000);color:#fff;align-items:center;padding-top:calc(env(safe-area-inset-top) + 80px);}
.call-screen[hidden]{display:none;}
.call-avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#0b93f6,#5ac8fa);display:grid;place-items:center;font-size:40px;font-weight:600;margin-bottom:20px;}
.call-name{font-size:24px;font-weight:600;margin-bottom:8px;}
.call-status{font-size:15px;color:#ccc;margin-bottom:auto;}
.call-actions{display:flex;gap:50px;padding-bottom:calc(env(safe-area-inset-bottom) + 60px);}
.call-btn{width:70px;height:70px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:2px;}
.call-btn.hangup{background:#ff3b30;color:#fff;}
.call-btn.mute{background:rgba(255,255,255,.15);color:#fff;}
.call-btn.min{background:rgba(255,255,255,.15);color:#fff;}
.call-btn .ci{font-size:22px;line-height:1;}

.call-float{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:1001;
  background:#1c1c1e;color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;min-width:160px;}

</style>
</head>

<script>
(() => {
'use strict';

const DB_NAME = 'qiyе';
const DB_VERSION = 4;
const PAGE_SIZE = 60;

const DEFAULT_SETTINGS = {
  myName: '我', peerName: '梦', peerAvatar: '梦',
  autoReplyEnabled: true, delayMin: 600, delayMax: 1400,
  wallpaper: 'white', accent: '#0b93f6', periodCycle: 28,
  blockedByMe: false, blockedByThem: false,
  notificationsEnabled: false, bgKeepAlive: false,
};

const APPS = [
  { id:'messages',  name:'信息',   icon:'信', bg:'linear-gradient(135deg,#34c759,#30d158)' },
  { id:'wechat',    name:'微信',   icon:'微', bg:'linear-gradient(135deg,#07c160,#10d56a)' },
  { id:'music',     name:'音乐',   icon:'乐', bg:'linear-gradient(135deg,#e60026,#c20c0c)' },
  { id:'settings',  name:'设置',   icon:'设', bg:'linear-gradient(135deg,#8e8e93,#a1a1a6)' },
  { id:'cards',     name:'字卡库', icon:'字', bg:'linear-gradient(135deg,#ff9500,#ffb340)' },
  { id:'period',    name:'经期',   icon:'期', bg:'linear-gradient(135deg,#ff6b9d,#ff9ec4)' },
  { id:'countdown', name:'倒数日', icon:'日', bg:'linear-gradient(135deg,#5856d6,#7a78ff)' },
  { id:'mailbox',   name:'信箱',   icon:'箱', bg:'linear-gradient(135deg,#af52de,#c77dff)' },
];
const DOCK_APPS = ['messages','wechat','music','settings'];
const WALLPAPERS = [
  { id:'white', name:'纯白', css:'#ffffff', dark:false },
  { id:'gray',  name:'浅灰', css:'linear-gradient(180deg,#f5f5f7,#e8e8ed)', dark:false },
  { id:'dawn',  name:'晨雾', css:'linear-gradient(180deg,#ffeef2,#e8f0ff)', dark:false },
  { id:'mint',  name:'薄荷', css:'linear-gradient(180deg,#e8fff4,#e0f0ff)', dark:false },
  { id:'night', name:'夜',   css:'linear-gradient(180deg,#1c1c1e,#2c2c34)', dark:true  },
];
const ACCENTS = ['#0b93f6','#07c160','#e60026','#af52de','#ff9500'];
const CARD_COLORS = ['#0b93f6','#07c160','#ff9500','#af52de','#ff2d55','#1c1c1e'];
const SONGS = [
  { t:'起风了', a:'买辣椒也用券' },{ t:'孤勇者', a:'陈奕迅' },{ t:'夜航星', a:'苏运莹' },
  { t:'晴天', a:'周杰伦' },{ t:'后来', a:'刘若英' },{ t:'漠河舞厅', a:'柳爽' },
  { t:'海底', a:'一支榴莲' },{ t:'这世界那么多人', a:'莫文蔚' },{ t:'星辰大海', a:'黄霄雲' },{ t:'岁月神偷', a:'金玟岐' },
];
const IMSG_FUNCS = [
  { id:'survey', name:'问卷' },{ id:'photo', name:'照片' },{ id:'choose', name:'择决' },
  { id:'call', name:'电话' },{ id:'shoot', name:'拍摄' },{ id:'pat', name:'拍一拍' },
];
const WX_FUNCS = [
  { id:'survey', name:'问卷' },{ id:'photo', name:'照片' },{ id:'choose', name:'择决' },
  { id:'call', name:'电话' },{ id:'shoot', name:'拍摄' },{ id:'pat', name:'拍一拍' },
  { id:'transfer', name:'转账' },{ id:'redpacket', name:'红包' },
];
const MOMENT_IMG_PRESETS = [
  'linear-gradient(135deg,#ff9a9e,#fad0c4)',
  'linear-gradient(135deg,#a1c4fd,#c2e9fb)',
  'linear-gradient(135deg,#d4fc79,#96e6a1)',
  'linear-gradient(135deg,#fbc2eb,#a6c1ee)',
  'linear-gradient(135deg,#ffecd2,#fcb69f)',
  'linear-gradient(135deg,#84fab0,#8fd3f4)',
];

/* ======================= 工具 ======================= */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const pickOne = a => Array.isArray(a)&&a.length ? a[Math.floor(Math.random()*a.length)] : null;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clampInt = (v,min,max,fb)=>{const n=parseInt(v,10);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):fb;};

/* ======================= DB ======================= */
let db = null;
function openDB() {
  return new Promise((resolve,reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('messages')) {
        const s = d.createObjectStore('messages',{keyPath:'id',autoIncrement:true});
        s.createIndex('ts','ts');
      }
      ['autoreply','letters','cards','periods','countdowns','wxMessages','wxFriends','moments','calls']
        .forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'id',autoIncrement:true}); });
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings',{keyPath:'key'});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const os = (n,m='readonly') => db.transaction(n,m).objectStore(n);
const pr = req => new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});

let settings = {...DEFAULT_SETTINGS};
async function loadSettings() {
  const row = await pr(os('settings').get('main'));
  if (row && row.value) settings = {...DEFAULT_SETTINGS, ...row.value};
}
const saveSettings = () => pr(os('settings','readwrite').put({key:'main',value:settings}));

/* ======================= 消息 ======================= */
async function addMessage(m) {
  const id = await pr(os('messages','readwrite').add(m));
  return {...m, id};
}
function pageMessages(before) {
  return new Promise((res,rej) => {
    const out = [];
    const range = (before == null) ? null : IDBKeyRange.upperBound(before,true);
    const req = os('messages').openCursor(range,'prev');
    req.onsuccess = e => {
      const cur = e.target.result;
      if (!cur || out.length >= PAGE_SIZE) { res(out.reverse()); return; }
      out.push(cur.value); cur.continue();
    };
    req.onerror = () => rej(req.error);
  });
}

/* ======================= 导航 ======================= */
const stack = ['home'];
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>{s.hidden=true;});
  const el = document.getElementById(id);
  if (el) el.hidden = false;
}
function go(id) { if (stack[stack.length-1]===id) return; stack.push(id); showScreen(id); }
function back() {
  if (stack.length<=1) return;
  stack.pop();
  showScreen(stack[stack.length-1]);
  if (stack[stack.length-1]==='app-messages') scrollToBottom();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-back]');
  if (b) { e.preventDefault(); back(); }
});

/* ======================= 格式化 ======================= */
function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.toDateString()===now.toDateString()) return t;
  return `${d.getMonth()+1}月${d.getDate()}日 ${t}`;
}
function fmtFull(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(ts) { const d=new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function countdown(ms) {
  const s = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  if (d>0) return `${d} 天 ${h} 小时`;
  if (h>0) return `${h} 小时 ${m} 分`;
  return `${m} 分`;
}

/* ======================= 通知 ======================= */
function notify(title, body) {
  if (!settings.notificationsEnabled) return;
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    try { new Notification(title, { body, tag:'qiyе' }); } catch {}
  }
}

/* ======================= 桌面 ======================= */
const homeEl = $('#home');
function buildAppIcon(app, inDock) {
  const btn = document.createElement('button');
  btn.className = 'app-icon'; btn.type = 'button'; btn.dataset.app = app.id;
  btn.innerHTML = `<span class="ico" style="background:${app.bg}">${app.icon}</span>` +
                  (inDock ? '' : `<span class="lbl">${app.name}</span>`);
  return btn;
}
function renderHome() {
  const grid = $('#appGrid'), dock = $('#dock');
  grid.replaceChildren(); dock.replaceChildren();

const state = { oldestId:null, hasMore:true, loading:false, typingEl:null, replyBusy:false };

function buildMessageEl(m) {
  const el = document.createElement('div');
  el.className = 'msg ' + (m.role === 'me' ? 'me' : 'them');
  el.dataset.id = m.id;

  if (m.type === 'system') {
    const b = document.createElement('div');
    b.className = 'sys-bubble'; b.textContent = m.text;
    el.appendChild(b);
  } else if (m.type === 'image') {
    const b = document.createElement('div');
    b.className = 'img-bubble';
    const img = document.createElement('img');
    img.src = m.text; img.alt = '图片';
    b.appendChild(img);
    el.appendChild(b);
  } else {
    const b = document.createElement('div');
    b.className = 'bubble'; b.textContent = m.text;
    el.appendChild(b);
  }

  const time = document.createElement('time');
  time.textContent = fmtTime(m.ts);
  el.appendChild(time);
  return el;
}
const isNearBottom = () => messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
function scrollToBottom(smooth=false) { messagesEl.scrollTo({top:messagesEl.scrollHeight,behavior:smooth?'smooth':'auto'}); }
function appendMessageEl(m) {
  const stick = isNearBottom();
  messagesEl.appendChild(buildMessageEl(m));
  if (stick || m.role === 'me') scrollToBottom();
}
async function initChat() {
  const msgs = await pageMessages(null);
  state.oldestId = msgs.length ? msgs[0].id : null;
  state.hasMore = msgs.length === PAGE_SIZE;
  const frag = document.createDocumentFragment();
  msgs.forEach(m=>frag.appendChild(buildMessageEl(m)));
  messagesEl.replaceChildren(frag);
  scrollToBottom();
}
async function loadOlder() {
  if (state.loading || !state.hasMore) return;
  state.loading = true;
  try {
    const msgs = await pageMessages(state.oldestId);
    if (!msgs.length) { state.hasMore = false; return; }
    const prevH = messagesEl.scrollHeight, prevT = messagesEl.scrollTop;
    const frag = document.createDocumentFragment();
    msgs.forEach(m=>frag.appendChild(buildMessageEl(m)));
    messagesEl.insertBefore(frag, messagesEl.firstChild);
    state.oldestId = msgs[0].id;
    if (msgs.length < PAGE_SIZE) state.hasMore = false;
    messagesEl.scrollTop = prevT + (messagesEl.scrollHeight - prevH);
  } finally { state.loading = false; }
}
messagesEl.addEventListener('scroll', ()=>{ if (messagesEl.scrollTop<80) loadOlder(); }, {passive:true});

function autoGrow() { inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,130)+'px'; }

function readImage(file) {
  return new Promise((resolve)=>{
    if (!file || !file.type.startsWith('image/')) { resolve(null); return; }
    if (file.size > 800*1024) { alert('图片过大（>800KB）'); resolve(null); return; }
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>resolve(null);
    r.readAsDataURL(file);
  });
}

/* ======================= 自动回复（字卡库驱动）+ 概率拉黑 ======================= */
async function getCardsByType(type) {
  const all = await pr(os('cards').getAll());
  return all.filter(c=>(c.type || 'card') === type);
}

async function maybeAutoReply(platform, userText) {
  if (settings.blockedByThem) return;
  if (!settings.autoReplyEnabled) return;

  /* 概率拉黑：每次发消息 ~4% */
  if (Math.random() < 0.04) {
    settings.blockedByThem = true;
    await saveSettings();
    if (platform === 'imsg') {
      const m = await addMessage({role:'them', type:'system', text:`${settings.peerName} 已拉黑你`, ts:Date.now()});
      appendMessageEl(m);
    } else if (platform === 'wx' && wxCurrent) {
      await sendWxMessage('them', {type:'system', text:`${wxCurrent.name} 已拉黑你`}, wxCurrent);
    }
    return;
  }

  const cards = await getCardsByType('card');
  const stickers = await getCardsByType('sticker');
  let reply = null, replyType = 'text';
  if (cards.length && Math.random() < 0.8) reply = pickOne(cards).text;
  else if (stickers.length) { reply = pickOne(stickers).data; replyType = 'image'; }
  else if (cards.length) reply = pickOne(cards).text;
  if (!reply) return;

  const delay = settings.delayMin + Math.random() * Math.max(0, settings.delayMax - settings.delayMin);

  if (platform === 'imsg') {
    if (state.replyBusy) return;
    state.replyBusy = true;
    showTyping();
    try {
      await sleep(delay);
      hideTyping();
      const m = await addMessage({role:'them', type:replyType==='image'?'image':'text', text:reply, ts:Date.now()});
      appendMessageEl(m);
      notify('信息', replyType==='image'?'[图片]':reply.slice(0,40));
    } finally { state.replyBusy = false; hideTyping(); }
  } else if (platform === 'wx' && wxCurrent) {
    setTimeout(async ()=>{
      await sendWxMessage('them', replyType==='image'?{type:'image',text:reply}:{type:'text',text:reply}, wxCurrent);
      notify('微信', replyType==='image'?'[图片]':reply.slice(0,40));
    }, delay);
  }
}

function showTyping() {
  if (state.typingEl) return;
  const el = document.createElement('div');
  el.className = 'typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(el);
  state.typingEl = el;
  if (isNearBottom()) scrollToBottom();
}
function hideTyping() { if (state.typingEl) { state.typingEl.remove(); state.typingEl = null; } }

  modalBox.innerHTML = html + `

      <button class="cancel" id="modalCancel" type="button">取消</button>
      <button class="ok ${okClass}" id="modalOk" type="button">${okText}</button>
    </div>`;
  modalMask.hidden = false;
  return new Promise(res=>{
    const close = v => { modalMask.hidden = true; res(v); };
    $('#modalCancel').addEventListener('click', ()=>close(null));
    $('#modalOk').addEventListener('click', ()=>{
      if (onOk) { const r = onOk(); if (r === false) return; }
      close(true);

}

async function startCall() {

  $('#callAvatar').textContent = settings.peerName.slice(0,1);
  $('#callName').textContent = settings.peerName;
  $('#cfAv').textContent = settings.peerName.slice(0,1);
  $('#cfName').textContent = settings.peerName;
  $('#callStatus').textContent = '正在呼叫…';
  $('#cfTime').textContent = '00:00';
  $('#callScreen').hidden = false;
  $('#callFloat').hidden = true;

  setTimeout(()=>{
    if (!callState.active) return;
    callState.connected = true;
    callState.startedAt = Date.now();
    $('#callStatus').textContent = '通话中 00:00';
    callState.timer = setInterval(()=>{
      if (!callState.active) return;
      const s = Math.floor((Date.now()-callState.startedAt)/1000);
      const t = `${pad(Math.floor(s/60))}:${pad(s%60)}`;
      $('#callStatus').textContent = '通话中 ' + t;
      $('#cfTime').textContent = t;
    }, 1000);
  }, 2500);
}
function endCall() {
  if (callState.timer) clearInterval(callState.timer);
  callState.active = false;
  callState.connected = false;
  $('#callScreen').hidden = true;
  $('#callFloat').hidden = true;
}
function minimizeCall() {
  if (!callState.active) return;
  callState.minimized = true;
  $('#callScreen').hidden = true;
  $('#callFloat').hidden = false;
}
function restoreCall() {
  if (!callState.active) return;
  callState.minimized = false;
  $('#callScreen').hidden = false;
  $('#callFloat').hidden = true;
}
$('#callHangup').addEventListener('click', endCall);
$('#cfHangup').addEventListener('click', e=>{ e.stopPropagation(); endCall(); });
$('#callMin').addEventListener('click', minimizeCall);
$('#callFloat').addEventListener('click', e=>{ if (e.target.id !== 'cfHangup') restoreCall(); });
$('#callMute').addEventListener('click', e=>{
  e.target.closest('.call-btn').style.opacity = e.target.closest('.call-btn').style.opacity === '0.5' ? '1' : '0.5';
});

const MOMENT_IMAGES = [];

async function getMoments() {
  const all = await pr(os('moments').getAll());
  return all.sort((a,b)=>b.ts-a.ts);
}

async function renderMomentsList() {
  const list = $('#momentsList');
  list.replaceChildren();
  const head = document.createElement('div');
  head.className = 'moments-head';
  head.innerHTML = `<div class="mc-av">${esc(settings.myName.slice(0,1))}</div>`;
  list.appendChild(head);

  const moments = await getMoments();
  if (!moments.length) {
    const d = document.createElement('p');
    d.className='empty-hint'; d.style.margin='60px 0';
    d.textContent = '还没有朋友圈，点右上角＋发布吧';
    list.appendChild(d);
    return;
  }
  for (const m of moments) list.appendChild(buildMomentEl(m));
}

function buildMomentEl(m) {
  const el = document.createElement('div');
  el.className = 'moment';
  const isMe = m.author === 'me';
  const av = isMe ? { t: settings.myName.slice(0,1), c:'#0b93f6' } : { t: settings.peerName.slice(0,1), c:'#07c160' };
  const name = isMe ? settings.myName : settings.peerName;

  let imgsHtml = '';
  if (m.images && m.images.length) {
    imgsHtml = '<div class="imgs">' + m.images.map(im=>{
      if (im.startsWith('data:')) return `<img src="${im}" alt="图片">`;
      return `<div style="background:${im}"></div>`;
    }).join('') + '</div>';
  }
  let likesHtml = '';
  if (m.likes && m.likes.length) {
    likesHtml = `<div class="likes">♥ ${m.likes.map(w=>esc(w==='me'?settings.myName:settings.peerName)).join('，')}</div>`;
  }
  let commentsHtml = '';
  if (m.comments && m.comments.length) {
    commentsHtml = '<div class="comments">' + m.comments.map(c=>
      `<div class="cmt"><b>${esc(c.who==='me'?settings.myName:settings.peerName)}</b>${esc(c.text)}</div>`
    ).join('') + '</div>';
  }

  el.innerHTML = `
    <div class="av" style="background:${av.c}">${esc(av.t)}</div>
    <div class="ct">
      <div class="nm">${esc(name)}</div>
      <div class="tx">${esc(m.text||'')}</div>
      ${imgsHtml}
      <div class="ft"><span>${fmtTime(m.ts)}</span></div>
      <div class="acts">
        <button type="button" data-act="like" data-id="${m.id}">${(m.likes||[]).includes('me')?'取消赞':'赞'}</button>
        <button type="button" data-act="comment" data-id="${m.id}">评论</button>
      </div>
      ${likesHtml}
      ${commentsHtml}
    </div>`;
  el.querySelector('[data-act="like"]').addEventListener('click', ()=>toggleMomentLike(m.id));
  el.querySelector('[data-act="comment"]').addEventListener('click', ()=>commentMoment(m.id));
  return el;
}

async function toggleMomentLike(id) {
  const m = await pr(os('moments').get(id));
  if (!m) return;
  m.likes = m.likes || [];
  const idx = m.likes.indexOf('me');
  if (idx >= 0) m.likes.splice(idx,1);
  else m.likes.push('me');
  await pr(os('moments','readwrite').put(m));
  renderMomentsList();
}

async function commentMoment(id) {
  const m = await pr(os('moments').get(id));
  if (!m) return;
  await showModal(`<h3>评论</h3><input type="text" id="cmtText" placeholder="说点什么…">`, ()=>{
    const text = $('#cmtText').value.trim();
    if (!text) return false;
    m.comments = m.comments || [];
    m.comments.push({who:'me', text, ts:Date.now()});
    pr(os('moments','readwrite').put(m)).then(()=>renderMomentsList());
  });
}

async function maybeThemInteract(momentId) {

  if (Math.random() < 0.6) {

    if (!m.likes.includes('them')) m.likes.push('them');
  }
  if (Math.random() < 0.4) {
    const cards = await getCardsByType('card');
    if (cards.length) {
      m.comments = m.comments || [];
      m.comments.push({who:'them', text: pickOne(cards).text, ts:Date.now()});

  await pr(os('moments','readwrite').put(m));
  renderMomentsList();
}

async function exportBackup() {
  const data = {
    exportedAt: new Date().toISOString(),
    settings,
    messages:  await pr(os('messages').getAll()),
    letters:   await pr(os('letters').getAll()),
    cards:     await pr(os('cards').getAll()),
    periods:   await pr(os('periods').getAll()),
    countdowns:await pr(os('countdowns').getAll()),
    wxFriends: await pr(os('wxFriends').getAll()),
    wxMessages:await pr(os('wxMessages').getAll()),
    moments:   await pr(os('moments').getAll()),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `qiyе-backup-${Date.now()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function importBackup() {
  const input = document.createElement('input');
  input.type='file'; input.accept='.json,application/json';
  input.addEventListener('change', async ()=>{
    const f = (input.files||[])[0]; if (!f) return;
    try {
      const text = await f.text();
      const data = JSON.parse(text);
      if (!confirm('导入将覆盖当前所有数据，确定吗？')) return;
      settings = {...DEFAULT_SETTINGS, ...(data.settings||{})};
      await saveSettings();
      const stores = ['messages','letters','cards','periods','countdowns','wxFriends','wxMessages','moments'];
      for (const s of stores) {
        if (Array.isArray(data[s])) {
          const st = os(s,'readwrite');
          await pr(st.clear());
          for (const item of data[s]) {
            const copy = {...item}; delete copy.id;
            await pr(st.add(copy));
          }
        }
      }
      alert('导入完成'); location.reload();
    } catch (err) { alert('导入失败：' + err.message); }
  });
  input.click();
}
async function clearAllData() {
  if (!confirm('将删除所有数据，且无法恢复。确定吗？')) return;
  if (!confirm('再次确认：不可撤销。')) return;
  const stores = ['messages','letters','settings','cards','periods','countdowns','wxFriends','wxMessages','moments'];
  await Promise.all(stores.map(s=>pr(os(s,'readwrite').clear())));
  location.reload();
}

/* ======================= 字卡库 ======================= */
let cardTab = 'card';
let cardSelectMode = false;
let cardSelected = new Set();
let cardSearchQuery = '';

function renderCardPage() {
  renderCardTabs();
  renderCardTools();
  renderCardList();
  renderCardBatchBar();
}
function renderCardTabs() {
  $$('.card-tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.cardtab === cardTab);
    b.onclick = () => { cardTab = b.dataset.cardtab; cardSelectMode = false; cardSelected.clear(); cardSearchQuery=''; $('#cardSearch').value=''; renderCardPage(); };
  });
}
function renderCardTools() {
  $('#cardSelectBtn').classList.toggle('active', cardSelectMode);
  $('#cardSelectBtn').textContent = cardSelectMode ? '完成' : '选择';
  $('#cardSearch').oninput = e => { cardSearchQuery = e.target.value.toLowerCase(); renderCardList(); };
  $('#cardDupBtn').onclick = () => doDedup();
  $('#cardAddBtn').onclick = () => doAddCards();
  $('#cardSelectBtn').onclick = () => { cardSelectMode = !cardSelectMode; cardSelected.clear(); renderCardPage(); };
  $('#cardBatchCancel').onclick = () => { cardSelectMode = false; cardSelected.clear(); renderCardPage(); };
  $('#cardBatchAll').onclick = () => {
    const all = $$('.card-item-wrap');
    const allSelected = all.every(w=>w.classList.contains('sel'));
    cardSelected.clear();
    if (!allSelected) all.forEach(w=>cardSelected.add(parseInt(w.dataset.id)));
    renderCardList(); renderCardBatchBar();
  };
  $('#cardBatchDel').onclick = () => doBatchDelete();
  $('#cardBatchGroup').onclick = () => doBatchGroup();
}
function renderCardBatchBar() {
  const bar = $('#cardBatchBar');
  bar.hidden = !cardSelectMode;
  $('#cardSelCount').textContent = `已选 ${cardSelected.size}`;
}
async function renderCardList() {
  const wrap = $('#cardListWrap');
  wrap.replaceChildren();
  const all = await pr(os('cards').getAll());
  let items = all.filter(c=>(c.type||'card') === cardTab);

  if (cardSearchQuery) {
    items = items.filter(c=>{
      const t = cardTab==='sticker' ? (c.name || '') : (c.text || '');
      return t.toLowerCase().includes(cardSearchQuery);
    });
  }

  if (!items.length) {
    const d = document.createElement('p');
    d.className='empty-hint';
    d.textContent = cardSearchQuery ? '没有匹配项' : '还没有内容，点击"增加"添加';
    wrap.appendChild(d);
    return;
  }

  /* 按分组归类 */
  const groups = {};
  items.forEach(c=>{
    const g = c.group || '';
    groups[g] = groups[g] || [];
    groups[g].push(c);
  });

  const sortedGroups = Object.keys(groups).sort((a,b)=>{
    if (!a) return 1; if (!b) return -1;
    return a.localeCompare(b);
  });

  for (const g of sortedGroups) {
    if (g) {
      const t = document.createElement('p');
      t.className='group-title';
      t.textContent = '分组：' + g;
      wrap.appendChild(t);
    }
    for (const c of groups[g]) wrap.appendChild(buildCardItem(c));
  }
}
function buildCardItem(c) {
  const wrap = document.createElement('div');
  wrap.className = 'card-item-wrap';
  wrap.dataset.id = c.id;

  if (cardSelectMode) {
    const cb = document.createElement('div');
    cb.className = 'cb';
    const input = document.createElement('input');
    input.type='checkbox';
    input.checked = cardSelected.has(c.id);
    input.addEventListener('change', ()=>{
      if (input.checked) cardSelected.add(c.id);
      else cardSelected.delete(c.id);
      wrap.classList.toggle('sel', input.checked);
      renderCardBatchBar();
    });
    cb.appendChild(input);
    wrap.appendChild(cb);
    if (input.checked) wrap.classList.add('sel');
  }

  const body = document.createElement('div');
  body.className = 'body';

  if (cardTab === 'sticker') {
    const card = document.createElement('div');
    card.className = 'sticker-card';
    card.innerHTML = `<img src="${c.data}" alt=""><span class="name">${esc(c.name||'未命名')}</span>`;
    if (!cardSelectMode) {
      const del = document.createElement('button');
      del.className='del'; del.type='button'; del.textContent='×';
      del.addEventListener('click', async ()=>{
        if (!confirm('删除这个表情包？')) return;
        await pr(os('cards','readwrite').delete(c.id));
        renderCardList();
      });
      card.appendChild(del);
    }
    body.appendChild(card);
  } else {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.style.background = c.color || CARD_COLORS[0];
    card.textContent = c.text;
    if (!cardSelectMode) {
      const del = document.createElement('button');
      del.className='del'; del.type='button'; del.textContent='×';
      del.addEventListener('click', async ()=>{
        if (!confirm('删除？')) return;
        await pr(os('cards','readwrite').delete(c.id));
        renderCardList();
      });
      card.appendChild(del);
    }
    body.appendChild(card);
  }

  wrap.appendChild(body);
  return wrap;
}
async function doAddCards() {
  if (cardTab === 'sticker') {
    const input = document.createElement('input');
    input.type='file'; input.accept='image/*'; input.multiple = true;
    input.addEventListener('change', async ()=>{
      const files = [...(input.files||[])];
      let ok = 0;
      for (const f of files) {
        const d = await readImage(f);
        if (!d) continue;
        await pr(os('cards','readwrite').add({
          type:'sticker', data:d, name:f.name || 'sticker', color:CARD_COLORS[0], createdAt:Date.now(),
        }));
        ok++;
      }
      alert(`已导入 ${ok} 张表情包`);
      renderCardList();
    });
    input.click();
    return;
  }

  const isPat = cardTab === 'pat';
  await showModal(`
    <h3>${isPat?'增加拍一拍':'增加字卡'}</h3>
    <textarea id="cAdd" placeholder="每行一条，可以批量添加" rows="6"></textarea>
  `, async ()=>{
    const text = $('#cAdd').value.trim();
    if (!text) return false;
    const lines = text.split('\n').map(s=>s.trim()).filter(Boolean);
    for (const t of lines) {
      await pr(os('cards','readwrite').add({
        type:cardTab, text:t, color:cardColor, createdAt:Date.now(),
      }));
    }
    renderCardList();
  });
  setTimeout(()=>{
    const wrap = modalBox.querySelector('#cAdd');
    if (wrap) {
      const colorRow = document.createElement('div');
      colorRow.className='color-row';
      colorRow.style.cssText = 'display:flex;gap:10px;margin-bottom:10px;';
      CARD_COLORS.forEach(c=>{
        const d = document.createElement('button');
        d.type='button';
        d.style.cssText = `width:26px;height:26px;border-radius:50%;background:${c};border:3px solid ${cardColor===c?'#1c1c1e':'transparent'};`;
        d.addEventListener('click', ()=>{ cardColor = c; $$('[data-color]', colorRow).forEach(x=>x.remove()); colorRow.querySelectorAll('button').forEach(bb=>bb.style.border = '3px solid transparent'); d.style.border = '3px solid #1c1c1e'; });
        colorRow.appendChild(d);
      });
      wrap.after(colorRow);
    }
  }, 0);
}
let cardColor = CARD_COLORS[0];

async function doDedup() {
  const all = await pr(os('cards').getAll());
  const items = all.filter(c=>(c.type||'card') === cardTab);
  const seen = new Map();
  const dups = [];
  for (const c of items) {
    const key = cardTab === 'sticker' ? (c.data || '') : (c.text || '');
    if (!key) continue;
    if (seen.has(key)) dups.push(c);
    else seen.set(key, c);
  }
  if (!dups.length) { alert('没有发现重复'); return; }
  if (!confirm(`发现 ${dups.length} 个重复，是否删除？`)) return;
  for (const c of dups) await pr(os('cards','readwrite').delete(c.id));
  alert(`已删除 ${dups.length} 个重复`);
  renderCardList();
}
async function doBatchDelete() {
  if (!cardSelected.size) { alert('请先勾选'); return; }
  if (!confirm(`删除选中的 ${cardSelected.size} 项？`)) return;
  for (const id of cardSelected) await pr(os('cards','readwrite').delete(id));
  cardSelected.clear();
  cardSelectMode = false;
  renderCardPage();
}
async function doBatchGroup() {
  if (!cardSelected.size) { alert('请先勾选'); return; }
  await showModal(`<h3>分组</h3><input type="text" id="grpName" placeholder="组名（留空则取消分组）">`, async ()=>{
    const name = $('#grpName').value.trim();
    for (const id of cardSelected) {
      const c = await pr(os('cards').get(id));
      if (c) { c.group = name || undefined; await pr(os('cards','readwrite').put(c)); }
    }
    cardSelected.clear();
    cardSelectMode = false;
    renderCardPage();
  });
}

/* ======================= 音乐 ======================= */
let currentSong = null, playing = false;
function renderMusic() {
  const list = $('#musicList');
  list.replaceChildren();
  SONGS.forEach((s,i)=>{
    const row = document.createElement('div');
    row.className = 'song' + (currentSong===s?' playing':'');
    row.innerHTML = `<span class="num">${i+1}</span><span class="thumb"></span>` +
      `<span class="info"><div class="ttl">${esc(s.t)}</div><div class="art">${esc(s.a)}</div></span>`;
    row.addEventListener('click', ()=>{
      currentSong = s; playing = true;
      $('#playerTitle').textContent = s.t;
      $('#playerArtist').textContent = s.a;
      $('#playerPlay').textContent = '⏸';
      $('#netPlayer').classList.add('playing');
      renderMusic();
    });
    list.appendChild(row);
  });
}
$('#playerPlay').addEventListener('click', ()=>{
  if (!currentSong) {
    currentSong = SONGS[0];
    $('#playerTitle').textContent = currentSong.t;
    $('#playerArtist').textContent = currentSong.a;
    playing = true;
  } else playing = !playing;
  $('#playerPlay').textContent = playing ? '⏸' : '▶';
  $('#netPlayer').classList.toggle('playing', playing);
});

/* ======================= 经期/倒数日/信箱 ======================= */
async function renderPeriod() {
  const list = (await pr(os('periods').getAll())).sort((a,b)=>b.start-a.start);
  const hero = $('#periodHero');
  const cycle = settings.periodCycle || 28;
  $('#pCycle').textContent = cycle;
  if (list.length) {
    const last = list[0].start;
    const next = last + cycle*86400000;
    const days = Math.ceil((next - Date.now())/86400000);
    hero.querySelector('.big').textContent = days>=0 ? days : Math.abs(days);
    hero.querySelector('.sub').textContent = days>=0 ? `距离下次预测还有 ${days} 天` : `已推迟 ${Math.abs(days)} 天`;
    $('#pNext').textContent = days>=0 ? `${days} 天` : `+${Math.abs(days)} 天`;
    $('#periodStart').value = fmtDate(last);
  } else {
    hero.querySelector('.big').textContent = '—';
    hero.querySelector('.sub').textContent = '还没有记录';
    $('#pNext').textContent = '—';
  }
  const hist = $('#periodHistory');
  hist.replaceChildren();
  if (!list.length) { const d=document.createElement('p'); d.className='empty-hint'; d.textContent='还没有记录'; hist.appendChild(d); return; }
  for (const p of list) {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `<span>${fmtDate(p.start)}</span>`;
    const del = document.createElement('button');
    del.className = 'del'; del.type = 'button'; del.textContent = '删除';
    del.addEventListener('click', async ()=>{ await pr(os('periods','readwrite').delete(p.id)); renderPeriod(); });
    item.appendChild(del);
    hist.appendChild(item);
  }
}
$('#addPeriod').addEventListener('click', async ()=>{
  const dateStr = $('#periodStart').value;
  const cycle = clampInt($('#periodCycle').value, 15, 60, 28);
  if (!dateStr) { alert('请选择日期'); return; }
  const start = new Date(dateStr+'T00:00:00').getTime();
  settings.periodCycle = cycle;
  await saveSettings();
  await pr(os('periods','readwrite').add({start, cycle, createdAt:Date.now()}));
  renderPeriod();
});
async function renderCountdown() {
  const items = (await pr(os('countdowns').getAll())).sort((a,b)=>a.date-b.date);
  const list = $('#cdList');
  list.replaceChildren();
  if (!items.length) { const d=document.createElement('p'); d.className='empty-hint'; d.textContent='还没有倒数日'; list.appendChild(d); return; }
  for (const it of items) {
    const days = Math.ceil((it.date - Date.now())/86400000);
    const el = document.createElement('div');
    el.className = 'cd-item';
    el.innerHTML = `<div class="cd-num"><b>${Math.abs(days)}</b><span>${days>=0?'天后':'天前'}</span></div>` +
      `<div class="cd-info"><div class="cd-name">${esc(it.name)}</div><div class="cd-date">${fmtDate(it.date)}</div></div>`;
    const del = document.createElement('button');
    del.className = 'del'; del.type='button'; del.textContent='删除';
    del.addEventListener('click', async ()=>{ await pr(os('countdowns','readwrite').delete(it.id)); renderCountdown(); });
    el.appendChild(del);
    list.appendChild(el);
  }
}
$('#addCd').addEventListener('click', async ()=>{
  const name = $('#cdName').value.trim();
  const dateStr = $('#cdDate').value;
  if (!name) { alert('请填写名称'); return; }
  if (!dateStr) { alert('请选择日期'); return; }
  const date = new Date(dateStr+'T00:00:00').getTime();
  await pr(os('countdowns','readwrite').add({name, date, createdAt:Date.now()}));
  $('#cdName').value = ''; $('#cdDate').value = '';
  renderCountdown();
});
async function renderLetters() {
  const letters = (await pr(os('letters').getAll())).sort((a,b)=>a.openAt-b.openAt);
  const listEl = $('#letterList');
  listEl.replaceChildren();
  if (!letters.length) { const d=document.createElement('p'); d.className='empty-hint'; d.textContent='还没有信件'; listEl.appendChild(d); return; }
  const now = Date.now();
  for (const l of letters) {
    const el = document.createElement('div');
    el.className = 'rule';
    const title = document.createElement('div');
    title.style.cssText = 'font-weight:600;font-size:15px;margin-bottom:4px;';
    title.textContent = (l.opened?'已拆 · ':'未拆 · ') + (l.title || '无标题');
    const meta = document.createElement('div');
    meta.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:10px;';
    const od = new Date(l.openAt);
    if (l.opened) meta.textContent = '已于 ' + fmtFull(od) + ' 拆开';
    else if (l.openAt > now) meta.textContent = '将于 ' + fmtFull(od) + ' 开启 · 还有 ' + countdown(l.openAt - now);
    else meta.textContent = '已到期，可以拆开了';
    const parts = [title, meta];
    if (l.opened) {
      const body = document.createElement('div');
      body.style.cssText = 'font-size:13px;white-space:pre-wrap;margin-bottom:10px;padding:10px;background:#f7f7f8;border-radius:8px;line-height:1.7;';
      body.textContent = l.content;
      parts.push(body);
    }
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:8px;';
    if (!l.opened && l.openAt <= now) {
      const b = document.createElement('button');
      b.className = 'btn primary'; b.type='button'; b.textContent = '拆开';
      b.addEventListener('click', ()=>openLetter(l));
      actions.appendChild(b);
    }
    const del = document.createElement('button');
    del.className = 'btn danger'; del.type='button'; del.textContent = '删除';
    del.addEventListener('click', async ()=>{ if (!confirm('确定删除？')) return; await pr(os('letters','readwrite').delete(l.id)); renderLetters(); });
    actions.appendChild(del);
    parts.push(actions);
    el.append(...parts);
    listEl.appendChild(el);
  }
}
async function openLetter(l) {
  l.opened = true;
  await pr(os('letters','readwrite').put(l));
  const m = await addMessage({role:'them', type:'text', text:`【信箱】${l.title||'无标题'}\n\n${l.content}`, ts:Date.now()});
  stack.length = 0; stack.push('home','app-messages');
  showScreen('app-messages');
  appendMessageEl(m);
  scrollToBottom(true);
  renderLetters();
}
$('#addLetter').addEventListener('click', async ()=>{
  const title = $('#letterTitle').value.trim();
  const content = $('#letterContent').value.trim();
  const openAtStr = $('#letterOpenAt').value;
  if (!content) { alert('请填写内容'); return; }
  if (!openAtStr) { alert('请选择开启时间'); return; }
  const openAt = new Date(openAtStr).getTime();
  if (openAt <= Date.now()) { alert('时间需晚于当前'); return; }
  await pr(os('letters','readwrite').add({title, content, openAt, createdAt:Date.now(), opened:false}));
  $('#letterTitle').value=''; $('#letterContent').value='';
  resetLetterTime();
  await renderLetters();
  alert('已封存');
});
function resetLetterTime() {
  const t = new Date(Date.now() + 86400000);
  const local = new Date(t.getTime() - t.getTimezoneOffset()*60000);
  $('#letterOpenAt').value = local.toISOString().slice(0,16);
}

/* ======================= 启动 ======================= */
async function seedWelcome() {
  const count = await pr(os('messages').count());
  if (count > 0) return;
  await addMessage({role:'them', type:'text', text:'晚上好呀，栖夜。', ts:Date.now()});
}
function updateClock() {
  const d = new Date();
  const el = $('#sbTime');
  if (el) el.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
async function boot() {
  try { db = await openDB(); }
  catch (err) {
    document.body.innerHTML = '<p style="padding:40px;color:#111;font-size:15px;line-height:1.8;">无法初始化本地数据库：' + esc(err) + '<br>请确认没有在无痕模式打开。</p>';
    return;
  }
  await loadSettings();
  applyPeer();
  applyAccent();
  await seedWelcome();
  renderHome();
  resetLetterTime();
  await initChat();
  updateClock();
  setInterval(updateClock, 30000);
  setInterval(() => { if (!$('#app-mailbox').hidden) renderLetters(); }, 30000);
  /* 梦自动发朋友圈 */
  setInterval(() => { if (db) maybeThemPostMoment(); }, 60000);
  setTimeout(() => { if (db) maybeThemPostMoment(); }, 30000);
}
boot();

})();
