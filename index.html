<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#f2f4f8" />
<title>主屏幕</title>
<style>
  :root {
    --bg: #ffffff;
    --soft: #f4f4f6;
    --line: #ececef;
    --text: #1c1c1e;
    --text-2: #8e8e93;
    --accent: #1c1c1e;
    --wall: radial-gradient(130% 100% at 18% 0%, #f7f9fd 0%, #e9eef7 48%, #dde4f0 100%);
    --chat-bg: #f4f4f6;
    --moments-bg: linear-gradient(160deg, #dbe7f5 0%, #e8e0f0 100%);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --sb-h: calc(var(--safe-top) + 44px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px;
    -webkit-font-smoothing: antialiased; user-select: none;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input, textarea { font: inherit; -webkit-user-select: text; user-select: text; }
  input:focus, textarea:focus { outline: none; }
  img { display: block; }

  #app {
    position: fixed; inset: 0;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }

  /* ===== 状态栏 ===== */
  .statusbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--sb-h); padding: var(--safe-top) 24px 0;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; letter-spacing: .3px;
    color: #1c1c1e; z-index: 300; pointer-events: none;
    transition: color .3s ease;
  }
  .sb-right { display: flex; align-items: center; gap: 5px; }

  /* ===== 主屏幕 ===== */
  #home {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--wall);
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  .home-scroll {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(var(--sb-h) + 18px) 16px 10px;
  }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 4px; }
  .app-cell {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 0; transition: transform .14s ease;
  }
  .app-cell:active { transform: scale(.9); }
  .app-icon {
    width: 56px; height: 56px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(20, 30, 60, .12);
    position: relative; overflow: hidden;
  }
  .app-icon::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 55%);
  }
  .app-icon svg { width: 28px; height: 28px; color: #fff; position: relative; z-index: 1; }
  .app-label {
    font-size: 11px; color: #2c2c30; letter-spacing: .2px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color .3s ease;
  }
  .page-dots { display: flex; justify-content: center; gap: 6px; padding: 12px 0 8px; }
  .page-dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(60, 70, 90, .2); }
  .page-dots i.on { background: rgba(60, 70, 90, .5); }
  .dock-wrap { flex: 0 0 auto; padding: 0 12px calc(var(--safe-bottom) + 12px); }
  .dock {
    display: flex; justify-content: space-around; align-items: flex-start;
    padding: 11px 4px 9px;
    background: rgba(255, 255, 255, .55);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .7);
    border-radius: 26px; box-shadow: 0 6px 20px rgba(20, 30, 60, .09);
  }
  .dock .app-cell { flex: 1 1 0; }

  /* ===== 应用页 ===== */
  .app-page {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform .26s cubic-bezier(.32,.72,0,1);
    overflow: hidden;
  }
  .app-page.open { transform: translateX(0); }
  #app-chat, #app-add-friend, #app-add-card, #app-add-event,
  #app-compose, #app-moments-compose, #app-moments, #app-friend-detail { z-index: 20; }

  .nav {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: calc(var(--sb-h) + 4px) 12px 9px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.96);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  .nav-btn {
    width: 34px; height: 34px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; transition: background .15s ease;
  }
  .nav-btn:active { background: var(--soft); }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn.ghost { opacity: 0; pointer-events: none; }
  .nav-title { flex: 1; text-align: center; font-size: 16.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-actions { display: flex; align-items: center; gap: 2px; }

  .app-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(var(--safe-bottom) + 20px);
  }

  /* ===== 通用列表 ===== */
  .group { padding: 6px 0; }
  .group-title { padding: 14px 18px 6px; font-size: 12.5px; color: var(--text-2); letter-spacing: .4px; }
  .row-item {
    position: relative; display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left; padding: 13px 18px;
    transition: background .15s ease;
  }
  .row-item:active { background: var(--soft); }
  .row-item + .row-item::before {
    content: ""; position: absolute; left: 52px; right: 0; top: 0;
    height: 1px; background: var(--line);
  }
  .row-item svg.lead { width: 20px; height: 20px; flex: 0 0 auto; }
  .row-text { flex: 1; min-width: 0; font-size: 15.5px; }
  .row-sub { font-size: 12.5px; color: var(--text-2); margin-top: 3px; line-height: 1.5; }
  .row-val { font-size: 14px; color: var(--text-2); }
  .row-item svg.chev { width: 17px; height: 17px; color: #c7c7cc; flex: 0 0 auto; }

  .avatar {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 17px; font-weight: 500;
    background-size: cover; background-position: center; overflow: hidden;
  }
  .avatar.sm { width: 32px; height: 32px; font-size: 13px; }
  .avatar.lg { width: 68px; height: 68px; font-size: 25px; }
  .avatar.xs { width: 26px; height: 26px; font-size: 11px; }

  /* ===== 空状态 ===== */
  .empty-state { display: flex; flex-direction: column; align-items: center; padding: 60px 32px 40px; text-align: center; }
  .empty-icon {
    width: 62px; height: 62px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    background: var(--soft); color: var(--text-2); margin-bottom: 16px;
  }
  .empty-icon svg { width: 28px; height: 28px; }
  .empty-title { font-size: 15.5px; font-weight: 500; }
  .empty-sub { font-size: 13px; color: var(--text-2); margin-top: 6px; line-height: 1.6; }

  /* ===== 美化 ===== */
  .swatches { display: flex; flex-wrap: wrap; gap: 11px; padding: 4px 18px 16px; }
  .sw {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid transparent;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.04), 0 1px 4px rgba(0,0,0,.08);
    position: relative; transition: transform .15s ease;
    background-size: cover; background-position: center;
  }
  .sw:active { transform: scale(.92); }
  .sw.on { border-color: var(--accent); }
  .sw.on::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 2px solid #fff; }
  .sw.upload { display: flex; align-items: center; justify-content: center; background: var(--soft); color: var(--text-2); }
  .sw.upload svg { width: 19px; height: 19px; }

  .profile-edit { display: flex; align-items: center; gap: 16px; padding: 16px 18px 8px; }
  .profile-edit .avatar { width: 62px; height: 62px; font-size: 23px; }
  .profile-meta { flex: 1; min-width: 0; }
  .profile-name-input { width: 100%; border: 0; background: none; font-size: 18px; font-weight: 600; padding: 0; color: var(--text); }
  .profile-hint { font-size: 12.5px; color: var(--text-2); margin-top: 5px; }
  .field-row { padding: 4px 18px 14px; }
  .field-row label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 7px; }
  .field-row input {
    width: 100%; padding: 11px 14px; border-radius: 11px;
    background: var(--soft); border: 0; font-size: 15px; color: var(--text);
  }

  /* ===== 字卡库 ===== */
  .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; padding: 14px; }
  .card {
    border-radius: 15px; background: #fff; border: 1px solid var(--line);
    padding: 16px 12px 14px; text-align: center;
    box-shadow: 0 2px 8px rgba(20,30,60,.04);
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:active { transform: scale(.97); }
  .card.on { border-color: var(--accent); }
  .card .zi { font-size: 32px; font-weight: 600; letter-spacing: 2px; }
  .card .py { font-size: 12px; color: var(--text-2); margin-top: 4px; letter-spacing: .6px; }
  .card .meaning {
    font-size: 12px; color: var(--text-2); line-height: 1.5; margin-top: 8px;
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height .25s ease, opacity .25s ease;
  }
  .card.on .meaning { max-height: 90px; opacity: 1; }

  /* ===== 会话列表 ===== */
  .chat-item {
    position: relative; display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left; padding: 11px 16px;
    transition: background .15s ease;
  }
  .chat-item:active { background: var(--soft); }
  .chat-item + .chat-item::before {
    content: ""; position: absolute; left: 74px; right: 0; top: 0;
    height: 1px; background: var(--line);
  }
  .chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .chat-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chat-name { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-time { flex: 0 0 auto; font-size: 12px; color: var(--text-2); }
  .chat-prev { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    flex: 0 0 auto; min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 10px; background: #ff3b30; color: #fff;
    font-size: 12px; line-height: 20px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .blocked-tag {
    flex: 0 0 auto; font-size: 11px; color: #ff3b30;
    border: 1px solid #ffd0d0; background: #fff5f5;
    border-radius: 6px; padding: 1px 6px;
  }

  /* ===== 聊天详情 ===== */
  .messages {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px 14px 18px;
    background: var(--chat-bg);
    background-size: cover; background-position: center;
  }
  .time-divider { align-self: center; font-size: 11.5px; color: var(--text-2); padding: 2px 0; }
  .sys-msg { align-self: center; font-size: 12px; color: var(--text-2);
    background: rgba(0,0,0,.04); border-radius: 8px; padding: 4px 10px; max-width: 80%; text-align: center; }
  .msg { display: flex; align-items: flex-end; gap: 8px; animation: pop .18s ease-out; max-width: 100%; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 9px 13px; border-radius: 16px;
    font-size: 15px; line-height: 1.45; word-break: break-word; white-space: pre-wrap;
  }
  .msg.them .bubble { background: #ffffff; border-bottom-left-radius: 5px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .msg.me .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }

  /* 特殊消息卡片 */
  .msg-card {
    max-width: 78%; border-radius: 14px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .msg-card.red { background: linear-gradient(135deg, #ff6b4a, #ff3b30); color: #fff; }
  .msg-card.transfer { background: linear-gradient(135deg, #ffb340, #ff9500); color: #fff; }
  .msg-card.letter { background: #fff; color: var(--text); border: 1px solid var(--line); }
  .msg-card.survey { background: #fff; color: var(--text); border: 1px solid var(--line); }
  .msg-card.call { background: #f1f1f4; color: var(--text); }
  .mc-top { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
  .mc-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.25); flex: 0 0 auto; }
  .mc-icon svg { width: 20px; height: 20px; }
  .msg-card.letter .mc-icon, .msg-card.survey .mc-icon, .msg-card.call .mc-icon { background: var(--soft); color: var(--text); }
  .mc-title { font-size: 15px; font-weight: 600; }
  .mc-sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .mc-body { padding: 0 14px 14px; font-size: 14px; line-height: 1.55; }
  .mc-foot { padding: 9px 14px; font-size: 11.5px; border-top: 1px solid rgba(255,255,255,.25); opacity: .9; }
  .msg-card.letter .mc-foot, .msg-card.survey .mc-foot, .msg-card.call .mc-foot { border-top-color: var(--line); color: var(--text-2); }
  .survey-opt {
    display: block; width: 100%; text-align: left;
    padding: 9px 12px; margin-top: 7px; border-radius: 9px;
    background: var(--soft); font-size: 14px; color: var(--text);
    transition: background .15s ease;
  }
  .survey-opt:active { background: #e8e8ee; }
  .survey-opt.done { background: #e8f5ec; color: #1f7a44; }

  .composer {
    flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 10px calc(var(--safe-bottom) + 8px);
    border-top: 1px solid var(--line); background: #fff;
  }
  .composer textarea {
    flex: 1; min-width: 0; min-height: 38px; max-height: 120px;
    padding: 9px 13px; border: 0; border-radius: 19px;
    background: var(--soft); color: var(--text);
    font-size: 15px; line-height: 1.4; resize: none; outline: none; overflow-y: auto;
  }
  .composer.disabled textarea { opacity: .5; }
  .comp-btn {
    flex: 0 0 auto; width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; transition: transform .15s ease, background .15s ease;
  }
  .comp-btn:active { transform: scale(.9); }
  .comp-btn svg { width: 22px; height: 22px; }
  .comp-btn.plus { color: var(--text); }
  .comp-btn.send { background: var(--accent); color: #fff; }
  .comp-btn.send svg { width: 19px; height: 19px; }
  .composer.writing { justify-content: center; }
  .write-letter-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 24px; border-radius: 19px;
    background: var(--accent); color: #fff; font-size: 15px;
  }
  .write-letter-btn svg { width: 18px; height: 18px; }

  /* ===== 表单页 ===== */
  .form-wrap { padding: 22px 20px; }
  .form-avatar-row { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
  .form-avatar-btn {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--soft); display: flex; align-items: center; justify-content: center;
    color: var(--text-2); overflow: hidden; background-size: cover; background-position: center;
    transition: transform .15s ease;
  }
  .form-avatar-btn:active { transform: scale(.94); }
  .form-avatar-btn svg { width: 28px; height: 28px; }
  .form-avatar-btn.has-img { color: #fff; font-weight: 500; }
  .form-hint { font-size: 12.5px; color: var(--text-2); margin-top: 9px; }
  .f-field { margin-bottom: 16px; }
  .f-field label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 7px; padding-left: 2px; }
  .f-field input, .f-field textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    background: var(--soft); border: 0; font-size: 15px; color: var(--text);
    resize: vertical;
  }
  .f-field textarea { min-height: 110px; line-height: 1.55; }
  .f-save {
    width: 100%; margin-top: 10px; padding: 14px;
    border-radius: 13px; background: var(--accent); color: #fff;
    font-size: 15.5px; font-weight: 500;
    transition: opacity .15s ease, transform .15s ease;
  }
  .f-save:active { transform: scale(.98); opacity: .9; }

  /* ===== 朋友圈 ===== */
  .moments-hero {
    position: relative; height: 230px;
    background: var(--moments-bg);
    background-size: cover; background-position: center;
    display: flex; align-items: flex-end; padding: 0 18px 15px;
  }
  .moments-hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 42%, rgba(0,0,0,.3) 100%);
  }
  .moments-me { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; }
  .moments-me .avatar { width: 56px; height: 56px; font-size: 21px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2); border: 2px solid rgba(255,255,255,.85); }
  .moments-me-name { font-size: 17px; font-weight: 600; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.35); }

  .moment-item { display: flex; gap: 11px; padding: 16px 16px 4px; position: relative; }
  .moment-item + .moment-item::before {
    content: ""; position: absolute; left: 16px; right: 0; top: 0;
    height: 1px; background: var(--line);
  }
  .moment-main { flex: 1; min-width: 0; }
  .moment-author { font-size: 14.5px; font-weight: 600; color: #576b95; }
  .moment-text { font-size: 14.5px; line-height: 1.55; margin-top: 5px; white-space: pre-wrap; word-break: break-word; }
  .moment-imgs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .moment-img { width: 84px; height: 84px; border-radius: 8px; background-size: cover; background-position: center; background-color: var(--soft); }
  .moment-video {
    margin-top: 8px; width: 100%; height: 150px; border-radius: 10px;
    background: linear-gradient(135deg, #3a3a46, #1c1c1e);
    display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.9);
    position: relative;
  }
  .moment-video svg { width: 38px; height: 38px; }
  .moment-meta { display: flex; align-items: center; gap: 12px; margin-top: 9px; }
  .moment-meta span { font-size: 12px; color: var(--text-2); }
  .moment-actions { display: flex; gap: 4px; margin-left: auto; }
  .ma-btn {
    display: flex; align-items: center; gap: 4px; padding: 4px 8px;
    border-radius: 7px; font-size: 12.5px; color: var(--text-2);
    background: var(--soft);
  }
  .ma-btn.on { color: #576b95; background: #eaf0fa; }
  .ma-btn svg { width: 14px; height: 14px; }
  .moment-likes { margin-top: 8px; font-size: 13px; color: #576b95; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .moment-likes svg { width: 13px; height: 13px; }
  .moment-comments { margin-top: 6px; background: var(--soft); border-radius: 8px; padding: 8px 10px; }
  .mcomment { font-size: 13px; line-height: 1.6; }
  .mcomment b { color: #576b95; font-weight: 600; }
  .comment-input-row { display: flex; gap: 6px; margin-top: 6px; }
  .comment-input-row input {
    flex: 1; padding: 7px 11px; border-radius: 15px; border: 0;
    background: var(--soft); font-size: 13px; color: var(--text);
  }
  .comment-send { padding: 0 12px; border-radius: 15px; background: var(--accent); color: #fff; font-size: 13px; }

  /* ===== 音乐 ===== */
  .player { padding: 26px 26px calc(var(--safe-bottom) + 24px); display: flex; flex-direction: column; align-items: center; }
  .cover {
    width: 100%; max-width: 250px; aspect-ratio: 1 / 1; border-radius: 20px;
    background: linear-gradient(150deg, #4a4a55, #1c1c1e 70%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 14px 36px rgba(20,30,60,.22);
  }
  .cover svg { width: 62px; height: 62px; color: rgba(255,255,255,.9); }
  .song-title { font-size: 19px; font-weight: 600; margin-top: 26px; }
  .song-artist { font-size: 14px; color: var(--text-2); margin-top: 4px; }

  .evt-days span { display: block; font-size: 11px; color: var(--text-2); margin-top: 1px; }

  /* ===== 底部弹出面板 ===== */

  .add-opt-btn { width: 100%; padding: 9px; border-radius: 10px; background: var(--soft); color: var(--text-2); font-size: 13.5px; margin-top: 2px; }

  /* ===== 通话覆盖层 ===== */
  .call-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: linear-gradient(170deg, #2c2c33, #17171b 70%);
    display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--safe-top) + 60px) 24px calc(var(--safe-bottom) + 50px);
    color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;

  .call-overlay.show { opacity: 1; pointer-events: auto; }
  .call-overlay.video { background: linear-gradient(170deg, #1f2a3a, #0e1420 70%); }
  .call-avatar {
    width: 110px; height: 110px; border-radius: 50%;

  .call-name { font-size: 23px; font-weight: 600; margin-top: 24px; }
  .call-status { font-size: 14px; opacity: .7; margin-top: 8px; letter-spacing: .5px; }
  .call-video-preview {
    position: absolute; right: 18px; top: calc(var(--safe-top) + 20px);

    background: linear-gradient(135deg, #4a4a55, #2b2b33);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.15);
  }
  .call-video-preview svg { width: 30px; height: 30px; opacity: .7; }
  .call-actions { margin-top: auto; display: flex; gap: 60px; }
  .call-btn {
    width: 66px; height: 66px; border-radius: 50%;

  .call-btn:active { transform: scale(.92); }
  .call-btn svg { width: 28px; height: 28px; }
  .call-btn.hangup { background: #ff3b30; }
  .call-btn.mute.on { background: rgba(255,255,255,.85); color: #1c1c1e; }

  /* ===== 通用 ===== */
  .hidden { display: none !important; }

  .action-list button {
    display: flex; align-items: center; gap: 12px;

  .action-list button:last-child { border-bottom: 0; }
  .action-list button svg { width: 21px; height: 21px; flex: 0 0 auto; }
  .action-list button.danger { color: #ff3b30; }

  .sec-title-row .t { font-size: 12.5px; color: var(--text-2); letter-spacing: .4px; }
</style>

  /* ================= 存储 ================= */
  var STORE_KEY = 'mini_phone_v6';

  function defaultStore() {
    return {
      settings: {
        wall: 0,

  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.settings && Array.isArray(s.friends)) {
          var d = defaultStore();
          for (var k in d) { if (!(k in s)) s[k] = d[k]; }
          for (var k2 in d.settings) { if (!(k2 in s.settings)) s.settings[k2] = d.settings[k2]; }
          if (!Array.isArray(s.cards) || !s.cards.length) s.cards = PRESET_CARDS.slice();
          if (!s.convs || typeof s.convs !== 'object') s.convs = {};
          return s;
        }
      }
    } catch (e) { /* 忽略 */ }
    return defaultStore();
  }

  var store = loadStore();

  function saveStore() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* 忽略 */ }
  }

  /* ================= 状态 ================= */
  var state = {
    openApp: null,
    currentApp: null,
    currentFriend: null,

    calDate: new Date(),
    playing: false,
    pos: 0,
    timer: null,
    callTimer: null,
    callSeconds: 0,
    callTarget: null,
    callKind: 'voice'
  };
  var MUSIC_LEN = 204;

  /* ================= 工具 ================= */
  function $(s) { return document.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function nowTime() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function toMin(t) {
    var p = String(t).split(':');
    return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0);
  }
  function uid(p) { return (p || 'id') + '_' + Date.now() + '_' + Math.floor(Math.random() * 9999); }
  function randomColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

  function findFriend(id) {
    for (var i = 0; i < store.friends.length; i++) {
      if (store.friends[i].id === id) return store.friends[i];
    }
    return null;
  }
  function convKey(app, friendId) { return app + '|' + friendId; }
  function getConv(app, friendId) {
    var k = convKey(app, friendId);
    if (!store.convs[k]) store.convs[k] = { messages: [], unread: 0 };
    return store.convs[k];
  }
  function displayName(f) { return f.remark || f.name; }

  function avatarStyle(p) {
    if (p.avatar) {
      return 'background-image:url(' + p.avatar + ');background-size:cover;background-position:center;background-color:' + (p.color || '#c7c7cc') + ';color:transparent';
    }
    return 'background:' + (p.color || '#c7c7cc') + ';color:#fff';

    var initial = (p.name || p.initial || '?').charAt(0);
    return '<span class="avatar ' + (cls || '') + '" style="' + avatarStyle(p) + '">' +

    var a = cards[Math.floor(Math.random() * cards.length)];

    return '最近在琢磨「' + a.zi + '」这个字，' + a.mean + ' 又想起「' + b.zi + '」，' + b.mean + ' 与你说说，望一切顺利。';
  }

  /* 图片压缩 */
  function compressImage(file, size, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var scale = Math.max(size / img.width, size / img.height);
        var w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        try { cb(canvas.toDataURL('image/jpeg', 0.8)); }
        catch (err) { cb(e.target.result); }
      };
      img.onerror = function () { cb(e.target.result); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  /* ================= 防缩放 ================= */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouchEnd < 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  // 阻止 Ctrl+滚轮缩放
  document.addEventListener('wheel', function (e) {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });

  /* ================= 空状态 ================= */

    var icon = app === 'wechat' ? ICO.emptyChat : (app === 'sms' ? ICO.sms : ICO.emptyMail);
    var title = app === 'mail' ? '信箱空空如也' : '还没有好友';

  /* ================= 会话列表（三应用共用好友） ================= */
  function renderAppList(app) {
    var box = document.getElementById('list-' + app);
    if (!box) return;
    if (!store.friends.length) {
      box.innerHTML = emptyStateHTML(app);
      return;
    }
    box.innerHTML = store.friends.map(function (f) {
      var conv = store.convs[convKey(app, f.id)] || { messages: [], unread: 0 };
      var last = conv.messages[conv.messages.length - 1];
      var preview = '';
      if (last) {
        if (last.type === 'letter') preview = '【信件】' + (last.subject || '');
        else if (last.type === 'redpacket') preview = '[红包] ' + (last.note || '恭喜发财');
        else if (last.type === 'transfer') preview = '[转账] ' + (last.amount || '');
        else if (last.type === 'survey') preview = '[问卷] ' + (last.title || '');
        else if (last.type === 'call') preview = last.kind === 'video' ? '[视频通话]' : '[语音通话]';
        else if (last.from === 'me') preview = '我：' + (last.text || '');
        else preview = last.text || '';
      } else {
        preview = app === 'mail' ? '还没有信件' : '还没有消息';
      }
      var time = last ? last.time : '';
      var unread = conv.unread ? '<span class="badge">' + (conv.unread > 99 ? '99+' : conv.unread) + '</span>' : '';
      var blockedTag = f.iBlocked ? '<span class="blocked-tag">已拉黑</span>' :
                       (f.theyBlocked ? '<span class="blocked-tag">被拉黑</span>' : '');
      return '<button class="chat-item" type="button" data-app="' + app + '" data-friend="' + f.id + '">' +
        avatarHTML(f, '') +
        '<span class="chat-main">' +
          '<span class="chat-row">' +
            '<span class="chat-name">' + esc(displayName(f)) + '</span>' +
            (blockedTag || '<span class="chat-time">' + esc(time) + '</span>') +
          '</span>' +
          '<span class="chat-row">' +
            '<span class="chat-prev">' + esc(preview) + '</span>' + unread +
          '</span>' +
        '</span>' +
      '</button>';
    }).join('');

  function saveFriend() {
    var d = state.draftFriend;
    if (!d) return;
    var name = ($('#af-name').value || '').trim();
    if (!name) name = store.settings.defaultFriendName || '梦';
    var remark = ($('#af-remark').value || '').trim();

    if (d.isEdit) {
      var f = findFriend(d.id);
      if (f) {
        f.name = name; f.remark = remark;
        f.avatar = d.avatar; f.color = d.color;
      }
    } else {
      var nf = {
        id: uid('f'), name: name, remark: remark,
        avatar: d.avatar, color: d.color,
        iBlocked: false, theyBlocked: false,
        createdAt: Date.now()
      };
      store.friends.push(nf);
      // 生成 1-2 条好友动态（用字卡内容）
      var count = 1 + Math.floor(Math.random() * 2);
      for (var i = 0; i < count; i++) {
        var c = store.cards[Math.floor(Math.random() * store.cards.length)];
        store.moments.push({
          id: uid('m'), authorId: nf.id, authorName: displayName(nf),
          text: c ? ('今日份的字：' + c.zi + '。' + c.mean) : '今天天气不错。',
          type: 'text', images: [], time: Date.now() - i * 3600000,
          likes: [], comments: []
        });
      }
    }
    saveStore();
    closePage('app-add-friend');
    if (state.currentApp) {
      renderAppList(state.currentApp);
      openPage('app-' + state.currentApp);
    }
    if (state.currentFriend) {
      var cf = findFriend(state.currentFriend.id);
      if (cf) {
        state.currentFriend = cf;
        $('#chat-title').textContent = displayName(cf);

  /* ================= 聊天 ================= */
  function openChat(app, friendId) {
    var f = findFriend(friendId);
    if (!f) return;
    state.currentApp = app;
    state.currentFriend = f;
    var conv = getConv(app, friendId);
    conv.unread = 0;

    $('#chat-title').textContent = displayName(f);
    document.documentElement.style.setProperty('--accent', '#1c1c1e');
    renderMessages();
    openPage('app-chat');
    renderAppList(app);

    // 信箱：隐藏输入框，显示写信按钮
    var composer = $('#composer');
    if (app === 'mail') {
      composer.classList.add('writing');
      composer.innerHTML = '<button type="button" class="write-letter-btn" id="write-letter-btn">' +

    } else if (!composer.classList.contains('writing')) {
      // 确保普通输入框存在

          '</button>' +
          '<button class="comp-btn send" type="submit" aria-label="发送">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10.5 13.5"/><path d="M21 3l-6.5 18-4-7.5-7.5-4L21 3z"/></svg>' +
          '</button>';
      }
      composer.classList.remove('writing');

    updateComposerState();

  function updateComposerState() {
    var f = state.currentFriend;
    if (!f) return;
    var composer = $('#composer');
    if (state.currentApp === 'mail') return; // 信箱单独处理
    var disabled = f.iBlocked || f.theyBlocked;
    composer.classList.toggle('disabled', disabled);
    var input = $('#msg-input');
    if (input) {
      input.disabled = disabled;
      input.placeholder = f.iBlocked ? '你已拉黑对方' : (f.theyBlocked ? '对方已拉黑你' : '输入消息...');
    }
    var send = composer.querySelector('.send');
    var plus = composer.querySelector('.plus');
    if (send) send.style.opacity = disabled ? .4 : 1;
    if (plus) plus.style.opacity = disabled ? .4 : 1;
  }

    closePage('app-chat');
    state.currentFriend = null;
    // 恢复通用 composer
    var composer = $('#composer');
    composer.classList.remove('writing');
    if (!document.getElementById('msg-input')) {
      composer.innerHTML =
        '<textarea id="msg-input" rows="1" placeholder="输入消息..." autocomplete="off"></textarea>' +

        '</button>' +

        '</button>';

  function renderMessages() {
    var f = state.currentFriend;
    if (!f) return;
    var conv = getConv(state.currentApp, f.id);
    var box = $('#messages');
    var me = myPerson();
    var html = '';

    if (f.iBlocked) html += '<div class="sys-msg">你已把对方拉黑，无法发送消息</div>';
    else if (f.theyBlocked) html += '<div class="sys-msg">对方已把你拉黑，无法发送消息</div>';

    if (!conv.messages.length) {
      html += '<div class="time-divider">' + (state.currentApp === 'mail' ? '还没有信件，写一封吧' : '还没有消息，发送第一条吧') + '</div>';
    } else {
      var prev = null;
      conv.messages.forEach(function (m) {
        if (m.from === 'sys') {
          html += '<div class="sys-msg">' + esc(m.text) + '</div>';
          return;
        }
        if (prev === null || toMin(m.time) - toMin(prev) >= 5 || toMin(m.time) < toMin(prev)) {
          html += '<div class="time-divider">' + esc(m.time) + '</div>';
        }
        prev = m.time;

        var isMe = m.from === 'me';
        var body = '';
        if (m.type === 'text' || !m.type) {
          body = '<div class="bubble">' + esc(m.text || '') + '</div>';
        } else if (m.type === 'letter') {
          body = '<div class="msg-card letter" data-open-letter="' + m.id + '">' +
            '<div class="mc-top"><div class="mc-icon">' + ICO.letter + '</div>' +
              '<div><div class="mc-title">' + esc(m.subject || '无主题') + '</div>' +
              '<div class="mc-sub">' + esc(m.from === 'me' ? '我发出的信' : '来信') + '</div></div></div>' +
            '<div class="mc-body">' + esc((m.body || '').slice(0, 60)) + ((m.body || '').length > 60 ? '…' : '') + '</div>' +
            '<div class="mc-foot">点击查看全文</div>' +
          '</div>';
        } else if (m.type === 'redpacket') {
          body = '<div class="msg-card red">' +
            '<div class="mc-top"><div class="mc-icon">' + ICO.redpacket + '</div>' +
              '<div><div class="mc-title">红包</div><div class="mc-sub">' + esc(m.note || '恭喜发财') + '</div></div></div>' +
            '<div class="mc-body">' + esc(m.amount || '') + ' 元</div>' +
            '<div class="mc-foot">' + (m.from === 'me' ? '已发送' : '已领取') + '</div>' +
          '</div>';
        } else if (m.type === 'transfer') {
          body = '<div class="msg-card transfer">' +
            '<div class="mc-top"><div class="mc-icon">' + ICO.transfer + '</div>' +
              '<div><div class="mc-title">转账</div><div class="mc-sub">' + esc(m.note || '转账') + '</div></div></div>' +
            '<div class="mc-body">' + esc(m.amount || '') + ' 元</div>' +
            '<div class="mc-foot">' + (m.from === 'me' ? '已转账' : '已收款') + '</div>' +
          '</div>';
        } else if (m.type === 'survey') {
          var opts = (m.options || []).map(function (o, idx) {
            var chosen = m.answer === o;
            return '<button class="survey-opt' + (chosen ? ' done' : '') + '" type="button" data-survey="' + m.id + '" data-opt="' + idx + '">' + esc(o) + '</button>';
          }).join('');
          body = '<div class="msg-card survey">' +
            '<div class="mc-top"><div class="mc-icon">' + ICO.survey + '</div>' +
              '<div><div class="mc-title">' + esc(m.title || '问卷') + '</div>' +
              '<div class="mc-sub">' + (m.answer ? '已选择：' + esc(m.answer) : '请选择一个选项') + '</div></div></div>' +
            '<div class="mc-body">' + opts + '</div>' +
          '</div>';
        } else if (m.type === 'call') {
          body = '<div class="msg-card call">' +
            '<div class="mc-top"><div class="mc-icon">' + (m.kind === 'video' ? ICO.video : ICO.phone) + '</div>' +
              '<div><div class="mc-title">' + (m.kind === 'video' ? '视频通话' : '语音通话') + '</div>' +
              '<div class="mc-sub">' + esc(m.duration || '') + '</div></div></div>' +
            '<div class="mc-foot">' + (m.from === 'me' ? '由我发起' : '对方发起') + '</div>' +
          '</div>';
        }

        if (isMe) {
          html += '<div class="msg me">' + body + avatarHTML(me, 'sm') + '</div>';
        } else {
          html += '<div class="msg them">' + avatarHTML(f, 'sm') + body + '</div>';
        }
      });
    }
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
  }

  function autoGrow() {
    var el = $('#msg-input');
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function pushMessage(app, friendId, msg) {
    var conv = getConv(app, friendId);
    msg.id = msg.id || uid('msg');
    msg.time = msg.time || nowTime();
    conv.messages.push(msg);
    conv.unread = 0;
    saveStore();
  }

  function sendText() {
    var input = $('#msg-input');
    if (!input) return;
    var text = input.value.trim();
    var f = state.currentFriend;
    if (!text || !f) return;
    if (f.iBlocked || f.theyBlocked) return;

    pushMessage(state.currentApp, f.id, { from: 'me', type: 'text', text: text });
    input.value = '';
    autoGrow();
    renderMessages();
    renderAppList(state.currentApp);
    scheduleReply(f);
  }

  function scheduleReply(f) {
    if (!f) return;
    clearTimeout(f._timer);
    f._timer = setTimeout(function () {
      // 若已被拉黑则不再回复
      var cur = findFriend(f.id);
      if (!cur || cur.iBlocked) return;

      // 小概率对方拉黑我
      if (!cur.theyBlocked && !cur.iBlocked && Math.random() < 0.04) {
        cur.theyBlocked = true;
        var conv = getConv(state.currentApp, cur.id);
        conv.messages.push({ from: 'sys', text: '对方已将你拉黑', time: nowTime() });
        saveStore();
        if (state.currentFriend && state.currentFriend.id === cur.id) {
          renderMessages();
          updateComposerState();
        }
        renderAppList(state.currentApp);
        return;
      }

      if (state.currentApp === 'mail') {
        pushMessage('mail', cur.id, {
          from: 'them', type: 'letter',
          subject: 'Re: ' + (lastLetterSubject(cur.id) || '来信'),
          body: cardReplyLetter()
        });
      } else {
        pushMessage(state.currentApp, cur.id, {
          from: 'them', type: 'text', text: cardReplyText()
        });
      }

      if (state.currentFriend && state.currentFriend.id === cur.id) {
        renderMessages();
      } else {
        var conv2 = getConv(state.currentApp, cur.id);
        conv2.unread = (conv2.unread || 0) + 1;
      }
      renderAppList(state.currentApp);
    }, 900 + Math.random() * 800);
  }

  function lastLetterSubject(friendId) {
    var conv = getConv('mail', friendId);
    for (var i = conv.messages.length - 1; i >= 0; i--) {
      if (conv.messages[i].type === 'letter') return conv.messages[i].subject;
    }
    return '';
  }

  /* ================= 写信 ================= */
  function openCompose() {
    var f = state.currentFriend;
    if (!f) return;
    if (f.iBlocked || f.theyBlocked) {
      alert(f.iBlocked ? '你已拉黑对方，无法写信' : '对方已拉黑你，无法写信');
      return;
    }
    $('#letter-to').value = displayName(f);
    $('#letter-subject').value = '';
    $('#letter-body').value = '';
    $('#compose-title').textContent = '写信给 ' + displayName(f);
    openPage('app-compose');
  }
  function sendLetter() {
    var f = state.currentFriend;
    if (!f) return;
    var subject = ($('#letter-subject').value || '').trim() || '无主题';
    var body = ($('#letter-body').value || '').trim();
    if (!body) { alert('信的内容不能为空'); return; }

    pushMessage('mail', f.id, {
      from: 'me', type: 'letter', subject: subject, body: body
    });
    closePage('app-compose');
    renderMessages();
    renderAppList('mail');
    scheduleReply(f);
  }

  /* ================= 聊天更多功能 ================= */
  function openChatActions() {
    var f = state.currentFriend;
    if (!f) return;
    var app = state.currentApp;
    var html = '';

    if (app === 'wechat' || app === 'sms') {
      html += '<div class="sheet-grid">' +
        '<button class="sheet-item" data-action="voice"><span class="si-icon">' + ICO.phone + '</span><span>语音通话</span></button>' +
        '<button class="sheet-item" data-action="video"><span class="si-icon">' + ICO.video + '</span><span>视频通话</span></button>' +
        '<button class="sheet-item" data-action="redpacket"><span class="si-icon">' + ICO.redpacket + '</span><span>发红包</span></button>' +
        '<button class="sheet-item" data-action="transfer"><span class="si-icon">' + ICO.transfer + '</span><span>转账</span></button>' +
        '<button class="sheet-item" data-action="survey"><span class="si-icon">' + ICO.survey + '</span><span>问卷</span></button>' +
        '<button class="sheet-item" data-action="letter"><span class="si-icon">' + ICO.letter + '</span><span>写信</span></button>' +
      '</div>';
    } else {
      html += '<div class="sheet-grid">' +
        '<button class="sheet-item" data-action="letter"><span class="si-icon">' + ICO.letter + '</span><span>写信</span></button>' +
      '</div>';
    }
    html += '<div class="action-list">' +
      '<button type="button" data-action="edit">' + ICO.edit + '编辑资料</button>';
    if (f.iBlocked) {
      html += '<button type="button" data-action="unblock">' + ICO.block + '解除拉黑</button>';
    } else if (f.theyBlocked) {
      html += '<button type="button" data-action="block" disabled style="opacity:.4">' + ICO.block + '对方已拉黑你，无法操作</button>';
    } else {
      html += '<button type="button" class="danger" data-action="block">' + ICO.block + '拉黑对方</button>';
    }
    html += '<button type="button" data-action="delete" class="danger">' + ICO.trash + '删除好友</button>';
    html += '</div>';
    showSheet(html);
  }

  function handleChatAction(action) {
    var f = state.currentFriend;
    if (!f) return;
    hideSheet();

    if (action === 'edit') {
      openEditFriend(state.currentApp, f);
      closePage('app-chat');
    } else if (action === 'block') {
      if (f.iBlocked || f.theyBlocked) return;
      if (!confirm('确定拉黑「' + displayName(f) + '」吗？')) return;
      f.iBlocked = true;
      saveStore();
      renderMessages();
      updateComposerState();
      renderAppList(state.currentApp);
    } else if (action === 'unblock') {
      f.iBlocked = false;
      saveStore();
      renderMessages();
      updateComposerState();
      renderAppList(state.currentApp);
    } else if (action === 'delete') {
      if (!confirm('删除后将清除所有聊天记录，确定删除「' + displayName(f) + '」吗？')) return;
      deleteFriend(f.id);
    } else if (action === 'voice') {
      startCall('voice');
    } else if (action === 'video') {
      startCall('video');
    } else if (action === 'redpacket') {
      openAmountModal('redpacket');
    } else if (action === 'transfer') {
      openAmountModal('transfer');
    } else if (action === 'survey') {
      openSurveyModal();
    } else if (action === 'letter') {
      openCompose();
    }
  }

  function deleteFriend(id) {
    store.friends = store.friends.filter(function (f) { return f.id !== id; });
    var keys = Object.keys(store.convs);
    keys.forEach(function (k) {
      if (k.split('|')[1] === id) delete store.convs[k];
    });
    store.moments = store.moments.filter(function (m) { return m.authorId !== id; });
    saveStore();
    closePage('app-chat');
    state.currentFriend = null;
    if (state.currentApp) renderAppList(state.currentApp);
    renderMoments();
  }

  /* ================= 红包 / 转账 ================= */
  function openAmountModal(kind) {
    var title = kind === 'redpacket' ? '发红包' : '转账';
    var html = '<div class="modal-card">' +
      '<h3>' + title + '</h3>' +
      '<div class="f-field"><label>金额（元）</label><input id="amt-input" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal" /></div>' +
      '<div class="f-field"><label>' + (kind === 'redpacket' ? '祝福语' : '备注') + '</label><input id="amt-note" type="text" maxlength="20" placeholder="' + (kind === 'redpacket' ? '恭喜发财' : '转账') + '" /></div>' +
      '<div class="modal-btns"><button class="modal-btn ghost" data-sheet-close>取消</button>' +
      '<button class="modal-btn primary" id="amt-confirm">确定</button></div>' +
    '</div>';
    showSheet(html);
    $('#amt-confirm').onclick = function () {
      var amt = parseFloat($('#amt-input').value);
      if (!amt || amt <= 0) { alert('请输入正确金额'); return; }
      var note = ($('#amt-note').value || '').trim() || (kind === 'redpacket' ? '恭喜发财' : '转账');
      var f = state.currentFriend;
      if (!f) return;
      pushMessage(state.currentApp, f.id, {
        from: 'me', type: kind, amount: amt.toFixed(2), note: note
      });
      hideSheet();
      renderMessages();
      renderAppList(state.currentApp);
      // 对方回复感谢
      setTimeout(function () {
        var cur = findFriend(f.id);
        if (!cur || cur.iBlocked || cur.theyBlocked) return;
        pushMessage(state.currentApp, cur.id, {
          from: 'them', type: 'text',
          text: kind === 'redpacket' ? '谢谢老板！' : '已收到，谢谢！'
        });
        if (state.currentFriend && state.currentFriend.id === cur.id) renderMessages();
        else getConv(state.currentApp, cur.id).unread++;
        renderAppList(state.currentApp);
      }, 1200);
    };
  }

  /* ================= 问卷 ================= */
  function openSurveyModal() {
    var html = '<div class="modal-card">' +
      '<h3>发起问卷</h3>' +
      '<div class="f-field"><label>问题</label><input id="sv-title" type="text" maxlength="30" placeholder="例如：周末去哪玩？" /></div>' +
      '<div class="f-field"><label>选项</label><div id="sv-opts"></div>' +
      '<button type="button" class="add-opt-btn" id="sv-add">+ 添加选项</button></div>' +
      '<div class="modal-btns"><button class="modal-btn ghost" data-sheet-close>取消</button>' +
      '<button class="modal-btn primary" id="sv-confirm">发送</button></div>' +
    '</div>';
    showSheet(html);

    var opts = ['', ''];
    function renderOpts() {
      $('#sv-opts').innerHTML = opts.map(function (o, i) {
        return '<div class="survey-opt-row">' +
          '<input type="text" data-opt-idx="' + i + '" maxlength="20" placeholder="选项 ' + (i + 1) + '" value="' + esc(o) + '" />' +
          (opts.length > 2 ? '<button type="button" data-opt-del="' + i + '">×</button>' : '') +
        '</div>';
      }).join('');
    }
    renderOpts();

    $('#sv-opts').addEventListener('input', function (e) {
      var inp = e.target;
      if (inp.dataset.optIdx !== undefined) opts[Number(inp.dataset.optIdx)] = inp.value;
    });
    $('#sv-add').onclick = function () {
      if (opts.length >= 6) return;
      opts.push('');
      renderOpts();
    };
    $('#sv-opts').addEventListener('click', function (e) {
      var del = e.target.closest('[data-opt-del]');
      if (del) {
        opts.splice(Number(del.dataset.optDel), 1);
        renderOpts();
      }
    });

    $('#sv-confirm').onclick = function () {
      var title = ($('#sv-title').value || '').trim();
      var valid = opts.map(function (o) { return o.trim(); }).filter(Boolean);
      if (!title) { alert('请填写问题'); return; }
      if (valid.length < 2) { alert('至少填写两个选项'); return; }
      var f = state.currentFriend;
      if (!f) return;
      pushMessage(state.currentApp, f.id, {
        from: 'me', type: 'survey', title: title, options: valid, answer: ''
      });
      hideSheet();
      renderMessages();
      renderAppList(state.currentApp);
      // 对方随机选择
      setTimeout(function () {
        var cur = findFriend(f.id);
        if (!cur || cur.iBlocked || cur.theyBlocked) return;
        var conv = getConv(state.currentApp, cur.id);
        var target = null;
        for (var i = conv.messages.length - 1; i >= 0; i--) {
          if (conv.messages[i].type === 'survey' && !conv.messages[i].answer) {
            target = conv.messages[i]; break;
          }
        }
        if (target) {
          target.answer = target.options[Math.floor(Math.random() * target.options.length)];
          saveStore();
        }
        pushMessage(state.currentApp, cur.id, {
          from: 'them', type: 'text', text: '我选了「' + (target ? target.answer : '') + '」'
        });
        if (state.currentFriend && state.currentFriend.id === cur.id) renderMessages();
        else getConv(state.currentApp, cur.id).unread++;
        renderAppList(state.currentApp);
      }, 1300);
    };
  }

  /* ================= 通话 ================= */
  function startCall(kind) {
    var f = state.currentFriend;
    if (!f) return;
    if (f.iBlocked || f.theyBlocked) {
      alert(f.iBlocked ? '你已拉黑对方' : '对方已拉黑你');
      return;
    }
    state.callTarget = f;
    state.callKind = kind;
    state.callSeconds = 0;

    var overlay = $('#call-overlay');
    overlay.classList.toggle('video', kind === 'video');
    $('#call-video-preview').classList.toggle('hidden', kind !== 'video');
    var av = $('#call-avatar');
    av.style.cssText = avatarStyle(f);
    av.textContent = f.avatar ? '' : (displayName(f).charAt(0));
    $('#call-name').textContent = displayName(f);
    $('#call-status').textContent = '正在呼叫...';
    overlay.classList.add('show');

    clearTimeout(state.callTimer);
    state.callTimer = setTimeout(function () {
      $('#call-status').textContent = '00:00';
      state.callSeconds = 0;
      state.callTimer = setInterval(function () {
        state.callSeconds++;
        var m = Math.floor(state.callSeconds / 60);
        var s = state.callSeconds % 60;
        $('#call-status').textContent = ('0' + m).slice(-2) + ':' + ('0' + s).slice(-2);
      }, 1000);
    }, 2200);
  }

  function endCall() {
    clearTimeout(state.callTimer);
    clearInterval(state.callTimer);
    $('#call-overlay').classList.remove('show');
    var f = state.callTarget;
    var kind = state.callKind;
    var dur = state.callSeconds > 0 ? ('时长 ' + Math.floor(state.callSeconds / 60) + ' 分 ' + (state.callSeconds % 60) + ' 秒') : '未接通';
    if (f) {
      pushMessage(state.currentApp, f.id, {
        from: 'me', type: 'call', kind: kind, duration: dur
      });
      if (state.currentFriend && state.currentFriend.id === f.id) renderMessages();
      else getConv(state.currentApp, f.id).unread++;
      renderAppList(state.currentApp);
    }
    state.callTarget = null;
    state.callSeconds = 0;
  }

  /* ================= 信件详情 ================= */
  function openLetter(msgId) {
    var f = state.currentFriend;
    if (!f) return;
    var conv = getConv(state.currentApp, f.id);
    var msg = null;
    for (var i = 0; i < conv.messages.length; i++) {
      if (conv.messages[i].id === msgId) { msg = conv.messages[i]; break; }
    }
    if (!msg) return;
    var html = '<div class="modal-card">' +
      '<h3>' + esc(msg.subject || '无主题') + '</h3>' +
      '<div style="font-size:13px;color:var(--text-2);margin-bottom:12px">' +
        (msg.from === 'me' ? '我发出的信' : '来自 ' + esc(displayName(f))) + ' · ' + esc(msg.time) +
      '</div>' +
      '<div style="font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow-y:auto">' + esc(msg.body || '') + '</div>' +
      '<div class="modal-btns"><button class="modal-btn primary" data-sheet-close>关闭</button></div>' +
    '</div>';
    showSheet(html);
  }

  /* ================= 问卷选择 ================= */
  function answerSurvey(msgId, optIdx) {
    var f = state.currentFriend;
    if (!f) return;
    var conv = getConv(state.currentApp, f.id);
    var msg = null;
    for (var i = 0; i < conv.messages.length; i++) {
      if (conv.messages[i].id === msgId) { msg = conv.messages[i]; break; }
    }
    if (!msg || msg.from !== 'me') return;
    if (msg.answer) return;
    var opt = msg.options[optIdx];
    if (!opt) return;
    msg.answer = opt;
    saveStore();
    pushMessage(state.currentApp, f.id, { from: 'them', type: 'text', text: '我选了「' + opt + '」' });
    renderMessages();
    renderAppList(state.currentApp);
  }

  /* ================= 朋友圈 ================= */
  function renderMoments() {
    var me = myPerson();
    var av = $('#moments-my-avatar');
    if (store.settings.myAvatar) {
      av.style.backgroundImage = 'url(' + store.settings.myAvatar + ')';
      av.style.backgroundColor = '#1c1c1e';
      av.style.color = 'transparent';
      av.textContent = '';
    } else {
      av.style.backgroundImage = '';
      av.style.backgroundColor = '#1c1c1e';
      av.style.color = '#fff';
      av.textContent = (store.settings.myName || '我').charAt(0);
    }
    $('#moments-my-name').textContent = store.settings.myName || '我';

    var hero = $('#moments-hero');
    hero.style.background = store.settings.momentsBg;
    hero.style.backgroundSize = 'cover';
    hero.style.backgroundPosition = 'center';

    var list = store.moments.slice().sort(function (a, b) { return b.time - a.time; });
    if (!list.length) {
      $('#moments-list').innerHTML = '<div class="empty-state">' +
        '<div class="empty-icon">' + ICO.comment + '</div>' +
        '<div class="empty-title">还没有动态</div>' +
        '<div class="empty-sub">点击右上角发布你的第一条动态</div>' +
      '</div>';
      return;
    }

    $('#moments-list').innerHTML = list.map(function (m) {
      var author = m.authorId === 'me' ? me : findFriend(m.authorId);
      if (!author) author = { name: '已删除', color: '#c7c7cc' };
      var imgs = '';
      if (m.type === 'image' && m.images && m.images.length) {
        imgs = '<div class="moment-imgs">' + m.images.map(function (src) {
          return '<div class="moment-img" style="background-image:url(' + src + ')"></div>';
        }).join('') + '</div>';
      } else if (m.type === 'video') {
        imgs = '<div class="moment-video">' + ICO.play + '</div>';
      }
      var liked = m.likes && m.likes.indexOf('我') > -1;
      var likesHtml = '';
      if (m.likes && m.likes.length) {
        likesHtml = '<div class="moment-likes">' + ICO.like + '<span>' + m.likes.map(esc).join('、') + '</span></div>';
      }
      var commentsHtml = '';
      if (m.comments && m.comments.length) {
        commentsHtml = '<div class="moment-comments">' + m.comments.map(function (c) {
          return '<div class="mcomment"><b>' + esc(c.who) + '</b>：' + esc(c.text) + '</div>';
        }).join('') + '</div>';
      }
      return '<div class="moment-item">' +
        avatarHTML(author, '') +
        '<div class="moment-main">' +
          '<div class="moment-author">' + esc(m.authorId === 'me' ? me.name : (author.remark || author.name)) + '</div>' +
          (m.text ? '<div class="moment-text">' + esc(m.text) + '</div>' : '') +
          imgs +
          '<div class="moment-meta">' +
            '<span>' + fmtMomentTime(m.time) + '</span>' +
            '<div class="moment-actions">' +
              '<button class="ma-btn' + (liked ? ' on' : '') + '" data-like="' + m.id + '">' + ICO.like + '<span>' + (liked ? '取消' : '赞') + '</span></button>' +
              '<button class="ma-btn" data-comment="' + m.id + '">' + ICO.comment + '<span>评论</span></button>' +
            '</div>' +
          '</div>' +
          likesHtml +
          commentsHtml +
          '<div class="comment-input-row hidden" id="ci-' + m.id + '">' +
            '<input type="text" maxlength="40" placeholder="写评论..." data-comment-input="' + m.id + '" />' +
            '<button class="comment-send" data-comment-send="' + m.id + '">发送</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function fmtMomentTime(t) {
    var d = new Date(t);
    var diff = Date.now() - t;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function toggleLike(id) {
    var m = null;
    for (var i = 0; i < store.moments.length; i++) {
      if (store.moments[i].id === id) { m = store.moments[i]; break; }
    }
    if (!m) return;
    m.likes = m.likes || [];
    var idx = m.likes.indexOf('我');
    if (idx > -1) m.likes.splice(idx, 1);
    else m.likes.push('我');
    saveStore();
    renderMoments();
  }

  function toggleCommentBox(id) {
    var row = document.getElementById('ci-' + id);
    if (!row) return;
    row.classList.toggle('hidden');
    if (!row.classList.contains('hidden')) {
      var inp = row.querySelector('input');
      if (inp) inp.focus();
    }
  }

  function sendComment(id) {
    var inp = document.querySelector('[data-comment-input="' + id + '"]');
    if (!inp) return;
    var text = inp.value.trim();
    if (!text) return;
    var m = null;
    for (var i = 0; i < store.moments.length; i++) {
      if (store.moments[i].id === id) { m = store.moments[i]; break; }
    }
    if (!m) return;
    m.comments = m.comments || [];
    m.comments.push({ who: store.settings.myName || '我', text: text });
    saveStore();
    renderMoments();
  }

  /* 发布朋友圈 */
  function openMomentCompose() {
    state.draftMoment = { type: 'text', images: [] };
    $('#moment-text').value = '';
    $$('.type-chip').forEach(function (b) { b.classList.toggle('on', b.dataset.mtype === 'text'); });
    $('#moment-image-field').classList.add('hidden');
    $('#moment-video-field').classList.add('hidden');
    $('#moment-image-preview').innerHTML = '';
    openPage('app-moments-compose');
  }
  function publishMoment() {
    var text = ($('#moment-text').value || '').trim();
    var d = state.draftMoment;
    if (!text && !d.images.length && d.type !== 'video') {
      alert('写点什么吧');
      return;
    }
    store.moments.push({
      id: uid('m'), authorId: 'me',
      text: text, type: d.type, images: d.images.slice(),
      time: Date.now(), likes: [], comments: []
    });
    saveStore();
    closePage('app-moments-compose');
    renderMoments();
  }

  /* ================= 字卡库 ================= */
  function renderCards() {
    var box = $('#cards-grid');
    if (!store.cards.length) {
      box.innerHTML = '<div class="empty-state" style="grid-column:1/-1">' +
        '<div class="empty-icon">' + ICO.cards + '</div>' +
        '<div class="empty-title">还没有字卡</div>' +
        '<div class="empty-sub">点击右上角添加你的第一张字卡</div>' +
      '</div>';
      return;
    }
    box.innerHTML = store.cards.map(function (c, i) {
      return '<button class="card" type="button" data-card="' + i + '">' +
        '<div class="zi">' + esc(c.zi) + '</div>' +
        '<div class="py">' + esc(c.py || '') + '</div>' +
        '<div class="meaning">' + esc(c.mean || '') + '</div>' +
      '</button>';
    }).join('');
  }
  function addCard() {
    var zi = ($('#acard-zi').value || '').trim();
    if (!zi) { alert('请输入字或词'); return; }
    store.cards.push({
      id: uid('k'), zi: zi,
      py: ($('#acard-py').value || '').trim(),
      mean: ($('#acard-mean').value || '').trim()
    });
    saveStore();
    $('#acard-zi').value = '';
    $('#acard-py').value = '';
    $('#acard-mean').value = '';
    closePage('app-add-card');
    renderCards();
  }

  /* ================= 倒数日 ================= */
  function renderEvents() {
    var box = $('#evt-list');
    if (!store.events.length) {
      box.innerHTML = '<div class="empty-state">' +
        '<div class="empty-icon">' + ICO.hourglass + '</div>' +
        '<div class="empty-title">还没有倒数日</div>' +
        '<div class="empty-sub">点击右上角添加一个重要日子</div>' +
      '</div>';
      return;
    }
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var list = store.events.map(function (e) {
      var parts = e.date.split('-');
      var target = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      var days = Math.round((target - today) / 86400000);
      return { e: e, days: days };
    }).sort(function (a, b) { return Math.abs(a.days) - Math.abs(b.days); });

    box.innerHTML = list.map(function (item) {
      var e = item.e;
      var days = item.days;
      var label = days >= 0 ? '天后' : '天前';
      var num = Math.abs(days);
      return '<div class="evt">' +
        '<span class="evt-icon" style="background:' + (e.color || '#30b0c7') + '">' + ICO.clock + '</span>' +
        '<div class="evt-main">' +
          '<div class="evt-name">' + esc(e.name) + '</div>' +
          '<div class="evt-date">' + esc(e.date) + '</div>' +
        '</div>' +
        '<div class="evt-days"><b>' + num + '</b><span>' + label + '</span></div>' +
        '<button class="evt-del" data-evt-del="' + e.id + '">' + ICO.trash + '</button>' +
      '</div>';
    }).join('');
  }
  function addEvent() {
    var name = ($('#aevent-name').value || '').trim();
    var date = $('#aevent-date').value;
    if (!name) { alert('请输入名称'); return; }
    if (!date) { alert('请选择日期'); return; }
    store.events.push({
      id: uid('e'), name: name, date: date,
      color: ['#ff375f','#5e5ce6','#30b0c7','#ff9f0a','#10b981'][Math.floor(Math.random()*5)]
    });
    saveStore();
    $('#aevent-name').value = '';
    $('#aevent-date').value = '';
    closePage('app-add-event');
    renderEvents();
  }

  /* ================= 经期 ================= */
  function renderPeriod() {
    var d = state.calDate;
    var y = d.getFullYear();
    var m = d.getMonth();
    $('#cal-title').textContent = y + '年' + (m + 1) + '月';
    var firstDay = new Date(y, m, 1).getDay();
    var total = new Date(y, m + 1, 0).getDate();
    var today = new Date();
    var html = '';
    for (var i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';
    for (var day = 1; day <= total; day++) {
      var cls = 'cal-day';
      var isToday = (today.getFullYear() === y && today.getMonth() === m && today.getDate() === day);
      var isPeriod = day >= 12 && day <= 16;
      var isPred = day >= 9 && day <= 11;
      if (isPeriod) cls += ' period';
      else if (isPred) cls += ' predicted';
      if (isToday) cls += ' today';
      html += '<div class="' + cls + '">' + day + '</div>';
    }
    $('#cal-days').innerHTML = html;

    var nextStart = new Date(today.getFullYear(), today.getMonth(), 16);
    if (today.getDate() > 16) nextStart = new Date(today.getFullYear(), today.getMonth() + 1, 16);
    var diff = Math.ceil((nextStart - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
    $('#stat-next').textContent = Math.max(0, diff);
    var cycleDay = today.getDate() >= 16 ? (today.getDate() - 15) : (today.getDate() + 15);
    $('#stat-day').textContent = cycleDay;
  }

  /* ================= 美化 ================= */
  function renderBeautify() {
    var myAvatarBtn = $('#my-avatar-btn');
    if (store.settings.myAvatar) {
      myAvatarBtn.style.backgroundImage = 'url(' + store.settings.myAvatar + ')';
      myAvatarBtn.style.backgroundColor = '#1c1c1e';
      myAvatarBtn.style.color = 'transparent';
      myAvatarBtn.textContent = '';
    } else {
      myAvatarBtn.style.backgroundImage = '';
      myAvatarBtn.style.backgroundColor = '#1c1c1e';
      myAvatarBtn.style.color = '#fff';
      myAvatarBtn.textContent = (store.settings.myName || '我').charAt(0);
    }
    $('#my-name-input').value = store.settings.myName || '';
    $('#default-friend-input').value = store.settings.defaultFriendName || '';

    $('#wall-swatches').innerHTML = WALLS.map(function (w, i) {
      return '<button class="sw' + (i === store.settings.wall ? ' on' : '') + '" type="button" data-wall="' + i + '" style="background:' + w + '"></button>';
    }).join('');

    var chatHtml = CHAT_BGS.map(function (bg, i) {
      var on = (store.settings.chatBg === bg && !store.settings.chatBgIsImage) ? ' on' : '';
      return '<button class="sw' + on + '" type="button" data-chatbg="' + i + '" style="background:' + bg + '"></button>';
    }).join('');
    chatHtml += '<button class="sw upload" type="button" id="chatbg-upload">' + ICO.upload + '</button>';
    $('#chatbg-swatches').innerHTML = chatHtml;

    var mHtml = MOMENTS_BGS.map(function (bg, i) {
      var on = (store.settings.momentsBg === bg && !store.settings.momentsBgIsImage) ? ' on' : '';
      return '<button class="sw' + on + '" type="button" data-momentsbg="' + i + '" style="background:' + bg + '"></button>';
    }).join('');
    mHtml += '<button class="sw upload" type="button" id="momentsbg-upload">' + ICO.upload + '</button>';
    $('#momentsbg-swatches').innerHTML = mHtml;
  }

  function applyWall(i) {
    store.settings.wall = i;
    document.documentElement.style.setProperty('--wall', WALLS[i]);
    var dark = i === 4;
    document.querySelector('.statusbar').style.color = dark ? '#ffffff' : '#1c1c1e';
    $$('.app-label').forEach(function (el) {
      el.style.color = dark ? 'rgba(255,255,255,.9)' : '#2c2c30';
    });
    saveStore();
  }
  function applyChatBg(val, isImage) {
    store.settings.chatBg = val;
    store.settings.chatBgIsImage = !!isImage;
    document.documentElement.style.setProperty('--chat-bg', val);
    saveStore();
  }
  function applyMomentsBg(val, isImage) {
    store.settings.momentsBg = val;
    store.settings.momentsBgIsImage = !!isImage;
    document.documentElement.style.setProperty('--moments-bg', val);
    saveStore();
  }

  /* ================= 弹出层 ================= */
  function showSheet(html) {
    $('#sheet-content').innerHTML = html;
    $('#mask').classList.add('show');
    $('#sheet').classList.add('show');
  }
  function hideSheet() {
    $('#mask').classList.remove('show');
    $('#sheet').classList.remove('show');
  }

  /* ================= 音乐 ================= */
  function fmtTime(sec) {
    return Math.floor(sec / 60) + ':' + ('0' + Math.floor(sec % 60)).slice(-2);
  }
  function updateProgress() {
    var pct = Math.min(100, (state.pos / MUSIC_LEN) * 100);
    $('#progress-fill').style.width = pct + '%';
    $('#t-cur').textContent = fmtTime(state.pos);
  }
  function toggleMusic() {
    var icon = $('#play-icon');
    state.playing = !state.playing;
    if (state.playing) {
      icon.innerHTML = '<path d="M7.5 5h3.5v14H7.5zM13 5h3.5v14H13z"/>';
      state.timer = setInterval(function () {
        state.pos += 1;
        if (state.pos >= MUSIC_LEN) state.pos = 0;
        updateProgress();
      }, 1000);
    } else {
      icon.innerHTML = '<path d="M8 5.5v13l11-6.5z"/>';
      clearInterval(state.timer);
    }
  }

  /* ================= 事件绑定 ================= */
  function bind() {
    document.addEventListener('click', function (e) {
      // 打开应用
      var cell = e.target.closest('.app-cell');
      if (cell && cell.dataset.app) { openApp(cell.dataset.app); return; }

      // 关闭应用页
      var closeBtn = e.target.closest('[data-close]');
      if (closeBtn) {
        var page = closeBtn.closest('.app-page');
        if (page) {
          if (page.id === 'app-add-friend' && state.currentFriend) {
            closePage('app-add-friend'); openPage('app-chat');
          } else {
            closePage(page.id);
            if (page.id === 'app-chat') state.currentFriend = null;
          }
        }
        return;
      }

      // 添加好友按钮
      var addF = e.target.closest('[data-add-friend]');
      if (addF) { openAddFriend(addF.dataset.addFriend); return; }

      // 会话项
      var chatItem = e.target.closest('.chat-item');
      if (chatItem) { openChat(chatItem.dataset.app, chatItem.dataset.friend); return; }

      // 壁纸
      var sw = e.target.closest('[data-wall]');
      if (sw) { applyWall(Number(sw.dataset.wall)); renderBeautify(); return; }

      // 聊天背景
      var cb = e.target.closest('[data-chatbg]');
      if (cb) { applyChatBg(CHAT_BGS[Number(cb.dataset.chatbg)], false); renderBeautify(); return; }

      // 朋友圈背景
      var mb = e.target.closest('[data-momentsbg]');
      if (mb) { applyMomentsBg(MOMENTS_BGS[Number(mb.dataset.momentsbg)], false); renderBeautify(); renderMoments(); return; }

      // 字卡
      var card = e.target.closest('.card');
      if (card) { card.classList.toggle('on'); return; }

      // 添加字卡
      if (e.target.closest('#card-add-btn')) { openPage('app-add-card'); return; }
      if (e.target.closest('#acard-save')) { addCard(); return; }

      // 添加倒数日
      if (e.target.closest('#event-add-btn')) { openPage('app-add-event'); return; }
      if (e.target.closest('#aevent-save')) { addEvent(); return; }

      // 删除倒数日
      var delEvt = e.target.closest('[data-evt-del]');
      if (delEvt) {
        store.events = store.events.filter(function (x) { return x.id !== delEvt.dataset.evtDel; });
        saveStore(); renderEvents(); return;
      }

      // 添加好友保存
      if (e.target.closest('#af-save')) { saveFriend(); return; }

      // 我的头像
      if (e.target.closest('#my-avatar-btn')) {
        $('#file-avatar').dataset.target = 'my'; $('#file-avatar').click(); return;
      }
      // 好友头像
      if (e.target.closest('#af-avatar-btn')) {
        $('#file-avatar').dataset.target = 'friend'; $('#file-avatar').click(); return;
      }
      // 聊天背景上传
      if (e.target.closest('#chatbg-upload')) {
        $('#file-avatar').dataset.target = 'chatbg'; $('#file-avatar').click(); return;
      }
      // 朋友圈背景上传
      if (e.target.closest('#momentsbg-upload')) {
        $('#file-avatar').dataset.target = 'momentsbg'; $('#file-avatar').click(); return;
      }

      // 聊天返回
      if (e.target.closest('#chat-back')) { closeChat(); return; }

      // 聊天更多
      if (e.target.closest('#chat-more-btn')) { openChatActions(); return; }

      // 功能菜单
      var actionBtn = e.target.closest('[data-action]');
      if (actionBtn && actionBtn.closest('#sheet')) {
        handleChatAction(actionBtn.dataset.action); return;
      }

      // 写信
      if (e.target.closest('#write-letter-btn')) { openCompose(); return; }
      if (e.target.closest('#compose-send')) { sendLetter(); return; }

      // 信件详情
      var letterCard = e.target.closest('[data-open-letter]');
      if (letterCard) { openLetter(letterCard.dataset.openLetter); return; }

      // 问卷选项
      var svOpt = e.target.closest('[data-survey]');
      if (svOpt) { answerSurvey(svOpt.dataset.survey, Number(svOpt.dataset.opt)); return; }

      // 朋友圈入口
      if (e.target.closest('#wx-moments-btn')) { renderMoments(); openPage('app-moments'); return; }
      // 发布朋友圈
      if (e.target.closest('#moment-publish-btn')) { openMomentCompose(); return; }
      if (e.target.closest('#moment-publish-submit')) { publishMoment(); return; }

      // 朋友圈类型切换
      var chip = e.target.closest('.type-chip');
      if (chip) {
        $$('.type-chip').forEach(function (b) { b.classList.remove('on'); b.style.background = 'var(--soft)'; b.style.color = 'var(--text)'; });
        chip.classList.add('on'); chip.style.background = 'var(--accent)'; chip.style.color = '#fff';
        state.draftMoment.type = chip.dataset.mtype;
        $('#moment-image-field').classList.toggle('hidden', chip.dataset.mtype !== 'image');
        $('#moment-video-field').classList.toggle('hidden', chip.dataset.mtype !== 'video');
        return;
      }

      // 朋友圈图片上传
      if (e.target.closest('#moment-image-btn')) {
        $('#file-moment-img').click(); return;
      }

      // 点赞
      var likeBtn = e.target.closest('[data-like]');
      if (likeBtn) { toggleLike(likeBtn.dataset.like); return; }

      // 评论展开
      var cmtBtn = e.target.closest('[data-comment]');
      if (cmtBtn) { toggleCommentBox(cmtBtn.dataset.comment); return; }

      // 发送评论
      var cmtSend = e.target.closest('[data-comment-send]');
      if (cmtSend) { sendComment(cmtSend.dataset.commentSend); return; }

      // 关闭 sheet
      if (e.target.closest('[data-sheet-close]')) { hideSheet(); return; }
    });

    // 遮罩点击
    $('#mask').addEventListener('click', hideSheet);

    // 文件选择
    $('#file-avatar').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var target = e.target.dataset.target;
      if (target === 'my') {
        compressImage(file, 160, function (d) {
          store.settings.myAvatar = d; saveStore(); renderBeautify(); renderMoments();
          if (state.currentFriend) renderMessages();
        });
      } else if (target === 'friend') {
        compressImage(file, 160, function (d) {
          if (state.draftFriend) { state.draftFriend.avatar = d; renderFriendForm(); }
        });
      } else if (target === 'chatbg') {
        compressImage(file, 800, function (d) { applyChatBg('url(' + d + ')', true); renderBeautify(); });
      } else if (target === 'momentsbg') {
        compressImage(file, 800, function (d) { applyMomentsBg('url(' + d + ')', true); renderBeautify(); renderMoments(); });
      }
      this.value = '';
    });

    // 朋友圈图片上传
    $('#file-moment-img').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      compressImage(file, 800, function (d) {
        state.draftMoment.images.push(d);
        var prev = $('#moment-image-preview');
        var div = document.createElement('div');
        div.className = 'moment-img';
        div.style.backgroundImage = 'url(' + d + ')';
        prev.appendChild(div);
      });
      this.value = '';
    });

    // 我的昵称
    $('#my-name-input').addEventListener('input', function () {
      store.settings.myName = this.value; saveStore(); renderMoments();
      if (state.currentFriend) renderMessages();
    });

    // 默认好友名
    $('#default-friend-input').addEventListener('input', function () {
      store.settings.defaultFriendName = this.value || '梦'; saveStore();
    });

    // 聊天发送
    $('#composer').addEventListener('submit', function (e) {
      e.preventDefault();
      if (state.currentApp === 'mail') return;
      sendText();
    });

    // 聊天输入框（事件委托，因为 composer 会重建）
    document.addEventListener('input', function (e) {
      if (e.target.id === 'msg-input') autoGrow();
    });
    document.addEventListener('keydown', function (e) {
      if (e.target.id === 'msg-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendText();
      }
    });
    document.addEventListener('focusin', function (e) {
      if (e.target.id === 'msg-input') {
        setTimeout(function () { var b = $('#messages'); if (b) b.scrollTop = b.scrollHeight; }, 260);
      }
    });

    // 加号按钮
    document.addEventListener('click', function (e) {
      if (e.target.closest('#plus-btn')) {
        var f = state.currentFriend;
        if (!f || f.iBlocked || f.theyBlocked) return;
        openChatActions();
      }
    });

    // 音乐
    $('#play-btn').addEventListener('click', toggleMusic);

    // 日历
    $('#cal-prev').addEventListener('click', function () {
      state.calDate.setMonth(state.calDate.getMonth() - 1); renderPeriod();
    });
    $('#cal-next').addEventListener('click', function () {
      state.calDate.setMonth(state.calDate.getMonth() + 1); renderPeriod();
    });

    // 通话挂断
    $('#call-hangup-btn').addEventListener('click', endCall);
    $('#call-mute-btn').addEventListener('click', function () {
      this.classList.toggle('on');
    });
  }

  /* ================= 初始化 ================= */
  function init() {
    renderHome();
    bind();
    tickClock();
    setInterval(tickClock, 20000);

    applyWall(store.settings.wall || 0);
    document.documentElement.style.setProperty('--chat-bg', store.settings.chatBg || '#f4f4f6');
    document.documentElement.style.setProperty('--moments-bg', store.settings.momentsBg || MOMENTS_BGS[0]);

    $('#t-all').textContent = fmtTime(MUSIC_LEN);
    updateProgress();

    renderAppList('wechat');
    renderAppList('sms');
    renderAppList('mail');
    renderCards();
    renderEvents();
    renderMoments();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
