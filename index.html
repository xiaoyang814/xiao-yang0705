<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>栖夜</title>
<style>
*,*::before,*::after{box-sizing:border-box;touch-action:manipulation;}

:root{
  --bg:#ffffff;
  --bg-2:#f7f7f8;
  --bg-3:#eeeef1;
  --fg:#1c1c1e;
  --muted:#8e8e93;
  --line:#e4e4e7;
  --accent:#0b93f6;
  --accent-hover:#0a7fd4;
  --wechat:#07c160;
  --net:#e60026;
  --danger:#ff3b30;
  --radius:18px;
}

html,body{height:100%;}

body{
  margin:0;background:#fff;color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;}
input,textarea,select{font:inherit;color:inherit;}

/* ---------- 屏幕 ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
.screen[hidden]{display:none;}
.screen-body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
.screen-body[hidden]{display:none;}

/* ---------- 状态栏 ---------- */
.statusbar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 6px) 22px 6px;
  font-size:14px;font-weight:600;
}
.sb-right{letter-spacing:2px;font-size:12px;}

/* ---------- 桌面 ---------- */
#home{transition:background .3s;}
.home-body{flex:1 1 auto;overflow-y:auto;padding:8px 22px 0;}
.home-title{font-size:32px;font-weight:700;margin:6px 2px 22px;letter-spacing:1px;color:#1c1c1e;}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;}
.app-icon .ico{
  width:60px;height:60px;border-radius:16px;display:grid;place-items:center;
  font-size:22px;color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.14);
  transition:transform .12s;
}
.app-icon:active .ico{transform:scale(.9);}
.app-icon .lbl{font-size:11.5px;color:#3c3c43;font-weight:500;white-space:nowrap;}

.dock{
  flex:0 0 auto;
  margin:14px 16px calc(16px + env(safe-area-inset-bottom));
  padding:12px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:26px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  box-shadow:0 2px 14px rgba(0,0,0,.08);
}
.dock .app-icon .lbl{display:none;}

/* ---------- 通用返回 ---------- */
.back{width:34px;height:34px;font-size:24px;color:var(--accent);display:grid;place-items:center;flex:0 0 auto;line-height:1;}

/* ============================================================
   信息（iMessage）
   ============================================================ */
.imsg-top{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 6px) 12px 8px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  position:relative;
}
.imsg-peer{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.imsg-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#0b93f6,#5ac8fa);
  color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;
}
.imsg-name{font-size:11.5px;font-weight:600;}
.imsg-top .icon-btn{margin-left:auto;font-size:16px;color:var(--accent);width:34px;height:34px;display:grid;place-items:center;font-weight:600;}

.imsg-messages{
  flex:1 1 auto;overflow-y:auto;
  padding:16px 14px;
  display:flex;flex-direction:column;gap:5px;
  background:#fff;
  -webkit-overflow-scrolling:touch;
}

.msg{display:flex;flex-direction:column;max-width:min(76%,600px);animation:pop .18s ease-out;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.msg.me{align-self:flex-end;align-items:flex-end;}
.msg.them{align-self:flex-start;align-items:flex-start;}

.msg .bubble{
  padding:8px 13px;border-radius:18px;line-height:1.4;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  font-size:15px;
}
.msg.me .bubble{background:#0b93f6;color:#fff;border-bottom-right-radius:5px;}
.msg.them .bubble{background:#e9e9eb;color:#1c1c1e;border-bottom-left-radius:5px;}
.msg time{margin-top:2px;padding:0 4px;font-size:10.5px;color:#c7c7cc;user-select:none;}

.letter-card{
  padding:12px 14px;border-radius:14px;
  background:linear-gradient(135deg,#f3e9ff,#e8f0ff);
  border:1px solid #dcd0f5;max-width:100%;
}
.letter-title{font-weight:600;margin-bottom:6px;font-size:14px;color:#7a5bd8;}
.letter-body{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.6;color:#3a3a4a;}

.typing{
  display:flex;gap:4px;padding:12px 14px;
  background:#e9e9eb;border-radius:18px;border-bottom-left-radius:5px;
  width:fit-content;align-self:flex-start;
}
.typing span{width:7px;height:7px;border-radius:50%;background:#a1a1a6;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}

.imsg-composer{
  flex:0 0 auto;
  border-top:1px solid var(--line);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
.imsg-form{display:flex;align-items:flex-end;gap:8px;padding:8px 12px;}
.imsg-plus{width:32px;height:32px;border-radius:50%;border:1.5px solid #c7c7cc;color:#8e8e93;font-size:20px;display:grid;place-items:center;flex:0 0 auto;line-height:1;}
#input{
  flex:1 1 auto;max-height:130px;min-height:36px;
  padding:7px 14px;border:1px solid var(--line);border-radius:18px;
  background:#fff;outline:none;resize:none;line-height:1.4;transition:border-color .15s;
}
#input:focus{border-color:#0b93f6;}
#sendBtn{
  width:32px;height:32px;border-radius:50%;background:#0b93f6;color:#fff;
  font-size:17px;display:grid;place-items:center;flex:0 0 auto;transition:opacity .15s;
}
#sendBtn:disabled{opacity:.3;cursor:not-allowed;}

/* 功能面板 */
.func-panel{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  padding:12px;border-bottom:1px solid var(--line);background:#fafafa;
}
.func-panel[hidden]{display:none;}
.func-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 4px;border-radius:12px;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:11px;color:#333;
}
.func-btn .fi{font-size:20px;}

/* ============================================================
   微信
   ============================================================ */
.wx-top{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
  background:#EDEDED;border-bottom:1px solid #d9d9d9;position:relative;
}
.wx-title{font-size:17px;font-weight:600;}
.wx-top .back{position:absolute;left:6px;color:#333;}
.wx-body{flex:1 1 auto;overflow-y:auto;background:#EDEDED;-webkit-overflow-scrolling:touch;}
.wx-tabbar{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:#F7F7F7;border-top:1px solid #d9d9d9;
  padding-bottom:calc(4px + env(safe-area-inset-bottom));
}
.wx-tabbar button{padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#7a7a7a;}
.wx-tabbar button.active{color:#07c160;}
.wx-tabbar .ti{font-size:16px;line-height:1;font-weight:600;}

.wx-chat-item{display:flex;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid #f0f0f0;align-items:center;cursor:pointer;}
.wx-chat-item:active{background:#f2f2f2;}
.wx-avatar{width:46px;height:46px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:600;flex:0 0 auto;}
.wx-info{flex:1 1 auto;min-width:0;}
.wx-name{font-size:16px;font-weight:500;color:#1a1a1a;}
.wx-preview{font-size:13px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.wx-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:#b2b2b2;flex:0 0 auto;}
.wx-badge{background:#fa5151;color:#fff;border-radius:9px;min-width:18px;height:18px;padding:0 5px;font-size:11px;display:grid;place-items:center;}

.wx-cell{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #f0f0f0;font-size:16px;cursor:pointer;}
.wx-cell:active{background:#f2f2f2;}
.wx-cell .ci{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;}
.wx-cell .arrow{margin-left:auto;color:#c8c8cd;font-size:16px;}

.wx-chat-body{flex:1 1 auto;overflow-y:auto;background:#EDEDED;padding:14px 12px;-webkit-overflow-scrolling:touch;}
.wx-msg{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;}
.wx-msg.me{flex-direction:row-reverse;}
.wx-msg .av{width:36px;height:36px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:0 0 auto;}
.wx-msg .bb{max-width:66%;padding:9px 12px;border-radius:6px;background:#fff;font-size:15px;line-height:1.45;word-break:break-word;}
.wx-msg.me .bb{background:#95EC69;color:#111;}
.wx-composer{
  flex:0 0 auto;background:#F7F7F7;border-top:1px solid #d9d9d9;
  display:flex;gap:8px;padding:8px 12px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));align-items:flex-end;
}
.wx-composer textarea{
  flex:1 1 auto;border:none;border-radius:5px;padding:8px 10px;
  background:#fff;outline:none;resize:none;max-height:110px;min-height:36px;line-height:1.4;
}
.wx-send{background:#07c160;color:#fff;border-radius:5px;padding:8px 16px;font-size:14px;flex:0 0 auto;}
.wx-send:disabled{opacity:.4;}

/* 朋友圈 */
.moments-cover{
  height:230px;background:linear-gradient(135deg,#0b93f6,#5ac8fa);
  position:relative;flex:0 0 auto;
}
.moments-cover .mc-av{
  position:absolute;right:16px;bottom:-24px;width:52px;height:52px;border-radius:8px;
  background:#fff;display:grid;place-items:center;font-size:18px;color:#0b93f6;font-weight:600;
  border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.moments-body{flex:1 1 auto;overflow-y:auto;background:#fff;}
.moment{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid #f2f2f2;}
.moment .av{width:40px;height:40px;border-radius:5px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
.moment .ct{flex:1 1 auto;min-width:0;}
.moment .nm{color:#576b95;font-size:15px;font-weight:500;margin-bottom:4px;}
.moment .tx{font-size:15px;line-height:1.5;margin-bottom:8px;word-break:break-word;color:#1a1a1a;}
.moment .imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;max-width:280px;}
.moment .imgs div{aspect-ratio:1;border-radius:3px;background:linear-gradient(135deg,#d8e8ff,#b8d4ff);}
.moment .ft{display:flex;justify-content:space-between;font-size:12px;color:#b2b2b2;}
.moment .likes{background:#f7f7f7;border-radius:4px;padding:6px 8px;font-size:13px;color:#576b95;margin-top:6px;}

/* ============================================================
   音乐
   ============================================================ */
.net-top{
  flex:0 0 auto;background:linear-gradient(180deg,#e60026,#c20c0c);color:#fff;
  padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;
  display:flex;align-items:center;gap:10px;
}
.net-top .back{color:#fff;}
.net-top h1{font-size:17px;margin:0;font-weight:600;}
.net-body{flex:1 1 auto;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch;}
.net-section{padding:16px;}
.net-section h3{margin:0 0 12px;font-size:16px;color:#111;}
.net-banner{
  margin:0 16px 4px;height:120px;border-radius:10px;
  background:linear-gradient(135deg,#ff5f6d,#ffc371);
  display:flex;align-items:center;padding:0 20px;color:#fff;
}
.net-banner b{font-size:20px;display:block;}
.net-banner span{font-size:13px;opacity:.9;}
.song{display:flex;gap:12px;padding:8px 0;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer;}
.song:active{background:#fafafa;}
.song .num{width:22px;text-align:center;color:#999;font-size:13px;flex:0 0 auto;}
.song .thumb{width:44px;height:44px;border-radius:4px;background:linear-gradient(135deg,#ff5f6d,#ffc371);flex:0 0 auto;}
.song .info{flex:1 1 auto;min-width:0;}
.song .ttl{font-size:15px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song .art{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.song.playing .ttl{color:#e60026;}
.net-player{
  flex:0 0 auto;background:#f7f7f7;border-top:1px solid #eee;
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
}
.net-player .pthumb{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff5f6d,#ffc371);flex:0 0 auto;}
.net-player.playing .pthumb{animation:spin 8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.net-player .pinfo{flex:1 1 auto;min-width:0;}
.net-player .pt{font-size:14px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.net-player .pa{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.net-player .pbtn{
  width:36px;height:36px;border-radius:50%;background:#e60026;color:#fff;
  display:grid;place-items:center;font-size:16px;flex:0 0 auto;
}

/* ============================================================
   设置
   ============================================================ */
.set-top{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:#f7f7f8;border-bottom:1px solid var(--line);
}
.set-top h1{font-size:17px;margin:0;font-weight:600;}
.set-body{flex:1 1 auto;overflow-y:auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom));background:#f7f7f8;-webkit-overflow-scrolling:touch;}
.set-group{background:#fff;border-radius:12px;margin-bottom:18px;overflow:hidden;}
.set-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f2f2f4;cursor:pointer;min-height:50px;}
.set-item:last-child{border-bottom:none;}
.set-item:active{background:#f5f5f7;}
.set-item .si{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:0 0 auto;}
.set-item .st{flex:1 1 auto;font-size:16px;color:#1c1c1e;}
.set-item .sv{color:#8e8e93;font-size:15px;max-width:52%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.set-item .arrow{color:#c8c8cd;font-size:17px;margin-left:2px;}
.set-title{font-size:13px;color:#8e8e93;margin:0 4px 8px;}
.sv-textarea{
  width:100%;min-height:80px;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:#fff;outline:none;resize:vertical;line-height:1.5;
}
.sv-textarea:focus{border-color:var(--accent);}

.switch{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch span{position:absolute;inset:0;background:#e5e5ea;border-radius:24px;transition:background .2s;cursor:pointer;}
.switch span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch input:checked + span{background:var(--wechat);}
.switch input:checked + span::before{transform:translateX(18px);}

.btn{
  padding:9px 16px;border-radius:10px;background:var(--bg-3);
  font-size:14px;transition:background .15s;color:#1c1c1e;
}
.btn:hover{background:#e2e2e6;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-hover);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.block{width:100%;}

.rule{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
.rule-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.rule-row input[type=text]{
  flex:1 1 130px;min-width:0;padding:7px 10px;background:#fff;
  border:1px solid var(--line);border-radius:8px;outline:none;font-size:14px;
}
.rule-row input[type=text]:focus{border-color:var(--accent);}
.rule-row select{padding:7px 8px;background:#fff;border:1px solid var(--line);border-radius:8px;outline:none;font-size:14px;}
.rule-replies{
  width:100%;margin-top:8px;padding:8px 10px;background:#fff;
  border:1px solid var(--line);border-radius:8px;resize:vertical;min-height:56px;
  line-height:1.5;outline:none;font-size:14px;
}
.rule-replies:focus{border-color:var(--accent);}

.storage-bar{height:8px;border-radius:4px;background:var(--bg-3);overflow:hidden;margin:8px 0 16px;}
.storage-bar > div{height:100%;width:0;background:linear-gradient(90deg,#0b93f6,#5ac8fa);border-radius:4px;transition:width .3s;}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;}
.stat-row span:last-child{color:var(--muted);}

.empty-hint{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}

/* ============================================================
   字卡库
   ============================================================ */
.card-list{display:flex;flex-direction:column;gap:10px;}
.word-card{
  border-radius:14px;padding:16px;color:#fff;font-size:15px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;position:relative;
  box-shadow:0 4px 14px rgba(0,0,0,.12);
}
.word-card .del{
  position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.22);color:#fff;font-size:13px;display:grid;place-items:center;
}
.form-panel{background:#fff;border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.form-panel label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px;}
.form-panel input[type=text],.form-panel input[type=date],.form-panel input[type=datetime-local],.form-panel select{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff;margin-bottom:12px;
}
.form-panel textarea{
  width:100%;min-height:80px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;outline:none;resize:vertical;line-height:1.5;margin-bottom:12px;
}
.form-panel input:focus,.form-panel textarea:focus,.form-panel select:focus{border-color:var(--accent);}
.color-row{display:flex;gap:10px;margin-bottom:12px;}
.color-dot{width:28px;height:28px;border-radius:50%;border:3px solid transparent;transition:border-color .15s,transform .12s;}
.color-dot.active{border-color:#1c1c1e;transform:scale(1.08);}

/* ============================================================
   经期
   ============================================================ */
.period-hero{
  background:linear-gradient(135deg,#ff6b9d,#ff9ec4);
  border-radius:16px;padding:22px 18px;color:#fff;margin-bottom:16px;
  box-shadow:0 6px 20px rgba(255,107,157,.3);
}
.period-hero .big{font-size:38px;font-weight:700;line-height:1.1;}
.period-hero .sub{font-size:13px;opacity:.92;margin-top:6px;}
.period-stat{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
.period-stat .box{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.period-stat .box b{display:block;font-size:20px;color:#ff4d8d;margin-bottom:2px;}
.period-stat .box span{font-size:12px;color:var(--muted);}
.history-item{
  display:flex;justify-content:space-between;padding:12px 14px;background:#fff;
  border-radius:10px;margin-bottom:8px;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);
}

/* ============================================================
   倒数日
   ============================================================ */
.cd-item{
  display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;
  padding:16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.06);
}
.cd-item .cd-num{
  min-width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#5856d6,#7a78ff);

/* ============================================================
   信箱
   ============================================================ */

/* 通用 icon-btn */
.icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:16px;color:var(--muted);font-weight:600;}
.icon-btn:hover{background:var(--bg-3);}

/* 功能弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal-mask[hidden]{display:none;}
.modal-box{
  background:#fff;border-radius:16px;width:100%;max-width:340px;padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.2);
}
.modal-box h3{margin:0 0 12px;font-size:16px;text-align:center;}
.modal-box input,.modal-box textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;outline:none;
  margin-bottom:12px;font-size:14px;
}
.modal-box input:focus,.modal-box textarea:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:10px;}

.modal-actions .ok{background:var(--accent);color:#fff;}
.modal-actions .ok.green{background:var(--wechat);}

</style>

<script>
(() => {
  'use strict';

  /* ============================================================
     常量
     ============================================================ */
  const DB_NAME = 'qiyе';
  const DB_VERSION = 3;
  const PAGE_SIZE = 60;

  const DEFAULT_SETTINGS = {
    myName: '我',
    peerName: '梦',
    peerAvatar: '梦',
    autoReplyEnabled: true,
    delayMin: 600,
    delayMax: 1400,
    fallback: '',
    wallpaper: 'white',
    accent: '#0b93f6',
    periodCycle: 28,
    blockedByMe: false,
    blockedByThem: false,
    wxFriendAdded: false,
    bgKeepAlive: false,
    notificationsEnabled: false,
  };

  const APPS = [
    { id:'messages',  name:'信息',   icon:'信', bg:'linear-gradient(135deg,#34c759,#30d158)' },
    { id:'wechat',    name:'微信',   icon:'微', bg:'linear-gradient(135deg,#07c160,#10d56a)' },
    { id:'music',     name:'音乐',   icon:'乐', bg:'linear-gradient(135deg,#e60026,#c20c0c)' },
    { id:'settings',  name:'设置',   icon:'设', bg:'linear-gradient(135deg,#8e8e93,#a1a1a6)' },
    { id:'cards',     name:'字卡库', icon:'字', bg:'linear-gradient(135deg,#ff9500,#ffb340)' },
    { id:'period',    name:'经期',   icon:'期', bg:'linear-gradient(135deg,#ff6b9d,#ff9ec4)' },
    { id:'countdown', name:'倒数日', icon:'日', bg:'linear-gradient(135deg,#5856d6,#7a78ff)' },
    { id:'mailbox',   name:'信箱',   icon:'箱', bg:'linear-gradient(135deg,#af52de,#c77dff)' },
  ];

  const DOCK_APPS = ['messages','wechat','music','settings'];

  const WALLPAPERS = [
    { id:'white', name:'纯白',   css:'#ffffff', dark:false },
    { id:'gray',  name:'浅灰',   css:'linear-gradient(180deg,#f5f5f7,#e8e8ed)', dark:false },
    { id:'dawn',  name:'晨雾',   css:'linear-gradient(180deg,#ffeef2,#e8f0ff)', dark:false },
    { id:'mint',  name:'薄荷',   css:'linear-gradient(180deg,#e8fff4,#e0f0ff)', dark:false },
    { id:'peach', name:'蜜桃',   css:'linear-gradient(180deg,#fff0e6,#ffe0f0)', dark:false },
    { id:'night', name:'夜',     css:'linear-gradient(180deg,#1c1c1e,#2c2c34)', dark:true  },
  ];

  const ACCENTS = ['#0b93f6','#07c160','#e60026','#af52de','#ff9500'];

  const CARD_COLORS = ['#0b93f6','#07c160','#ff9500','#af52de','#ff2d55','#1c1c1e'];

  const SONGS = [
    { t:'起风了',       a:'买辣椒也用券' },
    { t:'孤勇者',       a:'陈奕迅' },
    { t:'夜航星',       a:'苏运莹' },
    { t:'晴天',         a:'周杰伦' },
    { t:'后来',         a:'刘若英' },
    { t:'漠河舞厅',     a:'柳爽' },
    { t:'海底',         a:'一支榴莲' },
    { t:'这世界那么多人', a:'莫文蔚' },
    { t:'星辰大海',     a:'黄霄雲' },
    { t:'岁月神偷',     a:'金玟岐' },
  ];

  const WX_CHATS = [
    { name:'梦',         av:'梦', color:'#07c160', preview:'今天也要开心呀', time:'刚刚',   badge:2 },
    { name:'家人群',     av:'家', color:'#ff9500', preview:'[图片]',              time:'上午 9:20' },
    { name:'文件传输助手', av:'文', color:'#4f8cff', preview:'栖夜-备份.json',    time:'昨天' },
    { name:'林',         av:'林', color:'#af52de', preview:'在吗？',              time:'星期一' },
  ];

  const MOMENTS = [
    { name:'梦', av:'梦', color:'#0b93f6', text:'今天的风很温柔，路过那家店又想起你。',
      time:'10分钟前', imgs:3, likes:['我','林'] },
    { name:'林', av:'林', color:'#af52de', text:'新买的咖啡豆，苦得很刚好。',
      time:'2小时前', imgs:1, likes:['梦'] },
    { name:'梦', av:'梦', color:'#0b93f6', text:'栖夜，晚安。',
      time:'昨天 23:41', imgs:0, likes:['我'] },
  ];

  /* ============================================================
     小工具
     ============================================================ */
  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  const pad   = n => String(n).padStart(2, '0');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pickOne = arr => (Array.isArray(arr) && arr.length) ? arr[Math.floor(Math.random() * arr.length)] : null;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function clampInt(v, min, max, fallback) {
    const n = parseInt(v, 10);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  /* ============================================================
     IndexedDB
     ============================================================ */
  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('messages')) {
          const s = d.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
          s.createIndex('ts', 'ts');
        }
        if (!d.objectStoreNames.contains('autoreply')) d.createObjectStore('autoreply', { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('letters'))   d.createObjectStore('letters',   { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('settings'))  d.createObjectStore('settings',  { keyPath: 'key' });
        if (!d.objectStoreNames.contains('cards'))     d.createObjectStore('cards',     { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('periods'))   d.createObjectStore('periods',   { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('countdowns')) d.createObjectStore('countdowns', { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('wxMessages')) d.createObjectStore('wxMessages', { keyPath: 'id', autoIncrement: true });
        if (!d.objectStoreNames.contains('wxFriends')) d.createObjectStore('wxFriends', { keyPath: 'id', autoIncrement: true });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  }

  const os = (name, mode = 'readonly') => db.transaction(name, mode).objectStore(name);
  const pr = (req) => new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });

  /* ============================================================
     设置
     ============================================================ */
  let settings = { ...DEFAULT_SETTINGS };

  async function loadSettings() {
    const row = await pr(os('settings').get('main'));
    if (row && row.value) settings = { ...DEFAULT_SETTINGS, ...row.value };
    return settings;
  }
  const saveSettings = () => pr(os('settings', 'readwrite').put({ key: 'main', value: settings }));

  /* ============================================================
     消息读写
     ============================================================ */
  async function addMessage(m) {
    const id = await pr(os('messages', 'readwrite').add(m));
    return { ...m, id };
  }

  function pageMessages(before) {
    return new Promise((resolve, reject) => {
      const out = [];
      const range = (before === null || before === undefined) ? null : IDBKeyRange.upperBound(before, true);
      const req = os('messages').openCursor(range, 'prev');
      req.onsuccess = (e) => {
        const cur = e.target.result;
        if (!cur || out.length >= PAGE_SIZE) { resolve(out.reverse()); return; }
        out.push(cur.value);
        cur.continue();
      };
      req.onerror = () => reject(req.error);
    });
  }

  /* ============================================================
     屏幕导航
     ============================================================ */
  const stack = ['home'];
  const screenEls = {};

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => { s.hidden = true; });
    const el = document.getElementById(id);
    if (el) el.hidden = false;
    screenEls[id] = el;
  }

  function go(id) {
    if (stack[stack.length - 1] === id) return;
    stack.push(id);
    showScreen(id);
  }

  function back() {
    if (stack.length <= 1) return;
    stack.pop();
    showScreen(stack[stack.length - 1]);
    const id = stack[stack.length - 1];
    if (id === 'app-messages') scrollToBottom();
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-back]');
    if (b) { e.preventDefault(); back(); }
  });

  /* ============================================================
     格式化
     ============================================================ */
  function fmtTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (d.toDateString() === now.toDateString()) return t;
    return `${d.getMonth() + 1}月${d.getDate()}日 ${t}`;
  }
  function fmtFull(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtDate(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function countdown(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    if (d > 0) return `${d} 天 ${h} 小时`;
    if (h > 0) return `${h} 小时 ${m} 分`;
    return `${m} 分`;
  }
  function fmtBytes(n) {
    if (!n) return '0 B';
    const units = ['B','KB','MB','GB','TB'];
    let i = 0, v = n;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return v.toFixed(v >= 100 || i === 0 ? 0 : 1) + ' ' + units[i];
  }

  /* ============================================================
     桌面
     ============================================================ */
  const homeEl = $('#home');

  function buildAppIcon(app, inDock) {
    const btn = document.createElement('button');
    btn.className = 'app-icon';
    btn.type = 'button';
    btn.dataset.app = app.id;
    btn.innerHTML = `<span class="ico" style="background:${app.bg}">${app.icon}</span>` +
                    (inDock ? '' : `<span class="lbl">${app.name}</span>`);
    return btn;
  }

  function renderHome() {
    const grid = $('#appGrid');
    const dock = $('#dock');
    grid.replaceChildren();
    dock.replaceChildren();
    for (const a of APPS) grid.appendChild(buildAppIcon(a, false));
    for (const id of DOCK_APPS) {
      const a = APPS.find(x => x.id === id);
      if (a) dock.appendChild(buildAppIcon(a, true));
    }
    applyWallpaper();
  }

  function applyWallpaper() {
    const w = WALLPAPERS.find(x => x.id === settings.wallpaper) || WALLPAPERS[0];
    homeEl.style.background = w.css;
    const title = $('.home-title');
    if (title) title.style.color = w.dark ? '#fff' : '#1c1c1e';

  /* ============================================================
     信息（iMessage）消息渲染
     ============================================================ */
  const messagesEl   = $('#messages');
  const composerEl   = $('#composer');
  const inputEl      = $('#input');
  const sendBtn      = $('#sendBtn');
  const imsgFuncPanel = $('#imsgFuncPanel');

  const state = { oldestId:null, hasMore:true, loading:false, typingEl:null, replyBusy:false };

  function buildMessageEl(m) {
    const el = document.createElement('div');
    el.className = 'msg ' + (m.role === 'me' ? 'me' : 'them');
    el.dataset.id = m.id;

    if (m.type === 'letter') {
      const card = document.createElement('div');
      card.className = 'letter-card';
      const title = document.createElement('div');
      title.className = 'letter-title';
      title.textContent = '信箱 · ' + (m.title || '一封信');
      const body = document.createElement('div');
      body.className = 'letter-body';
      body.textContent = m.text;
      card.append(title, body);
      el.appendChild(card);
    } else if (m.type === 'system') {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.style.background = '#f2f2f4';
      bubble.style.color = '#8e8e93';
      bubble.style.fontSize = '12px';
      bubble.textContent = m.text;
      el.appendChild(bubble);
    } else {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = m.text;
      el.appendChild(bubble);
    }

    const time = document.createElement('time');
    time.textContent = fmtTime(m.ts);
    el.appendChild(time);
    return el;
  }

  const isNearBottom = () =>
    messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;

  function scrollToBottom(smooth = false) {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }

  function appendMessageEl(m) {
    const stick = isNearBottom();
    messagesEl.appendChild(buildMessageEl(m));
    if (stick || m.role === 'me') scrollToBottom();
  }

  async function initChat() {
    const msgs = await pageMessages(null);
    state.oldestId = msgs.length ? msgs[0].id : null;
    state.hasMore  = msgs.length === PAGE_SIZE;

    const frag = document.createDocumentFragment();
    for (const m of msgs) frag.appendChild(buildMessageEl(m));
    messagesEl.replaceChildren(frag);
    scrollToBottom();
  }

  async function loadOlder() {
    if (state.loading || !state.hasMore) return;
    state.loading = true;
    try {
      const msgs = await pageMessages(state.oldestId);
      if (!msgs.length) { state.hasMore = false; return; }
      const prevHeight = messagesEl.scrollHeight;
      const prevTop    = messagesEl.scrollTop;
      const frag = document.createDocumentFragment();
      for (const m of msgs) frag.appendChild(buildMessageEl(m));
      messagesEl.insertBefore(frag, messagesEl.firstChild);
      state.oldestId = msgs[0].id;
      if (msgs.length < PAGE_SIZE) state.hasMore = false;
      messagesEl.scrollTop = prevTop + (messagesEl.scrollHeight - prevHeight);
    } finally { state.loading = false; }
  }

  messagesEl.addEventListener('scroll', () => {
    if (messagesEl.scrollTop < 80) loadOlder();
  }, { passive: true });

  /* --- 输入 --- */
  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
  }
  function refreshSendBtn() { sendBtn.disabled = !inputEl.value.trim(); }

  inputEl.addEventListener('input', () => { autoGrow(); refreshSendBtn(); });
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      composerEl.requestSubmit();
    }
  });

  composerEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    if (settings.blockedByMe) { alert('你已拉黑对方，无法发送消息'); return; }
    if (settings.blockedByThem) { alert('对方已拉黑你'); return; }
    inputEl.value = '';
    autoGrow();
    refreshSendBtn();
    const m = await addMessage({ role:'me', type:'text', text, ts: Date.now() });
    appendMessageEl(m);
    inputEl.focus();
    maybeAutoReply(text);
  });

  /* --- 功能面板 --- */
  $('#imsgPlusBtn').addEventListener('click', () => {
    imsgFuncPanel.hidden = !imsgFuncPanel.hidden;
  });

  imsgFuncPanel.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-func]');
    if (!btn) return;
    imsgFuncPanel.hidden = true;
    const func = btn.dataset.func;
    if (func === 'survey') await openSurveyModal('imsg');
    else if (func === 'photo') await openPhotoModal('imsg');
    else if (func === 'choose') await openChooseModal('imsg');
    else if (func === 'call') await openCallModal('imsg');
    else if (func === 'shoot') await openShootModal('imsg');
  });

  /* --- 自动回复（从字卡库挑选） --- */
  async function getReply(text) {
    if (settings.blockedByThem) return null;
    if (!settings.autoReplyEnabled) return null;
    const cards = await pr(os('cards').getAll());
    if (cards.length) return pickOne(cards).text;
    return null;
  }

  function showTyping() {
    if (state.typingEl) return;
    const el = document.createElement('div');
    el.className = 'typing';
    el.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(el);
    state.typingEl = el;
    if (isNearBottom()) scrollToBottom();
  }
  function hideTyping() {
    if (state.typingEl) { state.typingEl.remove(); state.typingEl = null; }
  }

  async function maybeAutoReply(userText) {
    if (state.replyBusy) return;
    const reply = await getReply(userText);
    if (!reply) return;

    const spread = Math.max(0, settings.delayMax - settings.delayMin);
    const delay  = Math.max(0, settings.delayMin + Math.random() * spread);

    state.replyBusy = true;
    showTyping();
    try {
      await sleep(delay);
      hideTyping();
      const m = await addMessage({ role:'them', type:'text', text: reply, ts: Date.now() });
      appendMessageEl(m);
      notify('新消息', reply);
    } finally {
      state.replyBusy = false;
      hideTyping();
    }
  }

  /* ============================================================
     通知
     ============================================================ */
  function notify(title, body) {
    if (!settings.notificationsEnabled) return;
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      new Notification(title, { body, tag: 'qiyе' });
    }
  }

  async function requestNotificationPermission() {
    if (!('Notification' in window)) { alert('当前浏览器不支持通知'); return; }
    const p = await Notification.requestPermission();
    settings.notificationsEnabled = p === 'granted';
    await saveSettings();
    if (settings.notificationsEnabled) {
      new Notification('栖夜', { body: '通知已开启' });
    }
    alert(settings.notificationsEnabled ? '通知已开启' : '通知未授权');
  }

  /* ============================================================
     通用弹窗
     ============================================================ */
  const modalMask = $('#modalMask');
  const modalBox = $('#modalBox');

  function showModal(html, onOk, okText = '确定', okClass = '') {
    modalBox.innerHTML = html + `
      <div class="modal-actions">
        <button class="cancel" id="modalCancel" type="button">取消</button>
        <button class="ok ${okClass}" id="modalOk" type="button">${okText}</button>
      </div>
    `;
    modalMask.hidden = false;
    return new Promise((resolve) => {
      const close = (v) => { modalMask.hidden = true; resolve(v); };
      $('#modalCancel').addEventListener('click', () => close(null));
      $('#modalOk').addEventListener('click', () => {
        const ok = modalBox.querySelector('#modalOk');
        if (onOk) { const r = onOk(ok); if (r === false) return; }
        close(true);
      });
    });
  }

  modalMask.addEventListener('click', (e) => {
    if (e.target === modalMask) { modalMask.hidden = true; }
  });

  async function sendFeatureMessage(platform, text) {
    if (platform === 'imsg') {
      if (settings.blockedByMe) { alert('你已拉黑对方'); return; }
      const m = await addMessage({ role:'me', type:'text', text, ts: Date.now() });
      appendMessageEl(m);
      maybeAutoReply(text);
    } else if (platform === 'wx') {
      if (!wxCurrent) return;
      appendWxMsg($('#wxChatBody'), 'me', text, wxCurrent);
      wxAutoReply(text);

  /* ============================================================
     微信
     ============================================================ */
  let wxTab = 'chats';

  $$('.wx-tabbar button').forEach(btn => {
    btn.addEventListener('click', () => renderWxTab(btn.dataset.wxtab));

  async function renderWxTab(tab) {

    const body = $('#wxBody');
    body.replaceChildren();

    if (tab === 'chats') {
      if (!settings.wxFriendAdded) {
        body.innerHTML = `
          <div style="text-align:center;padding:60px 20px;">

          </div>
        `;
        const btn = $('#wxAddDreamBtn');
        if (btn) btn.addEventListener('click', async () => {
          settings.wxFriendAdded = true;
          await saveSettings();
          await pr(os('wxFriends', 'readwrite').add({ name: settings.peerName, addedAt: Date.now() }));
          renderWxTab('chats');
        });

      }

      for (const c of WX_CHATS) {

        const row = document.createElement('div');
        row.className = 'wx-cell';
        row.innerHTML = `<span class="ci" style="background:${c.bg}">${c.icon}</span><span>${esc(c.name)}</span><span class="arrow">›</span>`;
        if (c.act) row.addEventListener('click', c.act);
        body.appendChild(row);

      const row = document.createElement('div');

        `<div style="width:72px;height:72px;border-radius:10px;margin:0 auto 14px;background:linear-gradient(135deg,#0b93f6,#5ac8fa);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:600;">我</div>` +
        `<div style="font-size:19px;font-weight:600;color:#1a1a1a;">${esc(settings.myName)}</div>` +
        `<div style="font-size:12px;color:#999;margin-top:6px;">微信号：qiyе_me</div>`;
      body.appendChild(row);

  /* --- 微信聊天 --- */
  function openWxChat(chat) {
    if (chat.name === '梦' && !settings.wxFriendAdded) {
      alert('请先添加梦为好友');
      return;
    }
    wxCurrent = chat;
    $('#wxChatName').textContent = chat.name;
    const body = $('#wxChatBody');
    body.replaceChildren();

    if (chat.name === '梦') {
      appendWxMsg(body, 'them', '晚上好呀～', chat);
      appendWxMsg(body, 'them', '今天过得怎么样？', chat);
    }

    $('#wxChatInput').value = '';
    $('#wxChatSend').disabled = true;
    go('wx-chat');
    setTimeout(() => body.scrollTop = body.scrollHeight, 0);
  }

  function appendWxMsg(container, role, text, chat) {
    const el = document.createElement('div');
    el.className = 'wx-msg ' + (role === 'me' ? 'me' : '');
    const av = role === 'me' ? { t: settings.myName.slice(0, 1), c: '#0b93f6' } : { t: (chat.av || '梦'), c: chat.color || '#07c160' };
    el.innerHTML =
      `<div class="av" style="background:${av.c}">${esc(av.t)}</div>` +
      `<div class="bb">${esc(text)}</div>`;
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
  }

  const wxInput = $('#wxChatInput');
  wxInput.addEventListener('input', () => { $('#wxChatSend').disabled = !wxInput.value.trim(); });
  wxInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendWx(); }
  });
  $('#wxChatSend').addEventListener('click', sendWx);

  async function sendWx() {
    const text = wxInput.value.trim();
    if (!text || !wxCurrent) return;

    if (settings.blockedByThem) { alert('对方已拉黑你'); return; }
    wxInput.value = '';
    $('#wxChatSend').disabled = true;
    const body = $('#wxChatBody');
    appendWxMsg(body, 'me', text, wxCurrent);
    wxAutoReply(text);
  }

  /* ============================================================

  let currentSong = null;

  $('#playerPlay').addEventListener('click', () => {
    if (!currentSong) {
      currentSong = SONGS[0];
      $('#playerTitle').textContent = currentSong.t;
      $('#playerArtist').textContent = currentSong.a;
      playing = true;
    } else {
      playing = !playing;
    }
    $('#playerPlay').textContent = playing ? '⏸' : '▶';
    $('#netPlayer').classList.toggle('playing', playing);
  });

  /* ============================================================
     设置
     ============================================================ */
  function showSetMain() {
    $('#setMain').hidden = false;
    $('#setDetail').hidden = true;
    renderSetMain();
  }

  function renderSetMain() {
    const body = $('#setMainBody');
    body.replaceChildren();

    const groups = [
      { title:'数据', items:[
        { icon:'导', bg:'linear-gradient(135deg,#0b93f6,#5ac8fa)', name:'导出备份', act:() => exportBackup() },
        { icon:'入', bg:'linear-gradient(135deg,#34c759,#30d158)', name:'导入备份', act:() => importBackup() },
        { icon:'清', bg:'linear-gradient(135deg,#ff3b30,#ff6482)', name:'清空所有数据', act:() => clearAllData() },
      ]},
      { title:'系统', items:[
        { icon:'活', bg:'linear-gradient(135deg,#5856d6,#7a78ff)', name:'后台保活', value: settings.bgKeepAlive ? '已开启' : '已关闭', act:() => toggleKeepAlive() },
        { icon:'通', bg:'linear-gradient(135deg,#ff9500,#ffb340)', name:'通知', value: settings.notificationsEnabled ? '已开启' : '已关闭', act:() => requestNotificationPermission() },
        { icon:'屏', bg:'linear-gradient(135deg,#af52de,#c77dff)', name:'添加到主屏幕', value:'', act:() => showAddToHomeTip() },
      ]},
      { title:'关于', items:[
        { icon:'夜', bg:'linear-gradient(135deg,#1c1c1e,#3a3a3c)', name:'栖夜', value:'v1.0', act:() => alert('栖夜 · 只保存在这台设备上') },
      ]},
    ];

    for (const g of groups) {
      const t = document.createElement('p');
      t.className = 'set-title';
      t.textContent = g.title;
      body.appendChild(t);

      const group = document.createElement('div');
      group.className = 'set-group';
      for (const item of g.items) {
        const row = document.createElement('div');
        row.className = 'set-item';
        row.innerHTML =
          `<span class="si" style="background:${item.bg}">${item.icon}</span>` +
          `<span class="st">${esc(item.name)}</span>` +
          (item.value ? `<span class="sv">${esc(item.value)}</span>` : '') +
          `<span class="arrow">›</span>`;
        row.addEventListener('click', item.act);
        group.appendChild(row);
      }
      body.appendChild(group);
    }
  }

  async function toggleKeepAlive() {
    settings.bgKeepAlive = !settings.bgKeepAlive;
    await saveSettings();
    renderSetMain();
    alert(settings.bgKeepAlive ? '后台保活已开启（页面隐藏时仍会保持定时器运行）' : '后台保活已关闭');
  }

  function showAddToHomeTip() {
    alert(
      '添加到主屏幕方法：\n' +
      '1. 用 Safari 打开此页面\n' +
      '2. 点击分享按钮\n' +
      '3. 选择“添加到主屏幕”\n\n' +
      '添加后从主屏幕图标打开，即可接收通知（需在设置中开启通知）。'
    );
  }

  async function exportBackup() {
    const data = {
      exportedAt: new Date().toISOString(),
      settings,
      messages:  await pr(os('messages').getAll()),
      letters:   await pr(os('letters').getAll()),
      cards:     await pr(os('cards').getAll()),
      periods:   await pr(os('periods').getAll()),
      countdowns:await pr(os('countdowns').getAll()),
      wxFriends: await pr(os('wxFriends').getAll()),
      wxMessages:await pr(os('wxMessages').getAll()),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `qiyе-backup-${Date.now()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function importBackup() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!confirm('导入将覆盖当前所有数据，确定吗？')) return;

        settings = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };
        await saveSettings();

        const stores = ['messages','letters','cards','periods','countdowns','wxFriends','wxMessages'];
        for (const s of stores) {
          if (Array.isArray(data[s])) {
            const st = os(s, 'readwrite');
            await pr(st.clear());
            for (const item of data[s]) {
              const copy = { ...item };
              delete copy.id;
              await pr(st.add(copy));
            }
          }
        }

        alert('导入完成');
        location.reload();
      } catch (err) {
        alert('导入失败：' + err.message);
      }
    });
    input.click();
  }

  async function clearAllData() {
    if (!confirm('将删除所有消息、信件、字卡、记录与设置，且无法恢复。确定吗？')) return;
    if (!confirm('再次确认：这一步不可撤销。')) return;
    await Promise.all([
      pr(os('messages',  'readwrite').clear()),
      pr(os('letters',   'readwrite').clear()),
      pr(os('settings',  'readwrite').clear()),
      pr(os('cards',     'readwrite').clear()),
      pr(os('periods',   'readwrite').clear()),
      pr(os('countdowns','readwrite').clear()),
      pr(os('wxFriends', 'readwrite').clear()),
      pr(os('wxMessages','readwrite').clear()),
    ]);
    location.reload();
  }

  /* ============================================================
     信息菜单（拉黑）
     ============================================================ */
  $('#imsgMenuBtn').addEventListener('click', async () => {
    await showModal(`
      <h3>更多</h3>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn ${settings.blockedByMe ? 'danger' : ''}" id="btnBlockMe" type="button">
          ${settings.blockedByMe ? '取消拉黑对方' : '拉黑对方'}
        </button>
        <button class="btn ${settings.blockedByThem ? 'danger' : ''}" id="btnBlockThem" type="button">
          ${settings.blockedByThem ? '解除对方拉黑' : '模拟对方拉黑我'}
        </button>
      </div>
    `, null, '关闭', '');

    setTimeout(() => {
      const b1 = $('#btnBlockMe');
      const b2 = $('#btnBlockThem');
      if (b1) b1.addEventListener('click', async () => {
        settings.blockedByMe = !settings.blockedByMe;
        await saveSettings();
        modalMask.hidden = true;
        alert(settings.blockedByMe ? '已拉黑对方' : '已取消拉黑');
      });
      if (b2) b2.addEventListener('click', async () => {
        settings.blockedByThem = !settings.blockedByThem;
        await saveSettings();
        modalMask.hidden = true;
        alert(settings.blockedByThem ? '对方已拉黑你' : '对方已解除拉黑');
      });
    }, 0);
  });

  /* ============================================================
     字卡库
     ============================================================ */
  let cardColor = CARD_COLORS[0];

  function renderCardColors() {
    const wrap = $('#cardColors');
    wrap.replaceChildren();
    for (const c of CARD_COLORS) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'color-dot' + (cardColor === c ? ' active' : '');
      el.style.background = c;
      el.addEventListener('click', () => { cardColor = c; renderCardColors(); });
      wrap.appendChild(el);
    }
  }

  async function renderCards() {
    renderCardColors();
    const cards = await pr(os('cards').getAll());
    cards.reverse();
    const list = $('#cardList');
    list.replaceChildren();

    if (!cards.length) {
      const d = document.createElement('p');
      d.className = 'empty-hint';
      d.textContent = '还没有字卡，添加一张吧。对方会从这里挑选回复。';
      list.appendChild(d);
      return;
    }

    for (const c of cards) {
      const el = document.createElement('div');
      el.className = 'word-card';
      el.style.background = c.color;
      el.textContent = c.text;

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '×';
      del.addEventListener('click', async (e) => {
        e.stopPropagation();
        await pr(os('cards', 'readwrite').delete(c.id));
        renderCards();
      });
      el.appendChild(del);
      list.appendChild(el);
    }
  }

  $('#addCard').addEventListener('click', async () => {
    const text = $('#cardText').value.trim();
    if (!text) { alert('请填写文字内容'); return; }
    await pr(os('cards', 'readwrite').add({ text, color: cardColor, createdAt: Date.now() }));
    $('#cardText').value = '';
    renderCards();
  });

  /* ============================================================
     经期
     ============================================================ */
  async function renderPeriod() {
    const list = await pr(os('periods').getAll());
    list.sort((a, b) => b.start - a.start);

    const hero = $('#periodHero');
    const cycle = settings.periodCycle || 28;
    $('#pCycle').textContent = cycle;

    if (list.length) {
      const last = list[0].start;
      const next = last + cycle * 86400000;
      const days = Math.ceil((next - Date.now()) / 86400000);
      hero.querySelector('.big').textContent = days >= 0 ? `${days}` : `${Math.abs(days)}`;
      hero.querySelector('.sub').textContent = days >= 0
        ? `距离下次预测还有 ${days} 天`
        : `已推迟 ${Math.abs(days)} 天`;
      $('#pNext').textContent = days >= 0 ? `${days} 天` : `+${Math.abs(days)} 天`;
      $('#periodStart').value = fmtDate(last);
    } else {
      hero.querySelector('.big').textContent = '—';
      hero.querySelector('.sub').textContent = '还没有记录';
      $('#pNext').textContent = '—';
    }

    const hist = $('#periodHistory');
    hist.replaceChildren();
    if (!list.length) {
      const d = document.createElement('p');
      d.className = 'empty-hint';
      d.textContent = '还没有历史记录。';
      hist.appendChild(d);
      return;
    }
    for (const p of list) {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<span>${fmtDate(p.start)} 开始</span>`;
      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '删除';
      del.addEventListener('click', async () => {
        await pr(os('periods', 'readwrite').delete(p.id));
        renderPeriod();
      });
      item.appendChild(del);
      hist.appendChild(item);
    }
  }

  $('#addPeriod').addEventListener('click', async () => {
    const dateStr = $('#periodStart').value;
    const cycle = clampInt($('#periodCycle').value, 15, 60, 28);
    if (!dateStr) { alert('请选择开始日期'); return; }
    const start = new Date(dateStr + 'T00:00:00').getTime();
    if (!Number.isFinite(start)) { alert('日期格式不正确'); return; }
    settings.periodCycle = cycle;
    await saveSettings();
    await pr(os('periods', 'readwrite').add({ start, cycle, createdAt: Date.now() }));
    renderPeriod();
  });

  /* ============================================================
     倒数日
     ============================================================ */
  async function renderCountdown() {
    const items = await pr(os('countdowns').getAll());
    items.sort((a, b) => a.date - b.date);
    const list = $('#cdList');
    list.replaceChildren();

    if (!items.length) {
      const d = document.createElement('p');
      d.className = 'empty-hint';
      d.textContent = '还没有倒数日。';
      list.appendChild(d);
      return;
    }

    for (const it of items) {
      const days = Math.ceil((it.date - Date.now()) / 86400000);
      const el = document.createElement('div');
      el.className = 'cd-item';
      el.innerHTML =
        `<div class="cd-num"><b>${Math.abs(days)}</b><span>${days >= 0 ? '天后' : '天前'}</span></div>` +
        `<div class="cd-info"><div class="cd-name">${esc(it.name)}</div>` +
        `<div class="cd-date">${fmtDate(it.date)}</div></div>`;
      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '删除';
      del.addEventListener('click', async () => {
        await pr(os('countdowns', 'readwrite').delete(it.id));
        renderCountdown();
      });
      el.appendChild(del);
      list.appendChild(el);
    }
  }

  $('#addCd').addEventListener('click', async () => {
    const name = $('#cdName').value.trim();
    const dateStr = $('#cdDate').value;
    if (!name) { alert('请填写事件名称'); return; }
    if (!dateStr) { alert('请选择目标日期'); return; }
    const date = new Date(dateStr + 'T00:00:00').getTime();
    if (!Number.isFinite(date)) { alert('日期格式不正确'); return; }
    await pr(os('countdowns', 'readwrite').add({ name, date, createdAt: Date.now() }));
    $('#cdName').value = '';
    $('#cdDate').value = '';
    renderCountdown();
  });

  /* ============================================================
     信箱
     ============================================================ */
  async function renderLetters() {
    const letters = await pr(os('letters').getAll());
    letters.sort((a, b) => a.openAt - b.openAt);
    const listEl = $('#letterList');
    listEl.replaceChildren();

    if (!letters.length) {
      const d = document.createElement('p');
      d.className = 'empty-hint';
      d.textContent = '还没有信件。';
      listEl.appendChild(d);
      return;
    }

    const now = Date.now();
    for (const l of letters) {
      const el = document.createElement('div');
      el.className = 'rule';

      const title = document.createElement('div');
      title.style.cssText = 'font-weight:600;font-size:15px;margin-bottom:4px;color:#1c1c1e;';
      title.textContent = (l.opened ? '已拆 · ' : '未拆 · ') + (l.title || '无标题');

      const meta = document.createElement('div');
      meta.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:10px;';
      const openDate = new Date(l.openAt);
      if (l.opened) {
        meta.textContent = '已于 ' + fmtFull(openDate) + ' 拆开';
      } else if (l.openAt > now) {
        meta.textContent = '将于 ' + fmtFull(openDate) + ' 开启 · 还有 ' + countdown(l.openAt - now);
      } else {
        meta.textContent = '已到期，可以拆开了';
      }

      const parts = [title, meta];

      if (l.opened) {
        const body = document.createElement('div');
        body.style.cssText = 'font-size:13px;white-space:pre-wrap;margin-bottom:10px;padding:10px;background:#f7f7f8;border-radius:8px;line-height:1.7;color:#333;';
        body.textContent = l.content;
        parts.push(body);
      }

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';

      if (!l.opened && l.openAt <= now) {
        const openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.className = 'btn primary';
        openBtn.textContent = '拆开';
        openBtn.addEventListener('click', () => openLetter(l));
        actions.appendChild(openBtn);
      }

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn danger';
      delBtn.textContent = '删除';
      delBtn.addEventListener('click', async () => {
        if (!confirm('确定删除这封信？')) return;
        await pr(os('letters', 'readwrite').delete(l.id));
        renderLetters();
      });
      actions.appendChild(delBtn);

      parts.push(actions);
      el.append(...parts);
      listEl.appendChild(el);
    }
  }

  async function openLetter(l) {
    l.opened = true;
    await pr(os('letters', 'readwrite').put(l));
    const m = await addMessage({ role:'them', type:'letter', title: l.title, text: l.content, ts: Date.now() });

    stack.length = 0; stack.push('home', 'app-messages');
    showScreen('app-messages');
    appendMessageEl(m);
    scrollToBottom(true);
    renderLetters();
  }

  $('#addLetter').addEventListener('click', async () => {
    const title    = $('#letterTitle').value.trim();
    const content  = $('#letterContent').value.trim();
    const openAtStr = $('#letterOpenAt').value;

    if (!content) { alert('请填写信件内容'); return; }
    if (!openAtStr) { alert('请选择开启时间'); return; }

    const openAt = new Date(openAtStr).getTime();
    if (!Number.isFinite(openAt)) { alert('开启时间格式不正确'); return; }
    if (openAt <= Date.now()) { alert('开启时间需要晚于当前时间'); return; }

    await pr(os('letters', 'readwrite').add({
      title, content, openAt, createdAt: Date.now(), opened: false,
    }));

    $('#letterTitle').value = '';
    $('#letterContent').value = '';
    resetLetterTime();
    await renderLetters();
    alert('信件已封存');
  });

  function resetLetterTime() {
    const t = new Date(Date.now() + 86400000);
    const local = new Date(t.getTime() - t.getTimezoneOffset() * 60000);
    $('#letterOpenAt').value = local.toISOString().slice(0, 16);
  }

  /* ============================================================
     启动
     ============================================================ */
  async function seedWelcomeMessage() {
    const count = await pr(os('messages').count());
    if (count > 0) return;
    await addMessage({ role:'them', type:'text', text:'晚上好呀，栖夜。', ts: Date.now() });
  }

  function updateClock() {
    const d = new Date();
    const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const el = $('#sbTime');
    if (el) el.textContent = t;
  }

  async function boot() {
    try {
      db = await openDB();
    } catch (err) {
      document.body.innerHTML =
        '<p style="padding:40px;color:#111;font-size:15px;line-height:1.8;">' +
        '无法初始化本地数据库：' + esc(err) + '<br>' +
        '请确认没有在无痕模式 / 禁用存储的环境下打开。</p>';
      return;
    }

    await loadSettings();
    applyPeer();
    applyAccent();

    await seedWelcomeMessage();

    renderHome();
    resetLetterTime();
    await initChat();

    updateClock();
    setInterval(updateClock, 30000);

    setInterval(() => {
      if (!$('#app-mailbox').hidden) renderLetters();
    }, 30000);

    /* 后台保活：页面隐藏时仍保持定时器 */
    if (settings.bgKeepAlive) {
      document.addEventListener('visibilitychange', () => {});
    }
  }

  boot();

})();
</script>
</body>
</html>
