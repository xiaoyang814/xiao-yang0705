<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#ffffff" />
<title>聊天</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f4f4f6;
    --line: #ececef;
    --text: #1c1c1e;
    --text-2: #8e8e93;
    --accent: #1c1c1e;
    --bubble-me: #1c1c1e;
    --bubble-them: #f1f1f4;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  button {
    font: inherit;
    color: inherit;
  }

  /* ============ 根容器：铺满可视区域 ============ */
  #app {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
  }

  .view {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg);
  }

  #main-view { z-index: 1; }

  #chat-view {
    z-index: 2;
    transform: translateX(100%);
    transition: transform .3s cubic-bezier(.32, .72, 0, 1);
    box-shadow: -10px 0 30px rgba(0, 0, 0, .07);
  }

  #chat-view.open { transform: translateX(0); }

  /* ============ 顶部栏 ============ */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(var(--safe-top) + 10px) 14px 10px;
    background: rgba(255, 255, 255, .94);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    position: relative;
    z-index: 5;
  }

  .topbar .title {
    flex: 1;
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: .2px;
  }

  .icon-btn {
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    color: var(--text);
    cursor: pointer;
    transition: background .15s ease;
  }

  .icon-btn:active { background: var(--bg-soft); }
  .icon-btn svg { width: 22px; height: 22px; }

  /* ============ 页面容器 ============ */
  .pages {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }

  .page {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 16px;
    display: none;
  }

  .page.active { display: block; }

  /* ============ 搜索框 ============ */
  .search-wrap { padding: 10px 16px 8px; }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-soft);
    border-radius: 11px;
    padding: 8px 11px;
    color: var(--text-2);
  }

  .search svg { width: 17px; height: 17px; flex: 0 0 auto; }

  .search input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: none;
    outline: none;
    font: inherit;
    font-size: 15px;
    color: var(--text);
  }

  .search input::placeholder { color: var(--text-2); }

  /* ============ 会话列表 ============ */
  .chat-item {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: 0;
    background: none;
    text-align: left;
    cursor: pointer;
    transition: background .15s ease;
  }

  .chat-item:active { background: var(--bg-soft); }

  .chat-item + .chat-item::before {
    content: "";
    position: absolute;
    left: 74px;
    right: 0;
    top: 0;
    height: 1px;
    background: var(--line);
  }

  .avatar {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 17px;
    font-weight: 500;
    background: #c7c7cc;
    user-select: none;
  }

  .avatar.sm { width: 30px; height: 30px; font-size: 13px; }
  .avatar.lg { width: 64px; height: 64px; font-size: 24px; }

  .chat-main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .chat-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .chat-name {
    flex: 1;
    min-width: 0;
    font-size: 15.5px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chat-time {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--text-2);
  }

  .chat-preview {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    color: var(--text-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .badge {
    flex: 0 0 auto;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .empty {
    padding: 60px 24px;
    text-align: center;
    color: var(--text-2);
    font-size: 14px;
  }

  /* ============ 通讯录 / 我 ============ */
  .section-title {
    padding: 18px 16px 8px;
    font-size: 12.5px;
    color: var(--text-2);
    letter-spacing: .5px;
  }

  .contact-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
  }

  .contact-item + .contact-item::before {
    content: "";
    position: absolute;
    left: 74px;
    right: 0;
    top: 0;
    height: 1px;
    background: var(--line);
  }

  .contact-name { font-size: 15.5px; }
  .contact-sub { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }

  .profile {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px 16px 20px;
    border-bottom: 1px solid var(--line);
  }

  .profile-name { font-size: 19px; font-weight: 600; }
  .profile-sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }

  .row {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 0;
    background: none;
    text-align: left;
    cursor: pointer;
    font-size: 15.5px;
  }

  .row:active { background: var(--bg-soft); }

  .row + .row::before {
    content: "";
    position: absolute;
    left: 50px;
    right: 0;
    top: 0;
    height: 1px;
    background: var(--line);
  }

  .row svg.lead { width: 20px; height: 20px; color: var(--text); flex: 0 0 auto; }
  .row .row-text { flex: 1; }
  .row svg.chev { width: 18px; height: 18px; color: #c7c7cc; flex: 0 0 auto; }

  /* ============ 底部导航（始终位于可视区域底部） ============ */
  .tabbar {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    background: rgba(255, 255, 255, .96);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding-bottom: var(--safe-bottom);
    z-index: 6;
  }

  .tab {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 0 7px;
    border: 0;
    background: none;
    color: var(--text-2);
    font-size: 11px;
    letter-spacing: .3px;
    cursor: pointer;
    transition: color .18s ease;
  }

  .tab svg { width: 23px; height: 23px; }

  .tab.active { color: var(--text); }
  .tab.active .dot { opacity: 1; }

  .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: opacity .18s ease;
  }

  /* ============ 聊天详情 ============ */
  .chat-head .chat-title {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .chat-head .name {
    font-size: 16px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chat-head .sub {
    font-size: 12px;
    color: var(--text-2);
  }

  .messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 14px 18px;
    background: var(--bg);
  }

  .time-divider {
    align-self: center;
    font-size: 11.5px;
    color: var(--text-2);
    padding: 2px 0;
    margin: 2px 0;
  }

  .msg {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 100%;
    animation: pop .18s ease-out;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.me { justify-content: flex-end; }

  .bubble {
    max-width: 74%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.45;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .msg.them .bubble {
    background: var(--bubble-them);
    border-bottom-left-radius: 5px;
  }

  .msg.me .bubble {
    background: var(--bubble-me);
    color: #fff;
    border-bottom-right-radius: 5px;
  }

  .composer {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 8px 12px calc(var(--safe-bottom) + 8px);
    border-top: 1px solid var(--line);
    background: #fff;
  }

  .composer textarea {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 38px;
    max-height: 120px;
    padding: 9px 13px;
    border: 0;
    border-radius: 19px;
    background: var(--bg-soft);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    line-height: 1.4;
    resize: none;
    outline: none;
    overflow-y: auto;
  }

  .composer textarea::placeholder { color: var(--text-2); }

  .send-btn {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
  }

  .send-btn:active { transform: scale(.92); }
  .send-btn svg { width: 19px; height: 19px; }
</style>
</head>
<body>

<div id="app">

  <!-- ================= 主界面 ================= -->
  <div class="view" id="main-view">

    <header class="topbar">
      <h1 class="title" id="page-title">消息</h1>
      <button class="icon-btn" id="btn-new" aria-label="新建会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </header>

    <div class="pages">

      <!-- 消息页 -->
      <section class="page active" data-page="chats">
        <div class="search-wrap">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="6.5"/>
              <path d="M20.5 20.5 16 16"/>
            </svg>
            <input type="text" id="search" placeholder="搜索" autocomplete="off" />
          </label>
        </div>
        <div id="chat-list"></div>
      </section>

      <!-- 通讯录页 -->
      <section class="page" data-page="contacts">
        <div class="section-title">联系人</div>
        <div id="contact-list"></div>
      </section>

      <!-- 我的页面 -->
      <section class="page" data-page="me">
        <div class="profile">
          <div class="avatar lg" style="background:#1c1c1e">林</div>
          <div>
            <div class="profile-name">林一</div>
            <div class="profile-sub">linyi@example.com</div>
          </div>
        </div>

        <div class="section-title">通用</div>

        <button class="row" type="button">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3"/>
          </svg>
          <span class="row-text">设置</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button class="row" type="button">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
          <span class="row-text">通知</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button class="row" type="button">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 16v-4M12 8h.01"/>
          </svg>
          <span class="row-text">关于</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </section>

    </div>

    <!-- 底部导航 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-page="chats" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 11.5a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1.4-4.6A8.5 8.5 0 1 1 20.5 11.5z"/>
        </svg>
        <span>消息</span>
        <i class="dot"></i>
      </button>

      <button class="tab" data-page="contacts" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3.5"/>
          <path d="M2.5 20a6.5 6.5 0 0 1 13 0"/>
          <path d="M16.5 5.2a3.5 3.5 0 0 1 0 5.6"/>
          <path d="M18 14.4a6.5 6.5 0 0 1 3.5 5.6"/>
        </svg>
        <span>通讯录</span>
        <i class="dot"></i>
      </button>

      <button class="tab" data-page="me" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.8"/>
          <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>
        </svg>
        <span>我</span>
        <i class="dot"></i>
      </button>
    </nav>

  </div>

  <!-- ================= 聊天详情 ================= -->
  <div class="view" id="chat-view">

    <header class="topbar chat-head">
      <button class="icon-btn" id="btn-back" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 5.5 8 12l6.5 6.5"/>
        </svg>
      </button>
      <div class="chat-title">
        <div class="name" id="chat-name">对话</div>
        <div class="sub">在线</div>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <form class="composer" id="composer">
      <textarea id="msg-input" rows="1" placeholder="输入消息..." autocomplete="off"></textarea>
      <button class="send-btn" type="submit" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 3 10.5 13.5"/>
          <path d="M21 3l-6.5 18-4-7.5-7.5-4L21 3z"/>
        </svg>
      </button>
    </form>

  </div>

</div>

  /* ---------------- 工具 ---------------- */
  const $ = function (sel) { return document.querySelector(sel); };
  const $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

  }

  function nowTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function toMinutes(t) {
    const parts = String(t).split(':');
    return (Number(parts[0]) || 0) * 60 + (Number(parts[1]) || 0);
  }

  function lastMessage(chat) {
    return chat.messages[chat.messages.length - 1] || null;
  }

  /* ---------------- 渲染：会话列表 ---------------- */
  function renderChatList() {
    const keyword = ($('#search').value || '').trim().toLowerCase();
    const listEl = $('#chat-list');

    const filtered = chats.filter(function (c) {
      if (!keyword) return true;
      const last = lastMessage(c);
      return c.name.toLowerCase().indexOf(keyword) > -1 ||
        (last && last.text.toLowerCase().indexOf(keyword) > -1);
    });

    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty">没有找到相关会话</div>';
      return;
    }

    listEl.innerHTML = filtered.map(function (c) {
      const last = lastMessage(c);
      const preview = last ? last.text : '';
      const unread = c.unread
        ? '<span class="badge">' + (c.unread > 99 ? '99+' : c.unread) + '</span>'
        : '';
      return '' +
        '<button class="chat-item" type="button" data-id="' + c.id + '">' +
          '<div class="avatar" style="background:' + c.color + '">' + escapeHTML(c.initial) + '</div>' +
          '<div class="chat-main">' +
            '<div class="chat-row">' +
              '<span class="chat-name">' + escapeHTML(c.name) + '</span>' +
              '<span class="chat-time">' + escapeHTML(c.time) + '</span>' +
            '</div>' +
            '<div class="chat-row">' +
              '<span class="chat-preview">' + escapeHTML(preview) + '</span>' +
              unread +
            '</div>' +
          '</div>' +
        '</button>';
    }).join('');
  }

  /* ---------------- 渲染：联系人 ---------------- */
  function renderContacts() {
    $('#contact-list').innerHTML = contacts.map(function (p) {
      return '' +
        '<div class="contact-item">' +
          '<div class="avatar" style="background:' + p.color + '">' + escapeHTML(p.initial) + '</div>' +
          '<div>' +
            '<div class="contact-name">' + escapeHTML(p.name) + '</div>' +
            '<div class="contact-sub">' + escapeHTML(p.sub) + '</div>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  /* ---------------- 渲染：消息 ---------------- */
  function renderMessages() {
    const chat = state.activeChat;
    if (!chat) return;

    const box = $('#messages');
    let html = '';
    let prevTime = null;

    chat.messages.forEach(function (m) {
      if (prevTime === null || toMinutes(m.time) - toMinutes(prevTime) >= 5 ||
          toMinutes(m.time) - toMinutes(prevTime) < 0) {
        html += '<div class="time-divider">' + escapeHTML(m.time) + '</div>';
      }
      prevTime = m.time;

      if (m.from === 'me') {
        html += '<div class="msg me"><div class="bubble">' + escapeHTML(m.text) + '</div></div>';
      } else {
        html += '<div class="msg them">' +
          '<div class="avatar sm" style="background:' + chat.color + '">' + escapeHTML(chat.initial) + '</div>' +
          '<div class="bubble">' + escapeHTML(m.text) + '</div>' +
        '</div>';
      }
    });

    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
  }

  /* ---------------- 打开 / 关闭聊天 ---------------- */
  function openChat(id) {
    const chat = chats.filter(function (c) { return c.id === id; })[0];
    if (!chat) return;

    state.activeChat = chat;
    chat.unread = 0;
    renderChatList();

    $('#chat-name').textContent = chat.name;
    renderMessages();

    const view = $('#chat-view');
    view.classList.add('open');
    chatOpen = true;

    try { history.pushState({ chat: id }, ''); } catch (e) { /* 忽略 */ }
  }

  function closeChat() {
    if (!chatOpen) return;
    chatOpen = false;
    $('#chat-view').classList.remove('open');
    state.activeChat = null;
  }

  /* ---------------- 发送消息 ---------------- */
  function autoGrow() {
    const el = $('#msg-input');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function sendMessage() {
    const input = $('#msg-input');
    const text = input.value.trim();
    const chat = state.activeChat;
    if (!text || !chat) return;

    const time = nowTime();
    chat.messages.push({ from: 'me', text: text, time: time });
    chat.time = time;

    input.value = '';
    autoGrow();

    renderMessages();
    renderChatList();

    // 模拟对方回复
    clearTimeout(chat._timer);
    chat._timer = setTimeout(function () {
      const reply = REPLIES[Math.floor(Math.random() * REPLIES.length)];
      const replyTime = nowTime();
      chat.messages.push({ from: 'them', text: reply, time: replyTime });
      chat.time = replyTime;

      if (state.activeChat === chat) {
        renderMessages();
      } else {
        chat.unread = (chat.unread || 0) + 1;
      }
      renderChatList();
    }, 900 + Math.random() * 800);
  }

  /* ---------------- 切换页面 ---------------- */
  const TITLES = { chats: '消息', contacts: '通讯录', me: '我' };

  function switchPage(name) {
    $$('.page').forEach(function (p) {
      p.classList.toggle('active', p.dataset.page === name);
    });
    $$('.tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.page === name);
    });
    $('#page-title').textContent = TITLES[name] || '';
  }

  /* ---------------- 事件绑定 ---------------- */
  function bindEvents() {
    // 会话点击
    $('#chat-list').addEventListener('click', function (e) {
      const item = e.target.closest('.chat-item');
      if (item) openChat(item.dataset.id);
    });

    // 搜索
    $('#search').addEventListener('input', renderChatList);

    // 底部导航
    $('#tabbar').addEventListener('click', function (e) {
      const tab = e.target.closest('.tab');
      if (tab) switchPage(tab.dataset.page);
    });

    // 返回
    $('#btn-back').addEventListener('click', function () {
      if (history.state && history.state.chat) {
        history.back();
      } else {
        closeChat();
      }
    });

    // 浏览器返回
    window.addEventListener('popstate', function () {
      if (chatOpen) closeChat();
    });

    // 发送
    $('#composer').addEventListener('submit', function (e) {
      e.preventDefault();
      sendMessage();
    });

    const input = $('#msg-input');

    input.addEventListener('input', autoGrow);

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 新建会话按钮
    $('#btn-new').addEventListener('click', function () {
      switchPage('chats');
      $('#search').focus();
    });

    // 输入框聚焦时滚动到底部
    input.addEventListener('focus', function () {
      setTimeout(function () {
        const box = $('#messages');
        box.scrollTop = box.scrollHeight;
      }, 260);
    });
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    renderChatList();
    renderContacts();
    bindEvents();
    autoGrow();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
