<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>栖夜</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#fff;font-family:-apple-system,sans-serif;font-size:15px;color:#999;z-index:1}
</style>
</head>
<body>
<div id="loading">加载中…</div>
<iframe id="app" allow="clipboard-write; autoplay"></iframe>
<script>
(function(){
  var f=document.getElementById('app');
  var l=document.getElementById('loading');
  /* 加时间戳，绕过所有缓存，永远拉最新 */
  f.src='app.html?t='+Date.now();
  f.onload=function(){ l.style.display='none'; };
  /* 兜底：8 秒后还没加载完，也把 loading 藏掉 */
  setTimeout(function(){ l.style.display='none'; },8000);
})();
</script>
</body>
</html>
