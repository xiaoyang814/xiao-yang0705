<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>栖夜</title>
<style>
*,*::before,*::after{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#ffffff;--bg-2:#f7f7f8;--bg-3:#eeeef1;
  --fg:#1c1c1e;--muted:#8e8e93;--line:#e4e4e7;
  --accent:#0b93f6;--accent-hover:#0a7fd4;--wechat:#07c160;
  --danger:#ff3b30;
}
html,body{height:100%;}
body{margin:0;background:#000;color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;overflow:hidden;-webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;}
input,textarea,select{font:inherit;color:inherit;}
img{max-width:100%;display:block;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
.screen[hidden]{display:none;}
.screen-body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
.screen-body[hidden]{display:none;}

.statusbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 6px) 22px 6px;font-size:14px;font-weight:600;color:#fff;}
.sb-right{letter-spacing:2px;font-size:12px;}

/* 桌面 */
#home{background-color:#000;background-size:cover;background-position:center;transition:background .3s;}
.home-body{flex:1 1 auto;overflow-y:auto;padding:10px 22px 0;}

/* 桌面小组件 */
.widget{
  background:#1c1c1e;border-radius:20px;padding:0;margin-bottom:24px;color:#fff;
  position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.widget .w-bg{width:100%;height:160px;background:#333;position:relative;}
.widget .w-bg img{width:100%;height:100%;object-fit:cover;opacity:.8;}
.widget .w-avatar{
  position:absolute;top:100px;left:50%;transform:translateX(-50%);
  width:76px;height:76px;border-radius:50%;border:4px solid #1c1c1e;
  background:#555;overflow:hidden;z-index:2;
}
.widget .w-avatar img{width:100%;height:100%;object-fit:cover;}
.widget .w-content{padding:48px 16px 20px;text-align:center;}
.widget .w-name{font-size:18px;font-weight:700;margin-bottom:4px;letter-spacing:.5px;}
.widget .w-sign{font-size:12px;color:#aaa;margin-bottom:8px;font-style:italic;}
.widget .w-loc{font-size:11px;color:#888;}

.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px;}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;}
.app-icon .ico{
  width:60px;height:60px;border-radius:16px;display:grid;place-items:center;
  background:#1c1c1e;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .12s;
}
.app-icon .ico svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.app-icon:active .ico{transform:scale(.9);}
.app-icon .lbl{font-size:12px;color:#fff;font-weight:500;white-space:nowrap;}

.dock{
  flex:0 0 auto;margin:14px 16px calc(16px + env(safe-area-inset-bottom));padding:12px;
  background:rgba(30,30,30,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:26px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.dock .app-icon .lbl{display:none;}

.back{width:34px;height:34px;font-size:24px;color:var(--accent);display:grid;place-items:center;flex:0 0 auto;line-height:1;}

/* ====== 信息/微信通用消息区 ====== */
.imsg-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 12px 8px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;z-index:10;}
.imsg-peer{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;}
.imsg-avatar{width:28px;height:28px;border-radius:50%;background:#1c1c1e;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;overflow:hidden;}
.imsg-avatar img{width:100%;height:100%;object-fit:cover;}
.imsg-name{font-size:11.5px;font-weight:600;}
.imsg-top .icon-btn{margin-left:auto;font-size:16px;color:var(--accent);width:34px;height:34px;display:grid;place-items:center;font-weight:600;}

.imsg-messages,.wx-chat-body{flex:1 1 auto;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:5px;
  background-size:cover;background-position:center;-webkit-overflow-scrolling:touch;}

.msg{display:flex;flex-direction:column;max-width:min(76%,600px);animation:pop .18s ease-out;}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.msg.me{align-self:flex-end;align-items:flex-end;}
.msg.them{align-self:flex-start;align-items:flex-start;}

.msg .bubble{padding:9px 14px;border-radius:18px;line-height:1.4;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-size:15px;}
.msg.me .bubble{background:#0b93f6;color:#fff;border-bottom-right-radius:5px;}
.msg.them .bubble{background:#e9e9eb;color:#1c1c1e;border-bottom-left-radius:5px;}
.msg .sys-bubble{background:rgba(0,0,0,.1);color:#666;font-size:12px;padding:6px 12px;border-radius:14px;text-align:center;}
.msg .img-bubble{padding:4px;background:#e9e9eb;border-radius:14px;overflow:hidden;max-width:220px;}
.msg.me .img-bubble{background:#0b93f6;}
.msg .img-bubble img{border-radius:12px;max-height:280px;object-fit:cover;}
.msg time{margin-top:2px;padding:0 4px;font-size:10.5px;color:#c7c7cc;user-select:none;}

.typing{display:flex;gap:4px;padding:12px 14px;background:#e9e9eb;border-radius:18px;border-bottom-left-radius:5px;width:fit-content;align-self:flex-start;}
.typing span{width:7px;height:7px;border-radius:50%;background:#a1a1a6;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}

.imsg-composer,.wx-composer{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-bottom:calc(6px + env(safe-area-inset-bottom));}
.imsg-form{display:flex;align-items:flex-end;gap:8px;padding:8px 12px;}
.imsg-plus{width:32px;height:32px;border-radius:50%;border:1.5px solid #c7c7cc;color:#8e8e93;font-size:20px;display:grid;place-items:center;flex:0 0 auto;line-height:1;}
#input,.wx-composer textarea{flex:1 1 auto;max-height:130px;min-height:36px;padding:8px 14px;border:1px solid var(--line);border-radius:18px;background:#fff;outline:none;resize:none;line-height:1.4;}
#input:focus,.wx-composer textarea:focus{border-color:#0b93f6;}
#sendBtn{width:32px;height:32px;border-radius:50%;background:#0b93f6;color:#fff;font-size:17px;display:grid;place-items:center;flex:0 0 auto;}
#sendBtn:disabled{opacity:.3;cursor:not-allowed;}
.wx-send{background:#07c160;color:#fff;border-radius:5px;padding:8px 16px;font-size:14px;flex:0 0 auto;}
.wx-send:disabled{opacity:.4;}

.func-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px;border-bottom:1px solid var(--line);background:#fafafa;}
.func-panel[hidden]{display:none;}
.func-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:12px;color:#333;}
.func-btn svg{width:24px;height:24px;stroke:#1c1c1e;fill:none;stroke-width:1.8;}

/* ====== 微信 ====== */
.wx-top{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:#EDEDED;border-bottom:1px solid #d9d9d9;position:relative;z-index:10;}
.wx-title{font-size:17px;font-weight:600;}
.wx-top .back{position:absolute;left:6px;color:#333;}
.wx-body{flex:1 1 auto;overflow-y:auto;background:#EDEDED;-webkit-overflow-scrolling:touch;}
.wx-tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:#F7F7F7;border-top:1px solid #d9d9d9;padding-bottom:calc(4px + env(safe-area-inset-bottom));}
.wx-tabbar button{padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#7a7a7a;}
.wx-tabbar button.active{color:#07c160;}
.wx-tabbar .ti svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;}
.wx-chat-item{display:flex;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid #f0f0f0;align-items:center;cursor:pointer;}
.wx-chat-item:active{background:#f2f2f2;}
.wx-avatar{width:46px;height:46px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:600;flex:0 0 auto;overflow:hidden;background:#1c1c1e;}
.wx-avatar img{width:100%;height:100%;object-fit:cover;}
.wx-info{flex:1 1 auto;min-width:0;}
.wx-name{font-size:16px;font-weight:500;color:#1a1a1a;}
.wx-preview{font-size:13px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.wx-meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:#b2b2b2;flex:0 0 auto;}
.wx-cell{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #f0f0f0;font-size:16px;cursor:pointer;}
.wx-cell:active{background:#f2f2f2;}
.wx-cell .ci{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:#1c1c1e;color:#fff;flex:0 0 auto;}
.wx-cell .ci svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;}
.wx-cell .arrow{margin-left:auto;color:#c8c8cd;font-size:16px;}

.wx-msg{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;animation:pop .18s ease-out;}
.wx-msg.me{flex-direction:row-reverse;}
.wx-msg .av{width:36px;height:36px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:0 0 auto;overflow:hidden;background:#1c1c1e;}
.wx-msg .av img{width:100%;height:100%;object-fit:cover;}
.wx-msg .bb{max-width:66%;padding:9px 12px;border-radius:6px;background:#fff;font-size:15px;line-height:1.45;word-break:break-word;}
.wx-msg.me .bb{background:#95EC69;color:#111;}
.wx-msg .bb img{border-radius:4px;max-height:220px;object-fit:cover;}
.wx-msg.sys{justify-content:center;}
.wx-msg.sys .bb{background:rgba(0,0,0,.1);color:#666;font-size:12px;text-align:center;padding:6px 12px;max-width:90%;}

/* 朋友圈 */
.moments-body{flex:1 1 auto;overflow-y:auto;background:#fff;}
.moments-head{height:220px;background:#1c1c1e;position:relative;background-size:cover;background-position:center;}
.moments-head .mc-av{position:absolute;right:16px;bottom:-24px;width:60px;height:60px;border-radius:8px;
  background:#fff;display:grid;place-items:center;color:#1c1c1e;font-size:20px;font-weight:600;
  border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);overflow:hidden;}
.moments-head .mc-av img{width:100%;height:100%;object-fit:cover;}
.moment{display:flex;gap:10px;padding:16px;border-bottom:1px solid #f2f2f2;}
.moment .av{width:42px;height:42px;border-radius:5px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;overflow:hidden;background:#1c1c1e;}
.moment .av img{width:100%;height:100%;object-fit:cover;}
.moment .ct{flex:1 1 auto;min-width:0;}
.moment .nm{color:#576b95;font-size:15px;font-weight:500;margin-bottom:4px;}
.moment .tx{font-size:15px;line-height:1.5;margin-bottom:8px;word-break:break-word;color:#1a1a1a;white-space:pre-wrap;}
.moment .imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;max-width:280px;}
.moment .imgs img{aspect-ratio:1;border-radius:3px;object-fit:cover;width:100%;}
.moment .imgs div{aspect-ratio:1;border-radius:3px;background:#eee;}
.moment .ft{display:flex;justify-content:space-between;font-size:12px;color:#b2b2b2;}
.moment .acts{display:flex;gap:14px;color:#576b95;font-size:13px;margin-top:2px;}
.moment .acts button{color:#576b95;font-size:13px;}
.moment .likes{background:#f7f7f7;border-radius:4px;padding:6px 8px;font-size:13px;color:#576b95;margin-top:6px;line-height:1.6;}
.moment .comments{margin-top:4px;}
.moment .cmt{background:#f7f7f7;border-radius:4px;padding:6px 8px;font-size:13px;line-height:1.6;margin-bottom:2px;}
.moment .cmt b{color:#576b95;font-weight:500;margin-right:4px;}

/* ====== 音乐/通用 ====== */
.net-top{flex:0 0 auto;background:#1c1c1e;color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;display:flex;align-items:center;gap:10px;}
.net-top .back{color:#fff;}
.net-top h1{font-size:17px;margin:0;font-weight:600;}
.net-body{flex:1 1 auto;overflow-y:auto;background:#fff;-webkit-overflow-scrolling:touch;}
.net-banner{margin:16px 16px 4px;height:120px;border-radius:10px;background:#1c1c1e;display:flex;align-items:center;padding:0 20px;color:#fff;}
.net-banner b{font-size:20px;display:block;}
.net-banner span{font-size:13px;color:#aaa;}
.net-section{padding:16px;}
.net-section h3{margin:0 0 12px;font-size:16px;color:#111;}
.song{display:flex;gap:12px;padding:8px 0;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer;}
.song:active{background:#fafafa;}
.song .num{width:22px;text-align:center;color:#999;font-size:13px;flex:0 0 auto;}
.song .thumb{width:44px;height:44px;border-radius:4px;background:#1c1c1e;flex:0 0 auto;}
.song .info{flex:1 1 auto;min-width:0;}
.song .ttl{font-size:15px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song .art{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.song.playing .ttl{color:#e60026;}
.net-player{flex:0 0 auto;background:#f7f7f7;border-top:1px solid #eee;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.net-player .pthumb{width:40px;height:40px;border-radius:50%;background:#1c1c1e;flex:0 0 auto;}
.net-player.playing .pthumb{animation:spin 8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.net-player .pinfo{flex:1 1 auto;min-width:0;}
.net-player .pt{font-size:14px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.net-player .pa{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.net-player .pbtn{width:36px;height:36px;border-radius:50%;background:#1c1c1e;color:#fff;display:grid;place-items:center;font-size:16px;flex:0 0 auto;}

/* ====== 设置/美化 ====== */
.set-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#f7f7f8;border-bottom:1px solid var(--line);}
.set-top h1{font-size:17px;margin:0;font-weight:600;}
.set-body{flex:1 1 auto;overflow-y:auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom));background:#f7f7f8;-webkit-overflow-scrolling:touch;}
.set-group{background:#fff;border-radius:12px;margin-bottom:18px;overflow:hidden;}
.set-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f2f2f4;cursor:pointer;min-height:50px;}
.set-item:last-child{border-bottom:none;}
.set-item:active{background:#f5f5f7;}
.set-item .si{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#1c1c1e;flex:0 0 auto;}
.set-item .si svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;}
.set-item .st{flex:1 1 auto;font-size:16px;color:#1c1c1e;}
.set-item .sv{color:#8e8e93;font-size:15px;max-width:52%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.set-item .arrow{color:#c8c8cd;font-size:17px;margin-left:2px;}
.set-title{font-size:13px;color:#8e8e93;margin:0 4px 8px;}

.btn{padding:9px 16px;border-radius:10px;background:#eeeef1;font-size:14px;color:#1c1c1e;text-align:center;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.block{width:100%;display:block;}
.input-box{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff;font-size:15px;margin-bottom:10px;}
.input-box:focus{border-color:var(--accent);}
.form-panel{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.form-panel label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px;}

/* ====== 字卡库 ====== */
.card-tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-bottom:1px solid var(--line);}
.card-tabs button{padding:12px 0;font-size:14px;color:#666;border-bottom:2px solid transparent;font-weight:500;}
.card-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
.card-tools{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);}
.card-tools input[type=search]{flex:1 1 auto;padding:7px 12px;border:1px solid var(--line);border-radius:18px;outline:none;background:#f7f7f8;font-size:14px;min-width:0;}
.card-tools .ctool{padding:7px 12px;border-radius:18px;background:#f2f2f4;font-size:13px;color:#333;white-space:nowrap;flex:0 0 auto;}
.card-tools .ctool.active{background:var(--accent);color:#fff;}
.card-list-wrap{flex:1 1 auto;overflow-y:auto;background:#f7f7f8;-webkit-overflow-scrolling:touch;padding:12px;}
.card-list-wrap .group-title{font-size:12px;color:var(--muted);margin:12px 4px 8px;}
.word-card{border-radius:12px;padding:14px;color:#fff;font-size:15px;line-height:1.6;margin-bottom:8px;white-space:pre-wrap;word-break:break-word;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.word-card .del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.2);color:#fff;font-size:13px;display:grid;place-items:center;}
.card-item-wrap{position:relative;display:flex;align-items:stretch;gap:8px;margin-bottom:8px;}
.card-item-wrap .cb{flex:0 0 24px;display:flex;align-items:center;justify-content:center;}
.card-item-wrap .cb input{width:18px;height:18px;}
.card-item-wrap .body{flex:1 1 auto;min-width:0;}
.card-item-wrap.sel .word-card,.card-item-wrap.sel .sticker-card{outline:3px solid var(--accent);}
.sticker-card{background:#fff;border-radius:12px;padding:8px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 6px rgba(0,0,0,.06);position:relative;}
.sticker-card img{width:60px;height:60px;object-fit:contain;border-radius:8px;background:#f7f7f8;flex:0 0 auto;}
.sticker-card .name{flex:1 1 auto;font-size:13px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sticker-card .del{width:24px;height:24px;border-radius:50%;background:#f2f2f4;color:#999;font-size:14px;flex:0 0 auto;}

/* ====== 通话 ====== */
.call-screen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;background:#1c1c1e;color:#fff;align-items:center;padding-top:calc(env(safe-area-inset-top) + 80px);}
.call-screen[hidden]{display:none;}
.call-avatar{width:110px;height:110px;border-radius:50%;background:#333;display:grid;place-items:center;font-size:40px;font-weight:600;margin-bottom:20px;overflow:hidden;}
.call-avatar img{width:100%;height:100%;object-fit:cover;}
.call-name{font-size:24px;font-weight:600;margin-bottom:8px;}
.call-status{font-size:15px;color:#aaa;margin-bottom:auto;}
.call-actions{display:flex;gap:50px;padding-bottom:calc(env(safe-area-inset-bottom) + 60px);}
.call-btn{width:70px;height:70px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:4px;}
.call-btn.hangup{background:#ff3b30;color:#fff;}
.call-btn.answer{background:#34c759;color:#fff;}
.call-btn.mute{background:rgba(255,255,255,.15);color:#fff;}
.call-btn.min{background:rgba(255,255,255,.15);color:#fff;}
.call-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;}

.call-float{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:1001;background:#1c1c1e;color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;min-width:160px;}
.call-float[hidden]{display:none;}
.call-float .cf-av{width:34px;height:34px;border-radius:50%;background:#333;display:grid;place-items:center;font-size:13px;font-weight:600;flex:0 0 auto;overflow:hidden;}
.call-float .cf-av img{width:100%;height:100%;object-fit:cover;}
.call-float .cf-info{flex:1 1 auto;min-width:0;}
.call-float .cf-info > div:first-child{font-size:13px;font-weight:600;}
.call-float .cf-info > div:last-child{font-size:11px;color:#aaa;margin-top:2px;}
.call-float .cf-hangup{width:28px;height:28px;border-radius:50%;background:#ff3b30;color:#fff;display:grid;place-items:center;font-size:11px;flex:0 0 auto;}

/* ====== 弹窗 ====== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-mask[hidden]{display:none;}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:360px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);max-height:85vh;overflow-y:auto;}
.modal-box h3{margin:0 0 14px;font-size:16px;text-align:center;font-weight:600;}
.modal-actions{display:flex;gap:10px;margin-top:10px;}
.modal-actions button{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:500;}
.modal-actions .cancel{background:#f2f2f4;color:#333;}
.modal-actions .ok{background:var(--accent);color:#fff;}
.modal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.modal-grid button{padding:14px 0;border-radius:10px;background:#f7f7f8;font-size:13px;color:#333;display:flex;flex-direction:column;align-items:center;gap:6px;}
.modal-grid button svg{width:24px;height:24px;stroke:#1c1c1e;fill:none;stroke-width:1.8;}

.empty-hint{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}

let db = null;
function openDB() {
  return new Promise((resolve,reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('messages')) d.createObjectStore('messages',{keyPath:'id',autoIncrement:true}).createIndex('ts','ts');
      ['letters','cards','periods','countdowns','wxMessages','wxFriends','moments']
        .forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'id',autoIncrement:true}); });
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings',{keyPath:'key'});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const os = (n,m='readonly') => db.transaction(n,m).objectStore(n);
const pr = req => new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});

function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.toDateString()===now.toDateString()) return t;
  return `${d.getMonth()+1}月${d.getDate()}日 ${t}`;
}

/* ================== 头像双击拍一拍逻辑 ================== */
function handlePatTap(targetName, targetRole, platform) {
  const now = Date.now();
  if (!targetName._lastTap) targetName._lastTap = 0;
  const isDouble = (now - targetName._lastTap) < 300;
  targetName._lastTap = now;
  if (!isDouble) return;

  const myName = settings.myName;
  const peerName = settings.peerName;
  let text = "";
  if (targetRole === 'them') text = `${myName} 拍了拍 ${peerName}`;
  else text = `${peerName} 拍了拍 ${myName}`;

  // 从字卡库获取拍一拍
  pr(os('cards').getAll()).then(cards=>{
    const pats = cards.filter(c=>c.type === 'pat');
    if (pats.length) text += ` ${pickOne(pats).text}`;
    if (platform === 'imsg') {
      addMessage({role:'them', type:'system', text, ts:Date.now()}).then(m=>{
        appendMessageEl(m);
        scrollToBottom();
      });
    } else {
      if (!wxCurrent) return;
      sendWxMessage('them', {type:'system', text}, wxCurrent);
    }
  });
}

function buildMessageEl(m) {

  if (m.type === 'system') {
    const b = document.createElement('div');

  } else if (m.type === 'image') {
    const b = document.createElement('div');
    b.className = 'img-bubble';
    const img = document.createElement('img'); img.src = m.text; b.appendChild(img);
    el.appendChild(b);
  } else {

    el.appendChild(b);
  }

  const time = document.createElement('time');
  time.textContent = fmtTime(m.ts);

    : (settings.peerAvatar ? `<img src="${settings.peerAvatar}" style="width:100%;height:100%;object-fit:cover;">` : settings.peerName.slice(0,1));

function readImage(file) {
  return new Promise((resolve)=>{
    if (!file || !file.type.startsWith('image/')) { resolve(null); return; }
    if (file.size > 800*1024) { alert('图片过大（>800KB）'); resolve(null); return; }
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>resolve(null);
    r.readAsDataURL(file);
  });
}

async function maybeAutoReply(platform, userText) {
  if (settings.blockedByThem) return;
  if (!settings.autoReplyEnabled) return;

  if (Math.random() < 0.03) {
    settings.blockedByThem = true;
    await saveSettings();
    if (platform === 'imsg') {
      const m = await addMessage({role:'them', type:'system', text:`${settings.peerName} 已拉黑你`, ts:Date.now()});
      appendMessageEl(m);
    } else if (wxCurrent) {

    }
    return;
  }

  const cards = await getCardsByType('card');
  const stickers = await getCardsByType('sticker');
  let reply = null, replyType = 'text';
  if (cards.length && Math.random() < 0.8) reply = pickOne(cards).text;
  else if (stickers.length) { reply = pickOne(stickers).data; replyType = 'image'; }
  else if (cards.length) reply = pickOne(cards).text;
  if (!reply) return;

  const delay = 800 + Math.random() * 700;

  if (platform === 'imsg') {
    if (state.replyBusy) return;
    state.replyBusy = true;
    try {
      await sleep(delay);
      const m = await addMessage({role:'them', type:replyType==='image'?'image':'text', text:reply, ts:Date.now()});
      appendMessageEl(m);
    } finally { state.replyBusy = false; }
  } else if (wxCurrent) {
    setTimeout(async ()=>{

    }, delay);
  }

/* ================== 通话 ================== */
let callState = { active:false, minimized:false, startedAt:0, timer:null, isIncoming:false, ringTimer:null };

async function startCall(type='out') {
  if (callState.active) { restoreCall(); return; }
  callState = { active:true, minimized:false, startedAt:0, timer:null, isIncoming:type==='in', ringTimer:null };
  
  const avHtml = settings.peerAvatar ? `<img src="${settings.peerAvatar}">` : settings.peerName.slice(0,1);
  $('#callAvatar').innerHTML = avHtml;
  $('#cfAv').innerHTML = avHtml;
  $('#callName').textContent = settings.peerName;
  $('#cfName').textContent = settings.peerName;
  $('#cfTime').textContent = '00:00';
  $('#callScreen').hidden = false;
  $('#callFloat').hidden = true;

  const actions = $('#callActions');
  actions.innerHTML = '';

  if (callState.isIncoming) {
    $('#callStatus').textContent = '邀请你语音通话…';
    actions.innerHTML = `
      <button class="call-btn hangup" id="callHangup" type="button">${ICONS.hangup}<span>拒接</span></button>
      <button class="call-btn answer" id="callAnswer" type="button">${ICONS.call}<span>接听</span></button>
    `;
    $('#callHangup').onclick = endCall;
    $('#callAnswer').onclick = () => {
      callState.startedAt = Date.now();
      $('#callStatus').textContent = '通话中 00:00';
      setupCallTimer();
      renderInCallActions();
    };
    callState.ringTimer = setTimeout(() => {
      if (callState.active && callState.isIncoming) endCall();
    }, 15000);
  } else {
    $('#callStatus').textContent = '正在呼叫…';
    actions.innerHTML = `
      <button class="call-btn mute" id="callMute" type="button">${ICONS.settings}<span>静音</span></button>
      <button class="call-btn min" id="callMin" type="button">${ICONS.min}<span>最小化</span></button>
      <button class="call-btn hangup" id="callHangup" type="button">${ICONS.hangup}<span>挂断</span></button>
    `;
    $('#callHangup').onclick = endCall;
    $('#callMin').onclick = minimizeCall;
    $('#callMute').onclick = e => e.currentTarget.style.opacity = e.currentTarget.style.opacity === '0.5' ? '1' : '0.5';
    
    setTimeout(() => {
      if (!callState.active) return;
      callState.startedAt = Date.now();
      $('#callStatus').textContent = '通话中 00:00';
      setupCallTimer();
      renderInCallActions();
    }, 2500);
  }
}

function renderInCallActions() {
  const actions = $('#callActions');
  actions.innerHTML = `
    <button class="call-btn mute" id="callMute" type="button">${ICONS.settings}<span>静音</span></button>
    <button class="call-btn min" id="callMin" type="button">${ICONS.min}<span>最小化</span></button>
    <button class="call-btn hangup" id="callHangup" type="button">${ICONS.hangup}<span>挂断</span></button>
  `;
  $('#callHangup').onclick = endCall;
  $('#callMin').onclick = minimizeCall;
  $('#callMute').onclick = e => e.currentTarget.style.opacity = e.currentTarget.style.opacity === '0.5' ? '1' : '0.5';
}

function setupCallTimer() {
  callState.timer = setInterval(()=>{
    if (!callState.active) return;
    const s = Math.floor((Date.now()-callState.startedAt)/1000);
    const t = `${pad(Math.floor(s/60))}:${pad(s%60)}`;
    $('#callStatus').textContent = '通话中 ' + t;
    $('#cfTime').textContent = t;
  }, 1000);
}

function endCall() {
  if (callState.timer) clearInterval(callState.timer);
  if (callState.ringTimer) clearTimeout(callState.ringTimer);
  callState.active = false;
  $('#callScreen').hidden = true;
  $('#callFloat').hidden = true;
}
function minimizeCall() {
  if (!callState.active) return;
  callState.minimized = true;
  $('#callScreen').hidden = true;
  $('#callFloat').hidden = false;
}
function restoreCall() {
  if (!callState.active) return;
  callState.minimized = false;
  $('#callScreen').hidden = false;
  $('#callFloat').hidden = true;
}
$('#cfHangup').addEventListener('click', e=>{ e.stopPropagation(); endCall(); });
$('#callFloat').addEventListener('click', e=>{ if (e.target.id !== 'cfHangup') restoreCall(); });

function buildMomentEl(m) {
  const el = document.createElement('div');

    : (settings.peerAvatar ? `<img src="${settings.peerAvatar}">` : settings.peerName.slice(0,1));

  let imgsHtml = '';
  if (m.images && m.images.length) {
    imgsHtml = '<div class="imgs">' + m.images.map(im=>{
      if (im.startsWith('data:')) return `<img src="${im}">`;
      return `<div style="background:${im}"></div>`;
    }).join('') + '</div>';
  }
  let likesHtml = '';
  if (m.likes && m.likes.length) {
    likesHtml = `<div class="likes">♥ ${m.likes.map(w=>esc(w==='me'?settings.myName:settings.peerName)).join('，')}</div>`;
  }
  let commentsHtml = '';
  if (m.comments && m.comments.length) {
    commentsHtml = '<div class="comments">' + m.comments.map(c=>
      `<div class="cmt"><b>${esc(c.who==='me'?settings.myName:settings.peerName)}</b>${esc(c.text)}</div>`
    ).join('') + '</div>';
  }

  el.innerHTML = `

      </div>
      ${likesHtml}
      ${commentsHtml}
    </div>`;
  el.querySelector('[data-act="like"]').addEventListener('click', ()=>toggleMomentLike(m.id));
  el.querySelector('[data-act="comment"]').addEventListener('click', ()=>commentMoment(m.id));
  return el;
}

async function exportBackup() {
  const data = {

    messages:  await pr(os('messages').getAll()), letters:   await pr(os('letters').getAll()),
    cards:     await pr(os('cards').getAll()), periods:   await pr(os('periods').getAll()),

    wxMessages:await pr(os('wxMessages').getAll()), moments:   await pr(os('moments').getAll()),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `qiyе-backup-${Date.now()}.json`; a.click();

function importBackup() {
  const input = document.createElement('input'); input.type='file'; input.accept='.json,application/json';
  input.addEventListener('change', async ()=>{
    const f = (input.files||[])[0]; if (!f) return;
    try {
      const text = await f.text(); const data = JSON.parse(text);
      if (!confirm('导入将覆盖当前所有数据，确定吗？')) return;
      settings = {...DEFAULT_SETTINGS, ...(data.settings||{})}; await saveSettings();
      const stores = ['messages','letters','cards','periods','countdowns','wxFriends','wxMessages','moments'];
      for (const s of stores) {
        if (Array.isArray(data[s])) {
          const st = os(s,'readwrite'); await pr(st.clear());
          for (const item of data[s]) { const copy = {...item}; delete copy.id; await pr(st.add(copy)); }
        }
      }
      alert('导入完成'); location.reload();
    } catch (err) { alert('导入失败：' + err.message); }
  });
  input.click();
}
async function clearAllData() {
  if (!confirm('将删除所有数据，且无法恢复。确定吗？')) return;
  const stores = ['messages','letters','settings','cards','periods','countdowns','wxFriends','wxMessages','moments'];
  await Promise.all(stores.map(s=>pr(os(s,'readwrite').clear())));
  location.reload();
}

let cardSelectMode = false;
let cardSelected = new Set();
let cardSearchQuery = '';
let cardColor = CARD_COLORS[0];

function renderCardPage() {
  $$('.card-tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.cardtab === cardTab);
    b.onclick = () => { cardTab = b.dataset.cardtab; cardSelectMode = false; cardSelected.clear(); cardSearchQuery=''; $('#cardSearch').value=''; renderCardPage(); };
  });
  $('#cardSelectBtn').classList.toggle('active', cardSelectMode);
  $('#cardSelectBtn').textContent = cardSelectMode ? '完成' : '选择';
  $('#cardSearch').oninput = e => { cardSearchQuery = e.target.value.toLowerCase(); renderCardList(); };
  $('#cardDupBtn').onclick = () => doDedup();
  $('#cardAddBtn').onclick = () => doAddCards();
  $('#cardSelectBtn').onclick = () => { cardSelectMode = !cardSelectMode; cardSelected.clear(); renderCardPage(); };
  $('#cardBatchCancel').onclick = () => { cardSelectMode = false; cardSelected.clear(); renderCardPage(); };
  $('#cardBatchAll').onclick = () => {
    const all = $$('.card-item-wrap');
    const allSelected = all.every(w=>w.classList.contains('sel'));
    cardSelected.clear();
    if (!allSelected) all.forEach(w=>cardSelected.add(parseInt(w.dataset.id)));
    renderCardList(); renderCardBatchBar();
  };
  $('#cardBatchDel').onclick = () => doBatchDelete();
  $('#cardBatchGroup').onclick = () => doBatchGroup();
  $('#cardBatchBar').hidden = !cardSelectMode;
  renderCardList();
}
function renderCardBatchBar() { $('#cardSelCount').textContent = `已选 ${cardSelected.size}`; }
async function renderCardList() {
  const wrap = $('#cardListWrap'); wrap.replaceChildren();
  const all = await pr(os('cards').getAll());
  let items = all.filter(c=>(c.type||'card') === cardTab);
  if (cardSearchQuery) items = items.filter(c=> (cardTab==='sticker' ? (c.name||'') : (c.text||'')).toLowerCase().includes(cardSearchQuery));
  if (!items.length) { wrap.innerHTML = `<p class="empty-hint">${cardSearchQuery?'没有匹配项':'还没有内容，点击增加添加'}</p>`; return; }
  
  const groups = {};
  items.forEach(c=>{ const g = c.group || ''; groups[g] = groups[g] || []; groups[g].push(c); });
  for (const g of Object.keys(groups).sort((a,b)=>!a?1:!b?-1:a.localeCompare(b))) {
    if (g) { const t = document.createElement('p'); t.className='group-title'; t.textContent = '分组：' + g; wrap.appendChild(t); }
    for (const c of groups[g]) wrap.appendChild(buildCardItem(c));
  }
}
function buildCardItem(c) {
  const wrap = document.createElement('div'); wrap.className = 'card-item-wrap'; wrap.dataset.id = c.id;
  if (cardSelectMode) {
    const cb = document.createElement('div'); cb.className = 'cb';
    const input = document.createElement('input'); input.type='checkbox'; input.checked = cardSelected.has(c.id);
    input.addEventListener('change', ()=>{ if (input.checked) cardSelected.add(c.id); else cardSelected.delete(c.id); wrap.classList.toggle('sel', input.checked); renderCardBatchBar(); });
    cb.appendChild(input); wrap.appendChild(cb);
    if (input.checked) wrap.classList.add('sel');
  }
  const body = document.createElement('div'); body.className = 'body';
  if (cardTab === 'sticker') {
    const card = document.createElement('div'); card.className = 'sticker-card';
    card.innerHTML = `<img src="${c.data}" alt=""><span class="name">${esc(c.name||'未命名')}</span>`;
    if (!cardSelectMode) {
      const del = document.createElement('button'); del.className='del'; del.type='button'; del.textContent='×';
      del.onclick = async ()=>{ if (confirm('删除？')) { await pr(os('cards','readwrite').delete(c.id)); renderCardList(); } };
      card.appendChild(del);
    }
    body.appendChild(card);
  } else {
    const card = document.createElement('div'); card.className = 'word-card';
    card.style.background = c.color || CARD_COLORS[0]; card.textContent = c.text;
    if (!cardSelectMode) {
      const del = document.createElement('button'); del.className='del'; del.type='button'; del.textContent='×';
      del.onclick = async ()=>{ if (confirm('删除？')) { await pr(os('cards','readwrite').delete(c.id)); renderCardList(); } };
      card.appendChild(del);
    }
    body.appendChild(card);
  }
  wrap.appendChild(body); return wrap;
}
async function doAddCards() {
  if (cardTab === 'sticker') {
    const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.multiple = true;
    input.addEventListener('change', async ()=>{
      const files = [...(input.files||[])]; let ok = 0;
      for (const f of files) { const d = await readImage(f); if (!d) continue; await pr(os('cards','readwrite').add({ type:'sticker', data:d, name:f.name || 'sticker', createdAt:Date.now() })); ok++; }
      alert(`已导入 ${ok} 张表情包`); renderCardList();
    });
    input.click(); return;
  }
  await showModal(`
    <h3>${cardTab==='pat'?'增加拍一拍':'增加字卡'}</h3>
    <textarea class="input-box" id="cAdd" placeholder="每行一条，可以批量添加" rows="6"></textarea>
  `, async ()=>{
    const text = $('#cAdd').value.trim(); if (!text) return false;
    for (const t of text.split('\n').map(s=>s.trim()).filter(Boolean)) {
      await pr(os('cards','readwrite').add({ type:cardTab, text:t, color:cardColor, createdAt:Date.now() }));
    }
    renderCardList();
  });
  setTimeout(()=>{
    const wrap = modalBox.querySelector('#cAdd');
    if (wrap) {
      const colorRow = document.createElement('div');
      colorRow.style.cssText = 'display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;';
      CARD_COLORS.forEach(c=>{
        const d = document.createElement('button'); d.type='button';
        d.style.cssText = `width:26px;height:26px;border-radius:50%;background:${c};border:3px solid ${cardColor===c?'#1c1c1e':'transparent'};`;
        d.addEventListener('click', ()=>{ cardColor = c; colorRow.querySelectorAll('button').forEach(bb=>bb.style.border = '3px solid transparent'); d.style.border = '3px solid #1c1c1e'; });
        colorRow.appendChild(d);
      });
      wrap.after(colorRow);
    }
  }, 0);
}
async function doDedup() {
  const all = await pr(os('cards').getAll()); const items = all.filter(c=>(c.type||'card') === cardTab);
  const seen = new Map(); const dups = [];
  for (const c of items) { const key = cardTab === 'sticker' ? (c.data||'') : (c.text||''); if (!key) continue; if (seen.has(key)) dups.push(c); else seen.set(key, c); }
  if (!dups.length) { alert('没有发现重复'); return; }
  if (!confirm(`发现 ${dups.length} 个重复，是否删除？`)) return;
  for (const c of dups) await pr(os('cards','readwrite').delete(c.id));
  alert(`已删除 ${dups.length} 个重复`); renderCardList();
}
async function doBatchDelete() {
  if (!cardSelected.size) { alert('请先勾选'); return; }
  if (!confirm(`删除选中的 ${cardSelected.size} 项？`)) return;
  for (const id of cardSelected) await pr(os('cards','readwrite').delete(id));
  cardSelected.clear(); cardSelectMode = false; renderCardPage();
}
async function doBatchGroup() {
  if (!cardSelected.size) { alert('请先勾选'); return; }
  await showModal(`<h3>分组</h3><input class="input-box" id="grpName" placeholder="组名（留空则取消分组）">`, async ()=>{
    const name = $('#grpName').value.trim();
    for (const id of cardSelected) { const c = await pr(os('cards').get(id)); if (c) { c.group = name || undefined; await pr(os('cards','readwrite').put(c)); } }
    cardSelected.clear(); cardSelectMode = false; renderCardPage();
  });
}

/* ================== 经期/倒数日/信箱/音乐 ================== */
async function renderPeriod() {
  const list = (await pr(os('periods').getAll())).sort((a,b)=>b.start-a.start);
  const hero = $('#periodHero');
  const cycle = settings.periodCycle || 28;
  if (list.length) {
    const last = list[0].start; const next = last + cycle*86400000; const days = Math.ceil((next - Date.now())/86400000);
    hero.querySelector('.big').textContent = days>=0 ? days : Math.abs(days);
    hero.querySelector('.sub').textContent = days>=0 ? `距离下次预测还有 ${days} 天` : `已推迟 ${Math.abs(days)} 天`;
    $('#periodStart').value = fmtDate(last);
  } else { hero.querySelector('.big').textContent = '—'; hero.querySelector('.sub').textContent = '还没有记录'; }
  const hist = $('#periodHistory'); hist.replaceChildren();
  if (!list.length) { hist.innerHTML = '<p class="empty-hint">还没有记录</p>'; return; }
  for (const p of list) {
    const item = document.createElement('div'); item.className = 'history-item';
    item.innerHTML = `<span>${fmtDate(p.start)}</span><button class="del">删除</button>`;
    item.querySelector('.del').onclick = async ()=>{ await pr(os('periods','readwrite').delete(p.id)); renderPeriod(); };
    hist.appendChild(item);
  }
}
$('#addPeriod').onclick = async ()=>{
  const dateStr = $('#periodStart').value; const cycle = clampInt($('#periodCycle').value, 15, 60, 28);
  if (!dateStr) { alert('请选择日期'); return; }
  settings.periodCycle = cycle; await saveSettings();
  await pr(os('periods','readwrite').add({start: new Date(dateStr+'T00:00:00').getTime(), cycle, createdAt:Date.now()}));
  renderPeriod();
};
async function renderCountdown() {
  const items = (await pr(os('countdowns').getAll())).sort((a,b)=>a.date-b.date);
  const list = $('#cdList'); list.replaceChildren();
  if (!items.length) { list.innerHTML = '<p class="empty-hint">还没有倒数日</p>'; return; }
  for (const it of items) {
    const days = Math.ceil((it.date - Date.now())/86400000);
    const el = document.createElement('div'); el.className = 'cd-item';
    el.innerHTML = `<div class="cd-num"><b>${Math.abs(days)}</b><span>${days>=0?'天后':'天前'}</span></div><div class="cd-info"><div class="cd-name">${esc(it.name)}</div><div class="cd-date">${fmtDate(it.date)}</div></div><button class="del">删除</button>`;
    el.querySelector('.del').onclick = async ()=>{ await pr(os('countdowns','readwrite').delete(it.id)); renderCountdown(); };
    list.appendChild(el);
  }
}
$('#addCd').onclick = async ()=>{
  const name = $('#cdName').value.trim(); const dateStr = $('#cdDate').value;
  if (!name) { alert('请填写名称'); return; } if (!dateStr) { alert('请选择日期'); return; }
  await pr(os('countdowns','readwrite').add({name, date: new Date(dateStr+'T00:00:00').getTime(), createdAt:Date.now()}));
  $('#cdName').value = ''; $('#cdDate').value = ''; renderCountdown();
};
async function renderLetters() {
  const letters = (await pr(os('letters').getAll())).sort((a,b)=>a.openAt-b.openAt);
  const listEl = $('#letterList'); listEl.replaceChildren();
  if (!letters.length) { listEl.innerHTML = '<p class="empty-hint">还没有信件</p>'; return; }
  const now = Date.now();
  for (const l of letters) {
    const el = document.createElement('div'); el.className = 'rule';
    let html = `<div style="font-weight:600;margin-bottom:4px;">${l.opened?'已拆 · ':'未拆 · '}${esc(l.title||'无标题')}</div>`;
    const od = new Date(l.openAt);
    if (l.opened) html += `<div style="font-size:12px;color:#999;margin-bottom:8px;">已于 ${fmtDate(od)} 拆开</div><div style="font-size:13px;padding:10px;background:#f7f7f8;border-radius:8px;margin-bottom:10px;">${esc(l.content)}</div>`;
    else if (l.openAt > now) html += `<div style="font-size:12px;color:#999;margin-bottom:8px;">将于 ${fmtDate(od)} 开启</div>`;
    else html += `<div style="font-size:12px;color:#999;margin-bottom:8px;">已到期</div>`;
    el.innerHTML = html;
    const acts = document.createElement('div'); acts.style.cssText = 'display:flex;gap:8px;';
    if (!l.opened && l.openAt <= now) {
      const b = document.createElement('button'); b.className='btn primary'; b.textContent='拆开';
      b.onclick = async ()=>{ l.opened = true; await pr(os('letters','readwrite').put(l)); openLetter(l); };
      acts.appendChild(b);
    }
    const del = document.createElement('button'); del.className='btn danger'; del.textContent='删除';
    del.onclick = async ()=>{ if (confirm('删除？')) { await pr(os('letters','readwrite').delete(l.id)); renderLetters(); } };
    acts.appendChild(del); el.appendChild(acts); listEl.appendChild(el);
  }
}
async function openLetter(l) {
  const m = await addMessage({role:'them', type:'text', text:`【信箱】${l.title||'无标题'}\n\n${l.content}`, ts:Date.now()});
  stack.length = 0; stack.push('home','app-messages'); showScreen('app-messages');
  appendMessageEl(m); scrollToBottom(true); renderLetters();
}
$('#addLetter').onclick = async ()=>{
  const title = $('#letterTitle').value.trim(); const content = $('#letterContent').value.trim(); const openAtStr = $('#letterOpenAt').value;
  if (!content || !openAtStr) { alert('请填写完整'); return; }
  const openAt = new Date(openAtStr).getTime();
  if (openAt <= Date.now()) { alert('时间需晚于当前'); return; }
  await pr(os('letters','readwrite').add({title, content, openAt, createdAt:Date.now(), opened:false}));
  $('#letterTitle').value=''; $('#letterContent').value=''; resetLetterTime(); await renderLetters(); alert('已封存');
};
function resetLetterTime() {
  const t = new Date(Date.now() + 86400000); const local = new Date(t.getTime() - t.getTimezoneOffset()*60000);
  $('#letterOpenAt').value = local.toISOString().slice(0,16);
}
let currentSong = null, playing = false;
function renderMusic() {
  const list = $('#musicList'); list.replaceChildren();
  SONGS.forEach((s,i)=>{
    const row = document.createElement('div'); row.className = 'song' + (currentSong===s?' playing':'');
    row.innerHTML = `<span class="num">${i+1}</span><span class="thumb"></span><span class="info"><div class="ttl">${esc(s.t)}</div><div class="art">${esc(s.a)}</div></span>`;
    row.onclick = ()=>{ currentSong = s; playing = true; $('#playerTitle').textContent = s.t; $('#playerArtist').textContent = s.a; $('#playerPlay').textContent = '⏸'; $('#netPlayer').classList.add('playing'); renderMusic(); };
    list.appendChild(row);
  });
}
$('#playerPlay').onclick = ()=>{
  if (!currentSong) { currentSong = SONGS[0]; $('#playerTitle').textContent = currentSong.t; $('#playerArtist').textContent = currentSong.a; playing = true; }
  else playing = !playing;
  $('#playerPlay').textContent = playing ? '⏸' : '▶'; $('#netPlayer').classList.toggle('playing', playing);
};

/* ================== 启动 ================== */
async function boot() {
  try { db = await openDB(); }
  catch (err) { document.body.innerHTML = '<p style="padding:40px;color:#fff;">无法初始化数据库：' + esc(err) + '</p>'; return; }
  await loadSettings();
  applyPeer();
  renderHome();
  resetLetterTime();
  await initChat();
  updateClock();
  setInterval(updateClock, 30000);
  setInterval(() => { if (db && Math.random()<0.5) maybeThemPostMoment(); }, 45000);
  setTimeout(() => { if (db) maybeThemPostMoment(); }, 15000);

  // 随机模拟对方来电
  setTimeout(() => {
    if (!callState.active && db) startCall('in');
  }, 30000);
}
async function updateClock() { const d = new Date(); const el = $('#sbTime'); if (el) el.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
async function seedWelcome() { if ((await pr(os('messages').count())) === 0) await addMessage({role:'them', type:'text', text:'晚上好呀。', ts:Date.now()}); }
boot().then(()=>seedWelcome().then(initChat));

})();
</script>
