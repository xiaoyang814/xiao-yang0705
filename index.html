<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>栖夜</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:15px;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
::-webkit-scrollbar{width:0;height:0}
:root{
  --brand:#07c160;--brand2:#05a04e;--brand-soft:rgba(7,193,96,.12);
  --bg:#ededed;--panel:#fff;--text:#191919;--muted:#999;--line:#e3e3e3;
  --wall:#ffffff;--nav-bg:rgba(247,247,247,.94);--chat-wall:#ffffff;
  --av-r:6px;--chat-blur:0px;--frame-color:transparent;--frame-width:0px;
}
body[data-bubble="default"]{--self:#007aff;--other:#e9e9eb;--self-text:#fff;--other-text:#191919}
body[data-bubble="night"]{--self:#3a3a3c;--other:#2c2c2e;--self-text:#fff;--other-text:#f2f2f7}
body[data-bubble="sakura"]{--self:#ffd1dc;--other:#fff;--self-text:#5a3540;--other-text:#191919}
body[data-bubble="indigo"]{--self:#5b6bff;--other:#f0f2ff;--self-text:#fff;--other-text:#1a2050}
body[data-bubble="matcha"]{--self:#c5e8b5;--other:#fff;--self-text:#2e4a20;--other-text:#191919}
body[data-theme="mono"]{--wall:#ffffff}
body[data-theme="ocean"]{--wall:linear-gradient(165deg,#1a2547,#2d4a8a,#5b82be)}
body[data-theme="sakura"]{--wall:linear-gradient(165deg,#ff9a9e,#fecfef,#fbc2eb)}
body[data-theme="forest"]{--wall:linear-gradient(165deg,#134e5e,#2c8a6d,#71b280)}
body[data-theme="sunset"]{--wall:linear-gradient(165deg,#ffb75e,#ed8f03,#ff6b6b)}
body[data-theme="night"]{--wall:linear-gradient(165deg,#0f0c29,#302b63,#24243e)}
body[data-theme="mono"] #screen-home{color:#111}
body[data-theme="mono"] .app-name{color:#333}
body[data-theme="mono"] .cd-square{background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06)}
body[data-theme="mono"] .cd-square .cds-name{color:#333}
.phone{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);visibility:hidden;opacity:0;transform:scale(.96);transition:opacity .28s,transform .28s,visibility .28s;z-index:1;overflow:hidden}
.screen.active{visibility:visible;opacity:1;transform:scale(1);z-index:2}
#screen-home{background:var(--wall);background-size:cover;background-position:center;color:#111;overflow-y:auto;height:100%;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
body:not([data-theme="mono"]) #screen-home{color:#fff}
.home-single{width:100%;box-sizing:border-box;flex:1 0 auto;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,14px);padding:calc(env(safe-area-inset-top) + 12px) clamp(10px,3vw,16px) calc(12px + env(safe-area-inset-bottom))}
.widget-row{flex:1.2 1 0;min-height:0;display:flex;flex-direction:column;gap:0;padding:0;margin:0;align-items:stretch}
.couple-wide{flex:1;width:100%;height:100%;min-height:110px;background:linear-gradient(135deg,#ffb75e,#ed8f03,#ff6b6b);background-size:cover;background-position:center;border-radius:clamp(18px,5vw,24px);position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1);cursor:pointer}
.couple-wide:active{opacity:.94}
.couple-wide .cw-center{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:center;z-index:2}
.couple-wide .cw-av{width:clamp(54px,14.5vw,70px);height:clamp(54px,14.5vw,70px);border-radius:50%;border:3px solid #fff;overflow:hidden;background:#7a8ba6;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4.2vw,20px);font-weight:600;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.couple-wide .cw-av + .cw-av{margin-left:-16px}
.couple-wide .cw-av img{width:100%;height:100%;object-fit:cover;display:block}
.couple-wide .cw-edit{position:absolute;bottom:12px;right:14px;font-size:11px;color:#fff;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:14px;backdrop-filter:blur(8px);z-index:3}
.couple-wide .cw-edit:active{background:rgba(0,0,0,.55)}
.page-row{flex:1 1 0;min-height:0;display:flex;gap:clamp(10px,2.8vw,14px);align-items:stretch;padding:0;margin:0}
.page-row .cd-square{width:clamp(106px,36%,150px);height:100%;aspect-ratio:auto;flex:0 0 auto}
.page-grid-2x2{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;min-width:0}
.page-grid-2x2 .app{gap:4px}
.page-grid-2x2 .app-icon{width:clamp(42px,11.5vw,52px);height:clamp(42px,11.5vw,52px);border-radius:clamp(11px,3vw,14px)}
.page-grid-2x2 .app-name{font-size:clamp(9.5px,2.6vw,11px)}
.cd-square{width:clamp(120px,42%,160px);aspect-ratio:1;background:#fff;border-radius:clamp(16px,4.5vw,22px);padding:clamp(14px,4vw,18px);box-shadow:0 1px 5px rgba(0,0,0,.07);border:1px solid rgba(0,0,0,.05);display:flex;flex-direction:column;justify-content:center;cursor:pointer;overflow:hidden;position:relative;background-size:cover;background-position:center}
.cd-square.has-bg::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.06);border-radius:inherit;z-index:0}
.cd-square>*{position:relative;z-index:1}
.cd-square:active{background-color:#f7f7f8}
.cd-square .cds-name{font-size:clamp(11.5px,3.2vw,13.5px);color:#5a5a66;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.cd-square .cds-body{display:flex;align-items:baseline;gap:4px}
.cd-square .cds-num{font-size:clamp(34px,10.5vw,46px);font-weight:700;color:#111;line-height:1;letter-spacing:-1px}
.cd-square .cds-unit{font-size:clamp(11px,3vw,13px);color:#a0a0a8;font-weight:400}
.cd-square.cd-empty .cds-num{font-size:clamp(20px,6vw,26px);color:#c8c8d0;font-weight:400}
.cd-square.has-bg .cds-name{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.cd-square.has-bg .cds-num{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cd-square.has-bg .cds-unit{color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.55)}
.photo-stack{width:clamp(110px,38%,150px);height:100%;position:relative;cursor:pointer;flex:0 0 auto;margin-top:0}
.photo-stack .ps-img{position:absolute;width:72%;height:72%;border-radius:12px;background:rgba(0,0,0,.06);background-size:cover;background-position:center;box-shadow:0 4px 14px rgba(0,0,0,.15);border:2px solid #fff;transition:.2s}
.photo-stack .ps-back{top:0;right:0;transform:rotate(6deg);z-index:2}
.photo-stack .ps-front{bottom:0;left:0;transform:rotate(-4deg);z-index:4}
.photo-stack:active .ps-front{transform:rotate(-4deg) scale(.96)}
.photo-stack .ps-mini-edit{position:absolute;font-size:10px;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:10px;z-index:8;backdrop-filter:blur(6px);border:none;line-height:1}
.photo-stack .ps-mini-edit:active{background:rgba(0,0,0,.8)}
.photo-stack .ps-back .ps-mini-edit{top:6px;right:6px}
.photo-stack .ps-front .ps-mini-edit{bottom:6px;left:6px}
.home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.5vw,14px) clamp(4px,2vw,10px);padding:clamp(4px,1.5vw,10px) 0}
.home-grid-3{flex:0 0 auto;grid-template-columns:repeat(3,1fr) !important;gap:clamp(8px,2.5vw,14px) clamp(6px,2vw,12px) !important;margin-top:0 !important;background:rgba(255,255,255,.35) !important;backdrop-filter:blur(16px) !important;-webkit-backdrop-filter:blur(16px) !important;border-radius:clamp(18px,5vw,26px) !important;padding:clamp(10px,2.8vw,14px) clamp(14px,4vw,22px) !important;border:1px solid rgba(255,255,255,.5) !important;box-shadow:0 2px 12px rgba(0,0,0,.06) !important}
.home-grid-3 .app-icon{width:clamp(42px,11.5vw,52px) !important;height:clamp(42px,11.5vw,52px) !important;border-radius:clamp(11px,3vw,14px) !important}
.home-grid-3 .app-name{font-size:clamp(9px,2.5vw,11px) !important}
.app{display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.5vw,8px);color:#fff;font-size:clamp(10px,2.9vw,12px);transition:transform .12s;position:relative}
.app:active{transform:scale(.88)}
.app-icon{width:clamp(48px,13.5vw,58px);height:clamp(48px,13.5vw,58px);border-radius:clamp(12px,3.5vw,15px);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.08);background:#fff;color:#111;border:1px solid rgba(0,0,0,.08);overflow:hidden}
.app-icon svg{width:52%;height:52%;stroke:#111;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app-icon img{width:100%;height:100%;object-fit:cover;display:block}
.app-name{color:#333}
.nav{flex:0 0 auto;display:flex;align-items:center;position:relative;background:var(--nav-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);height:calc(48px + env(safe-area-inset-top));color:var(--text)}
.nav-title-wrap{position:absolute;left:64px;right:90px;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;line-height:1.15;overflow:hidden}
.nav-title-wrap .nav-title{position:static;left:auto;right:auto;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nav-status{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;justify-content:center;gap:4px}
.nav-status::before{content:"";width:6px;height:6px;border-radius:50%;background:#22c55e;flex:0 0 6px}
.nav-status[data-status="busy"]::before{background:#f59e0b}
.nav-status[data-status="offline"]::before{background:#b0b0b0}
.nav-status[data-status="online"]{color:#22c55e}
.nav-status[data-status="busy"]{color:#f59e0b}
.nav-status[data-status="offline"]{color:var(--muted)}
.nav-status.typing{color:#07c160}
.nav-status.typing::before{background:#07c160;animation:typingPulse 1s infinite}
@keyframes typingPulse{0%,100%{opacity:1}50%{opacity:.35}}
.back{font-size:30px;line-height:1;padding:0 14px 4px;color:var(--text);display:flex;align-items:center;height:48px;font-weight:300}
.back:active{opacity:.5}
.nav-right{margin-left:auto;display:flex;gap:2px;z-index:3;padding-right:6px}
.nav-btn{padding:8px 10px;color:var(--text);border-radius:6px}
.nav-btn:active{background:rgba(128,128,128,.14)}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.scroll{flex:1;overflow-y:auto;padding:14px 14px calc(36px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;background:var(--bg)}
.card{background:var(--panel);border-radius:12px;padding:15px;margin-bottom:12px;color:var(--text)}
.card-title{font-weight:600;margin-bottom:12px;font-size:14.5px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.field{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg);margin-bottom:10px;font-size:15px;color:var(--text)}
.field:focus{border-color:var(--brand);background:var(--panel)}
textarea.field{resize:vertical;min-height:86px;line-height:1.55}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btn{padding:10px 16px;border-radius:9px;background:var(--bg);font-size:13.5px;white-space:nowrap;color:var(--text);font-weight:500}
.btn:active{background:rgba(128,128,128,.2)}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:active{background:var(--brand2)}
.btn.danger{color:#e64340;background:rgba(230,67,64,.1)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0;line-height:1.7}
.chat-bg-wrap{flex:1;min-height:0;position:relative;overflow:hidden}
.chat-bg{position:absolute;inset:0;background:var(--chat-wall);background-size:cover;background-position:center;background-repeat:no-repeat;filter:blur(var(--chat-blur));z-index:0;transition:filter .2s}
.msg-list{position:absolute;inset:0;overflow-y:auto;padding:10px 9px 6px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;background:transparent;z-index:1}
.msg-list>*{position:relative;z-index:1}
.time-sep{align-self:center;font-size:11.5px;color:#8e8e93;background:transparent;padding:2px 8px;margin:12px 0 8px;font-weight:500}
.msg-row{display:flex;gap:0;align-items:flex-start;margin:0;animation:pop .16s}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg-row.me{flex-direction:row-reverse}
.msg-avatar{width:34px;height:34px;flex:0 0 34px;border-radius:var(--av-r);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;background:#7a8ba6;cursor:pointer;transition:transform .12s;box-shadow:0 0 0 var(--frame-width) var(--frame-color)}
.msg-avatar:active{transform:scale(.9)}
.msg-avatar img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.msg-row.me .msg-avatar{background:linear-gradient(135deg,var(--brand),var(--brand2))}
.msg-avwrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 40px;width:40px}
.msg-time{font-size:8.5px;color:var(--muted);text-align:center;line-height:1.1;white-space:nowrap;letter-spacing:-0.3px}
.msg-col{display:flex;flex-direction:column;max-width:min(84%,460px);min-width:0}
.msg-row.me .msg-col{align-items:flex-end}
.msg-bubble-row{display:flex;align-items:flex-end;gap:4px;width:fit-content;max-width:100%;min-width:0}
.msg-row.ta .msg-bubble-row{align-self:flex-start}
.msg-row.me .msg-bubble-row{align-self:flex-end}
.read-status{font-size:10px;color:#8e8e93;font-weight:500;white-space:nowrap;flex:0 0 auto;padding-bottom:2px}
.read-status.unread{color:#c7c7cc}
.bubble{position:relative;background:var(--other);color:var(--other-text);border-radius:16px;padding:7px 12px;line-height:1.32;white-space:pre-wrap;word-break:break-word;font-size:15px;width:fit-content;max-width:100%}
.msg-row.ta .bubble{border-bottom-left-radius:4px}
.msg-row.me .bubble{border-bottom-right-radius:4px}
.msg-row.me .bubble{background:var(--self);color:var(--self-text)}
.msg-row .bubble::before,.msg-row .bubble::after{content:none !important;display:none !important;border:none !important}
.bubble.media{padding:0 !important;background:transparent !important;box-shadow:none;line-height:0;border-radius:0}
.bubble.media img{display:block;width:auto;height:auto;max-width:100%;max-height:220px;border-radius:8px}
.bubble .quote{background:rgba(0,0,0,.06);border-left:3px solid rgba(0,0,0,.15);border-radius:5px;padding:5px 8px;margin-bottom:6px;font-size:12.5px;line-height:1.4}
.msg-row.me .bubble .quote{background:rgba(0,0,0,.08);border-left-color:rgba(0,0,0,.2)}
.bubble .quote .q-name{font-weight:600;font-size:11.5px;opacity:.8;margin-bottom:2px}
.bubble .quote .q-text{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble.recalled{background:rgba(0,0,0,.08);color:var(--muted);border:none;border-radius:50px;padding:5px 16px;font-size:12px;text-align:center;display:inline-block}
.bubble.recalled::before{display:none!important}
.msg-row.recall-row{justify-content:center;margin:3px 0}
.msg-row.recall-row .msg-avwrap{display:none}
.msg-row.recall-row .msg-col{align-items:center;max-width:90%}
.bubble.poke{background:rgba(0,0,0,.08);color:var(--muted);border:none;border-radius:50px;padding:5px 16px;font-size:12.5px;text-align:center;line-height:1.4;display:inline-block}
.bubble.poke::before{display:none!important}
.msg-row.poke-row{justify-content:center;margin:3px 0}
.msg-row.poke-row .msg-avwrap{display:none}
.msg-row.poke-row .msg-col{align-items:center;max-width:90%}
.bubble.callnotice{background:rgba(0,0,0,.07);color:var(--muted);border:none;border-radius:50px;padding:5px 14px;font-size:12px;display:inline-block;text-align:center}
.bubble.callnotice::before{display:none!important}
.msg-row.callnotice-row{justify-content:center;margin:4px 0}
.msg-row.callnotice-row .msg-avwrap{display:none}
.msg-row.callnotice-row .msg-col{align-items:center;max-width:90%}
.bubble.redpacket{background:var(--other) !important;color:var(--other-text) !important;padding:14px 16px;min-width:200px}
.msg-row.me .bubble.redpacket{background:var(--self) !important;color:var(--self-text) !important}
.bubble.redpacket::before,.bubble.redpacket::after{content:none !important;display:none !important;border:none !important}
.rp-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rp-icon{display:inline-flex;align-items:center;justify-content:center}
.rp-txt{font-weight:600;font-size:14.5px}
.rp-msg{font-size:12.5px;opacity:.75;margin-bottom:8px}
.rp-bottom{font-size:11.5px;opacity:.75;border-top:1px solid currentColor;padding-top:6px}
.rp-open{background:rgba(127,127,127,.22);border-radius:20px;padding:4px 10px;font-size:11.5px;color:inherit;display:inline-block}
.bubble.decision{background:linear-gradient(135deg,#a06bff,#7c4dff);color:#fff;min-width:200px}
.bubble.decision::before,.bubble.decision::after{content:none !important;display:none !important;border:none !important}
.dc-top{font-size:12px;opacity:.85;margin-bottom:6px}
.dc-options{font-size:13.5px;line-height:1.6;opacity:.9;margin-bottom:8px}
.dc-result{font-size:17px;font-weight:700;padding:8px 0;border-top:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.25);margin-bottom:8px}
.dc-btn{background:rgba(255,255,255,.25);border-radius:20px;padding:5px 12px;font-size:12.5px;color:#fff}
.bubble.quiz-card{min-width:0;background:#fff !important;color:#191919 !important;border-radius:12px !important;box-shadow:0 2px 10px rgba(0,0,0,.08) !important;padding:10px 12px !important;font-size:13.5px;max-width:76%}
.bubble.quiz-card::before,.bubble.quiz-card::after{content:none !important;display:none !important;border:none !important}
.quiz-title{font-weight:600;margin-bottom:7px;font-size:13px}
.quiz-opt{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;background:rgba(0,0,0,.05);margin-bottom:5px;font-size:12.5px;color:inherit;border:1px solid transparent}
.quiz-opt.multi-picked{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.quiz-text-answer{background:var(--brand-soft);border-radius:10px;padding:10px 12px;margin-top:6px;line-height:1.55;font-size:13px;color:var(--text);white-space:pre-wrap}
.quiz-text-answer .qta-tag{font-size:11px;color:var(--brand);font-weight:600;margin-bottom:6px}
.quiz-waiting{font-size:12.5px;color:var(--muted);padding:8px 0;text-align:center;font-style:italic}
.quiz-foot{font-size:11.5px;opacity:.7;margin-top:4px}
.quiz-type-row{display:flex;gap:8px;margin-bottom:10px}
.quiz-type-btn{flex:1;padding:9px;border-radius:9px;background:var(--bg);color:var(--muted);font-size:13.5px;font-weight:500;text-align:center}
.quiz-type-btn.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.quiz-type-btn:active{background:rgba(128,128,128,.2)}
.typing .bubble{display:flex;gap:4px;padding:12px 14px}
.typing .dot{width:6px;height:6px;border-radius:50%;background:#b9bed0;animation:blink 1.2s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}
.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:13.5px;gap:8px;text-align:center;
