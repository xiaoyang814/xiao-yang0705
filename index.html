<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#f2f4f8" />
<title>主屏幕</title>
<style>
  :root {
    --bg: #ffffff;
    --soft: #f4f4f6;
    --line: #ececef;
    --text: #1c1c1e;
    --text-2: #8e8e93;
    --accent: #1c1c1e;
    --wall: linear-gradient(165deg, #eef2f8 0%, #e2e8f2 45%, #e8e3f2 100%);
    --chat-bg: #f4f4f6;
    --moments-bg: linear-gradient(160deg, #dbe7f5 0%, #e8e0f0 100%);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --sb-h: calc(var(--safe-top) + 44px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input, textarea { font: inherit; }
  input:focus, textarea:focus { outline: none; }

  #app { position: fixed; inset: 0; height: 100vh; height: 100dvh; overflow: hidden; }

  /* ============ 状态栏 ============ */
  .statusbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--sb-h);
    padding: var(--safe-top) 24px 0;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; letter-spacing: .3px;
    color: #1c1c1e; z-index: 200; pointer-events: none;
    transition: color .3s ease;
  }
  .sb-right { display: flex; align-items: center; gap: 5px; }
  .sb-right svg { display: block; }

  /* ============ 主屏幕 ============ */
  #home {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--wall);
  }
  .home-scroll {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(var(--sb-h) + 22px) 18px 12px;
  }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 6px; }
  .app-cell {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 0; transition: transform .14s ease;
  }
  .app-cell:active { transform: scale(.9); }
  .app-icon {
    width: 58px; height: 58px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(20, 30, 60, .13);
    position: relative; overflow: hidden;
  }
  .app-icon::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 55%);
  }
  .app-icon svg { width: 30px; height: 30px; color: #fff; position: relative; z-index: 1; }
  .app-label {
    font-size: 11.5px; color: #2c2c30; letter-spacing: .2px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color .3s ease;
  }
  .page-dots { display: flex; justify-content: center; gap: 6px; padding: 14px 0 10px; }
  .page-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(60, 70, 90, .22); }
  .page-dots i.on { background: rgba(60, 70, 90, .55); }
  .dock-wrap { flex: 0 0 auto; padding: 0 14px calc(var(--safe-bottom) + 14px); }
  .dock {
    display: flex; justify-content: space-around; align-items: flex-start;
    padding: 12px 6px 10px;
    background: rgba(255, 255, 255, .58);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .7);
    border-radius: 28px; box-shadow: 0 6px 22px rgba(20, 30, 60, .1);
  }
  .dock .app-cell { flex: 1 1 0; }

  /* ============ 应用页 ============ */
  .app-page {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.32,.72,0,1);
    overflow: hidden;
  }
  .app-page.open { transform: translateX(0); }
  #app-chat, #app-add-contact, #app-moments { z-index: 20; }

  .nav {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: calc(var(--sb-h) + 6px) 12px 10px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.95);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  .nav-btn {
    width: 34px; height: 34px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; transition: background .15s ease;
  }
  .nav-btn:active { background: var(--soft); }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn.ghost { opacity: 0; pointer-events: none; }
  .nav-title { flex: 1; text-align: center; font-size: 16.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-actions { display: flex; align-items: center; gap: 2px; }

  .app-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(var(--safe-bottom) + 24px);
  }

  /* ============ 通用列表 / 表单 ============ */
  .group { padding: 8px 0; }
  .group-title { padding: 14px 18px 7px; font-size: 12.5px; color: var(--text-2); letter-spacing: .4px; }
  .row-item {
    position: relative; display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left; padding: 13px 18px;
    transition: background .15s ease;
  }
  .row-item:active { background: var(--soft); }
  .row-item + .row-item::before {
    content: ""; position: absolute; left: 52px; right: 0; top: 0;
    height: 1px; background: var(--line);
  }
  .row-item svg.lead { width: 20px; height: 20px; flex: 0 0 auto; }
  .row-text { flex: 1; min-width: 0; font-size: 15.5px; }
  .row-sub { font-size: 12.5px; color: var(--text-2); margin-top: 2px; line-height: 1.5; }
  .row-val { font-size: 14px; color: var(--text-2); }
  .row-item svg.chev { width: 17px; height: 17px; color: #c7c7cc; flex: 0 0 auto; }

  .avatar {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 17px; font-weight: 500;
    background-size: cover; background-position: center;
    overflow: hidden;
  }
  .avatar.sm { width: 32px; height: 32px; font-size: 13px; }
  .avatar.lg { width: 68px; height: 68px; font-size: 25px; }
  .avatar.xs { width: 26px; height: 26px; font-size: 11px; }

  /* ============ 空状态 ============ */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    padding: 64px 32px 40px; text-align: center;
  }
  .empty-icon {
    width: 64px; height: 64px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    background: var(--soft); color: var(--text-2); margin-bottom: 18px;
  }
  .empty-icon svg { width: 30px; height: 30px; }
  .empty-title { font-size: 15.5px; font-weight: 500; color: var(--text); }
  .empty-sub { font-size: 13px; color: var(--text-2); margin-top: 7px; line-height: 1.6; }

  /* ============ 美化 ============ */
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; padding: 6px 18px 18px; }
  .sw {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid transparent;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.04), 0 1px 4px rgba(0,0,0,.08);
    position: relative; transition: transform .15s ease;
    background-size: cover; background-position: center;
  }
  .sw:active { transform: scale(.92); }
  .sw.on { border-color: var(--accent); }
  .sw.on::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 2px solid #fff; }
  .sw.upload {
    display: flex; align-items: center; justify-content: center;
    background: var(--soft); color: var(--text-2);
  }
  .sw.upload svg { width: 20px; height: 20px; }

  .profile-edit { display: flex; align-items: center; gap: 16px; padding: 18px 18px 10px; }
  .profile-edit .avatar { width: 64px; height: 64px; font-size: 24px; }
  .profile-meta { flex: 1; min-width: 0; }
  .profile-name-input {
    width: 100%; border: 0; background: none; font-size: 18px;
    font-weight: 600; padding: 0; color: var(--text);
  }
  .profile-hint { font-size: 12.5px; color: var(--text-2); margin-top: 5px; }

  .field-row { padding: 6px 18px 14px; }
  .field-row label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 7px; }
  .field-row input {
    width: 100%; padding: 11px 14px; border-radius: 11px;
    background: var(--soft); border: 0; font-size: 15px; color: var(--text);
  }

  /* ============ 字卡库 ============ */
  .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
  .card {
    border-radius: 16px; background: #fff; border: 1px solid var(--line);
    padding: 18px 14px 16px; text-align: center;
    box-shadow: 0 2px 10px rgba(20,30,60,.05);
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:active { transform: scale(.97); }
  .card.on { border-color: var(--accent); }
  .card .zi { font-size: 34px; font-weight: 600; letter-spacing: 2px; }
  .card .py { font-size: 12px; color: var(--text-2); margin-top: 4px; letter-spacing: .6px; }
  .card .meaning {
    font-size: 12px; color: var(--text-2); line-height: 1.5; margin-top: 8px;
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height .25s ease, opacity .25s ease;
  }
  .card.on .meaning { max-height: 90px; opacity: 1; }

  /* ============ 会话列表 ============ */
  .chat-item {
    position: relative; display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left; padding: 12px 16px;
    transition: background .15s ease;
  }
  .chat-item:active { background: var(--soft); }
  .chat-item + .chat-item::before {
    content: ""; position: absolute; left: 74px; right: 0; top: 0;
    height: 1px; background: var(--line);
  }
  .chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .chat-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chat-name { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-time { flex: 0 0 auto; font-size: 12px; color: var(--text-2); }
  .chat-prev { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    flex: 0 0 auto; min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 10px; background: #ff3b30; color: #fff;
    font-size: 12px; line-height: 20px; text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ============ 聊天详情 ============ */
  .messages {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px 14px 20px;
    background: var(--chat-bg);
    background-size: cover; background-position: center;
  }
  .time-divider { align-self: center; font-size: 11.5px; color: var(--text-2); padding: 2px 0; }
  .msg { display: flex; align-items: flex-end; gap: 8px; animation: pop .18s ease-out; max-width: 100%; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 9px 13px; border-radius: 16px;
    font-size: 15px; line-height: 1.45; word-break: break-word; white-space: pre-wrap;
  }
  .msg.them .bubble { background: #ffffff; border-bottom-left-radius: 5px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .msg.me .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }

  .composer {
    flex: 0 0 auto; display: flex; align-items: flex-end; gap: 10px;
    padding: 8px 12px calc(var(--safe-bottom) + 8px);
    border-top: 1px solid var(--line); background: #fff;
  }
  .composer textarea {
    flex: 1; min-width: 0; min-height: 38px; max-height: 120px;
    padding: 9px 13px; border: 0; border-radius: 19px;
    background: var(--soft); color: var(--text);
    font-size: 15px; line-height: 1.4; resize: none; outline: none; overflow-y: auto;
  }
  .send-btn {
    flex: 0 0 auto; width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--accent); color: #fff;
    transition: transform .15s ease;
  }
  .send-btn:active { transform: scale(.9); }
  .send-btn svg { width: 19px; height: 19px; }

  /* ============ 添加联系人 ============ */
  .ac-wrap { padding: 26px 22px; }
  .ac-avatar-row { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; }
  .ac-avatar-btn {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--soft); display: flex; align-items: center; justify-content: center;
    color: var(--text-2); overflow: hidden; background-size: cover; background-position: center;
    border: 0; transition: transform .15s ease;
  }
  .ac-avatar-btn:active { transform: scale(.94); }
  .ac-avatar-btn svg { width: 30px; height: 30px; }
  .ac-avatar-btn.has-img { font-size: 30px; color: #fff; font-weight: 500; }
  .ac-avatar-hint { font-size: 12.5px; color: var(--text-2); margin-top: 10px; }
  .ac-field { margin-bottom: 18px; }
  .ac-field label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; padding-left: 2px; }
  .ac-field input {
    width: 100%; padding: 13px 15px; border-radius: 12px;
    background: var(--soft); border: 0; font-size: 15px; color: var(--text);
  }
  .ac-save {
    width: 100%; margin-top: 12px; padding: 14px;
    border-radius: 13px; background: var(--accent); color: #fff;
    font-size: 15.5px; font-weight: 500;
    transition: opacity .15s ease, transform .15s ease;
  }
  .ac-save:active { transform: scale(.98); opacity: .9; }

  /* ============ 朋友圈 ============ */
  .moments-hero {
    position: relative; height: 240px;
    background: var(--moments-bg);
    background-size: cover; background-position: center;
    display: flex; align-items: flex-end; padding: 0 18px 16px;
  }
  .moments-hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.28) 100%);
  }
  .moments-me {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 12px;
  }
  .moments-me .avatar { width: 58px; height: 58px; font-size: 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2); border: 2px solid rgba(255,255,255,.85); }
  .moments-me-name { font-size: 17px; font-weight: 600; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .moments-empty { padding: 44px 28px; text-align: center; }
  .moments-empty p { margin: 0 0 6px; font-size: 14px; color: var(--text-2); }
  .moments-empty p:first-child { font-size: 15.5px; color: var(--text); font-weight: 500; }

  /* ============ 音乐 ============ */
  .player { padding: 30px 28px calc(var(--safe-bottom) + 26px); display: flex; flex-direction: column; align-items: center; }
  .cover {
    width: 100%; max-width: 260px; aspect-ratio: 1 / 1; border-radius: 20px;
    background: linear-gradient(150deg, #4a4a55, #1c1c1e 70%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 40px rgba(20,30,60,.24);
  }
  .cover svg { width: 66px; height: 66px; color: rgba(255,255,255,.9); }
  .song-title { font-size: 20px; font-weight: 600; margin-top: 28px; }
  .song-artist { font-size: 14px; color: var(--text-2); margin-top: 5px; }
  .progress-wrap { width: 100%; margin-top: 26px; }
  .progress-bar { height: 4px; border-radius: 2px; background: #e6e6ea; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width .4s linear; }
  .time-row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-2); margin-top: 7px; }
  .controls { display: flex; align-items: center; gap: 34px; margin-top: 30px; }
  .ctrl { display: flex; align-items: center; justify-content: center; color: var(--text); }
  .ctrl svg { width: 26px; height: 26px; }
  .ctrl.play { width: 62px; height: 62px; border-radius: 50%; background: var(--accent); color: #fff;
    transition: transform .15s ease; }
  .ctrl.play:active { transform: scale(.93); }
  .ctrl.play svg { width: 26px; height: 26px; }

  /* ============ 经期 ============ */
  .cal { padding: 18px 18px 6px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-title { font-size: 16.5px; font-weight: 600; }
  .cal-nav { display: flex; gap: 4px; }
  .cal-nav button { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .cal-nav button:active { background: var(--soft); }
  .cal-nav svg { width: 18px; height: 18px; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .cal-week span { text-align: center; font-size: 11.5px; color: var(--text-2); padding: 4px 0; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; border-radius: 50%; color: var(--text); position: relative; }
  .cal-day.empty { visibility: hidden; }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 600; }
  .cal-day.period { background: #ffd7de; color: #c9184a; }
  .cal-day.period.today { box-shadow: inset 0 0 0 1.5px #c9184a; }
  .cal-day.predicted { background: #ffeef2; color: #d9708a; }
  .stat-row { display: flex; gap: 12px; padding: 12px 18px 4px; }
  .stat { flex: 1; border-radius: 14px; padding: 14px 12px; text-align: center; background: var(--soft); }
  .stat .num { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
  .stat .lbl { font-size: 11.5px; color: var(--text-2); margin-top: 4px; }

  /* ============ 倒数日 ============ */
  .evt { display: flex; align-items: center; gap: 14px; padding: 16px 18px; position: relative; }
  .evt + .evt::before { content: ""; position: absolute; left: 18px; right: 0; top: 0; height: 1px; background: var(--line); }
  .evt-icon { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center; }
  .evt-icon svg { width: 22px; height: 22px; color: #fff; }
  .evt-main { flex: 1; min-width: 0; }
  .evt-name { font-size: 15.5px; font-weight: 500; }
  .evt-date { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
  .evt-days { flex: 0 0 auto; text-align: right; }
  .evt-days b { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .evt-days span { display: block; font-size: 11px; color: var(--text-2); margin-top: 1px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">

  <!-- ===== 状态栏 ===== -->
  <div class="statusbar">
    <span id="sb-time">9:41</span>
    <span class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
        <rect x="0" y="8" width="3" height="4" rx="1"/>
        <rect x="5" y="5.5" width="3" height="6.5" rx="1"/>
        <rect x="10" y="3" width="3" height="9" rx="1"/>
        <rect x="15" y="0" width="3" height="12" rx="1"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M1 4.2a11 11 0 0 1 14 0"/>
        <path d="M3.6 7a7 7 0 0 1 8.8 0"/>
        <circle cx="8" cy="10.2" r="1" fill="currentColor" stroke="none"/>
      </svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none">
        <rect x="0.7" y="0.7" width="21" height="11.6" rx="3.2" stroke="currentColor" stroke-width="1.2" opacity="0.42"/>
        <rect x="2.4" y="2.4" width="15" height="8.2" rx="2" fill="currentColor"/>
        <path d="M23.6 4.4v4.2a2.2 2.2 0 0 0 0-4.2z" fill="currentColor" opacity="0.42"/>
      </svg>
    </span>
  </div>

  <!-- ===== 主屏幕 ===== -->
  <div id="home">
    <div class="home-scroll">
      <div class="grid" id="home-grid"></div>
      <div class="page-dots"><i class="on"></i><i></i></div>
    </div>
    <div class="dock-wrap">
      <div class="dock" id="dock"></div>
    </div>
  </div>

  <!-- ===== 设置 ===== -->

  /* ================= 图片压缩 ================= */
  function compressImage(file, size, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext('2d');
        var scale = Math.max(size / img.width, size / img.height);
        var w = img.width * scale;
        var h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        try {
          cb(canvas.toDataURL('image/jpeg', 0.82));
        } catch (err) {
          cb(e.target.result);
        }
      };
      img.onerror = function () { cb(e.target.result); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderMessages() {
    var chat = state.currentChat;
    if (!chat) return;
    var box = $('#messages');
    var me = myPerson();
    var html = '';
    var prev = null;

    if (!chat.messages.length) {
      html = '<div class="time-divider">还没有消息，发送第一条吧</div>';
    } else {
      chat.messages.forEach(function (m) {
        if (prev === null || toMin(m.time) - toMin(prev) >= 5 || toMin(m.time) < toMin(prev)) {
          html += '<div class="time-divider">' + esc(m.time) + '</div>';
        }
        prev = m.time;

        if (m.from === 'me') {
          html += '<div class="msg me">' +
            '<div class="bubble">' + esc(m.text) + '</div>' +
            avatarHTML(me, 'sm') +
          '</div>';
        } else {
          html += '<div class="msg them">' +
            avatarHTML(chat, 'sm') +
            '<div class="bubble">' + esc(m.text) + '</div>' +
          '</div>';
        }
      });
    }

    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
  }

  function autoGrow() {
    var el = $('#msg-input');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function sendMessage() {
    var input = $('#msg-input');
    var text = input.value.trim();
    var chat = state.currentChat;
    if (!text || !chat) return;

    var t = nowTime();
    chat.messages.push({ from: 'me', text: text, time: t });
    chat.time = t;

    input.value = '';
    autoGrow();
    renderMessages();
    renderAppList(state.currentApp);

    clearTimeout(chat._timer);
    chat._timer = setTimeout(function () {
      var reply = REPLIES[Math.floor(Math.random() * REPLIES.length)];
      var rt = nowTime();
      chat.messages.push({ from: 'them', text: reply, time: rt });
      chat.time = rt;

      if (state.currentChat && state.currentChat.id === chat.id) {
        renderMessages();
      } else {
        chat.unread = (chat.unread || 0) + 1;
      }
      renderAppList(state.currentApp);
      saveStore();
    }, 900 + Math.random() * 700);

    saveStore();
  }

  }

  /* ================= 字卡库 ================= */
  function renderCards() {
    $('#cards-grid').innerHTML = CARDS.map(function (c, i) {
      return '<button class="card" type="button" data-card="' + i + '">' +
        '<div class="zi">' + esc(c.zi) + '</div>' +
        '<div class="py">' + esc(c.py) + '</div>' +
        '<div class="meaning">' + esc(c.mean) + '</div>' +
      '</button>';
    }).join('');
  }

  /* ================= 音乐 ================= */
  function fmtTime(sec) {
    return Math.floor(sec / 60) + ':' + ('0' + Math.floor(sec % 60)).slice(-2);
  }

  function updateProgress() {
    var pct = Math.min(100, (state.pos / MUSIC_LEN) * 100);
    $('#progress-fill').style.width = pct + '%';
    $('#t-cur').textContent = fmtTime(state.pos);
  }

  function toggleMusic() {
    var icon = $('#play-icon');
    state.playing = !state.playing;
    if (state.playing) {
      icon.innerHTML = '<path d="M7.5 5h3.5v14H7.5zM13 5h3.5v14H13z"/>';
      state.timer = setInterval(function () {
        state.pos += 1;
        if (state.pos >= MUSIC_LEN) state.pos = 0;
        updateProgress();
      }, 1000);
    } else {
      icon.innerHTML = '<path d="M8 5.5v13l11-6.5z"/>';
      clearInterval(state.timer);
    }
  }

  /* ================= 经期 ================= */
  function renderPeriod() {
    var d = state.calDate;
    var y = d.getFullYear();
    var m = d.getMonth();

    $('#cal-title').textContent = y + '年' + (m + 1) + '月';

    var firstDay = new Date(y, m, 1).getDay();
    var total = new Date(y, m + 1, 0).getDate();
    var today = new Date();

    var html = '';
    for (var i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';

    for (var day = 1; day <= total; day++) {
      var cls = 'cal-day';
      var isToday = (today.getFullYear() === y && today.getMonth() === m && today.getDate() === day);
      var isPeriod = day >= 12 && day <= 16;
      var isPred = day >= 9 && day <= 11;

      if (isPeriod) cls += ' period';
      else if (isPred) cls += ' predicted';
      if (isToday) cls += ' today';

      html += '<div class="' + cls + '">' + day + '</div>';
    }
    $('#cal-days').innerHTML = html;

    var nextStart = new Date(today.getFullYear(), today.getMonth(), 16);
    if (today.getDate() > 16) nextStart = new Date(today.getFullYear(), today.getMonth() + 1, 16);
    var diff = Math.ceil((nextStart - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
    $('#stat-next').textContent = Math.max(0, diff);

    var cycleDay = today.getDate() >= 16 ? (today.getDate() - 15) : (today.getDate() + 15);
    $('#stat-day').textContent = cycleDay;
  }

  /* ================= 倒数日 ================= */
  function renderEvents() {
    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var list = EVENTS.map(function (e) {
      var parts = e.date.split('-');
      var target = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      var days = Math.round((target - today) / 86400000);
      return { name: e.name, date: e.date, color: e.color, icon: e.icon, days: days };
    }).sort(function (a, b) { return a.days - b.days; });

    $('#evt-list').innerHTML = list.map(function (e) {
      var label = e.days >= 0 ? '天后' : '天前';
      var num = Math.abs(e.days);
      return '<div class="evt">' +
        '<span class="evt-icon" style="background:' + e.color + '">' + e.icon + '</span>' +
        '<div class="evt-main">' +
          '<div class="evt-name">' + esc(e.name) + '</div>' +
          '<div class="evt-date">' + esc(e.date) + '</div>' +
        '</div>' +
        '<div class="evt-days"><b>' + num + '</b><span>' + label + '</span></div>' +
      '</div>';
    }).join('');
  }

  /* ================= 全局事件 ================= */
  function bind() {
    document.addEventListener('click', function (e) {
      // 打开应用
      var cell = e.target.closest('.app-cell');
      if (cell && cell.dataset.app) {
        openApp(cell.dataset.app);
        return;
      }

      // 关闭当前页
      var closeBtn = e.target.closest('[data-close]');
      if (closeBtn) {
        var page = closeBtn.closest('.app-page');
        if (page) {
          if (page.id === 'app-add-contact' && state.currentChat) {
            // 从编辑状态返回聊天
            closePage('app-add-contact');
            openPage('app-chat');
          } else {
            closePage(page.id);
            if (page.id === 'app-chat') state.currentChat = null;
          }
        }
        return;
      }

      // 会话
      var chatItem = e.target.closest('.chat-item');
      if (chatItem) {
        openChat(chatItem.dataset.app, chatItem.dataset.chat);
        return;
      }

      // 壁纸
      var sw = e.target.closest('[data-wall]');
      if (sw) {
        applyWall(Number(sw.dataset.wall));
        renderBeautify();
        return;
      }

      // 聊天背景
      var cb = e.target.closest('[data-chatbg]');
      if (cb) {
        applyChatBg(CHAT_BGS[Number(cb.dataset.chatbg)], false);
        renderBeautify();
        return;
      }

      // 朋友圈背景
      var mb = e.target.closest('[data-momentsbg]');
      if (mb) {
        applyMomentsBg(MOMENTS_BGS[Number(mb.dataset.momentsbg)], false);
        renderBeautify();
        renderMoments();
        return;
      }

      // 字卡
      var card = e.target.closest('.card');
      if (card) {
        card.classList.toggle('on');
        return;
      }

      // 添加按钮（短信 / 信箱）
      var addBtn = e.target.closest('[data-add]');
      if (addBtn) {
        openAddContact(addBtn.dataset.add);
        return;
      }

      // 微信添加好友
      if (e.target.closest('#wx-add-btn')) {
        openAddContact('wechat');
        return;
      }

      // 朋友圈入口
      if (e.target.closest('#wx-moments-btn')) {
        renderMoments();
        openPage('app-moments');
        return;
      }

      // 聊天返回
      if (e.target.closest('#chat-back')) {
        closeChat();
        return;
      }

      // 聊天编辑（对方资料）
      if (e.target.closest('#chat-edit-btn')) {
        if (state.currentChat) {
          openEditContact(state.currentApp, state.currentChat);
          closePage('app-chat');
        }
        return;
      }

      // 我的头像上传
      if (e.target.closest('#my-avatar-btn')) {
        var f = $('#file-avatar');
        f.dataset.target = 'my';
        f.click();
        return;
      }

      // 添加联系人头像上传
      if (e.target.closest('#ac-avatar-btn')) {
        var f2 = $('#file-avatar');
        f2.dataset.target = 'draft';
        f2.click();
        return;
      }

      // 聊天背景上传
      if (e.target.closest('#chatbg-upload')) {
        var f3 = $('#file-avatar');
        f3.dataset.target = 'chatbg';
        f3.click();
        return;
      }

      // 朋友圈背景上传
      if (e.target.closest('#momentsbg-upload')) {
        var f4 = $('#file-avatar');
        f4.dataset.target = 'momentsbg';
        f4.click();
        return;
      }

      // 保存联系人
      if (e.target.closest('#ac-save')) {
        saveContact();
        return;
      }
    });

    // 文件选择
    $('#file-avatar').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var target = e.target.dataset.target;
      var self = this;

      if (target === 'my') {
        compressImage(file, 160, function (dataUrl) {
          store.settings.myAvatar = dataUrl;
          saveStore();
          renderBeautify();
          renderMoments();
          if (state.currentChat) renderMessages();
        });
      } else if (target === 'draft') {
        compressImage(file, 160, function (dataUrl) {
          if (state.draft) {
            state.draft.avatar = dataUrl;
            renderAddForm();
          }
        });
      } else if (target === 'chatbg') {
        compressImage(file, 800, function (dataUrl) {
          applyChatBg('url(' + dataUrl + ')', true);
          renderBeautify();
        });
      } else if (target === 'momentsbg') {
        compressImage(file, 800, function (dataUrl) {
          applyMomentsBg('url(' + dataUrl + ')', true);
          renderBeautify();
          renderMoments();
        });
      }

      self.value = '';
    });

    // 我的昵称
    $('#my-name-input').addEventListener('input', function () {
      store.settings.myName = this.value;
      saveStore();
      renderMoments();
      if (state.currentChat) renderMessages();
    });

    // 默认好友名
    $('#default-friend-input').addEventListener('input', function () {
      store.settings.defaultFriendName = this.value || '梦';
      saveStore();
    });

    // 发送
    $('#composer').addEventListener('submit', function (e) {
      e.preventDefault();
      sendMessage();
    });

    var input = $('#msg-input');
    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });
    input.addEventListener('focus', function () {
      setTimeout(function () {
        var box = $('#messages');
        box.scrollTop = box.scrollHeight;
      }, 260);
    });

    // 音乐
    $('#play-btn').addEventListener('click', toggleMusic);

    // 日历切换
    $('#cal-prev').addEventListener('click', function () {
      state.calDate.setMonth(state.calDate.getMonth() - 1);
      renderPeriod();
    });
    $('#cal-next').addEventListener('click', function () {
      state.calDate.setMonth(state.calDate.getMonth() + 1);
      renderPeriod();
    });
  }

  /* ================= 初始化 ================= */
  function init() {
    renderHome();
    bind();
    tickClock();
    setInterval(tickClock, 20000);

    // 应用已保存的设置
    applyWall(store.settings.wall || 0);
    document.documentElement.style.setProperty('--chat-bg', store.settings.chatBg || '#f4f4f6');
    document.documentElement.style.setProperty('--moments-bg', store.settings.momentsBg || MOMENTS_BGS[0]);

    // 音乐初始
    $('#t-all').textContent = fmtTime(MUSIC_LEN);
    updateProgress();

    // 微信空状态
    renderAppList('wechat');
    renderAppList('sms');
    renderAppList('mail');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
