<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>私聊</title>
<style>
*,*::before,*::after{box-sizing:border-box;}

:root{
  --bg:#0b0b0d;
  --bg-2:#141418;
  --bg-3:#1b1b22;
  --fg:#ececf1;
  --muted:#8a8a94;
  --line:#25252e;
  --accent:#4f8cff;
  --accent-hover:#3b7cf0;
  --bubble-me:#2f6de0;
  --bubble-them:#1e1e26;
  --danger:#ff5a5a;
  --radius:18px;
}

html,body{height:100%;}

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
       "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  overflow:hidden;
}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea,select{font:inherit;color:inherit;}

/* ---------- 视图切换 ---------- */
.view{position:fixed;inset:0;display:flex;flex-direction:column;}
.view[hidden]{display:none;}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
  background:rgba(11,11,13,.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.avatar{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#4f8cff,#9b5cff);
  color:#fff;font-weight:600;font-size:15px;
  flex:0 0 auto;
  user-select:none;
}
.peer{display:flex;align-items:center;gap:10px;min-width:0;}
.peer-meta{display:flex;flex-direction:column;min-width:0;}
.peer-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.peer-sub{font-size:12px;color:var(--muted);}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--muted);font-size:18px;
  flex:0 0 auto;
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--bg-3);color:var(--fg);}
#openSettings{margin-left:auto;}

/* ---------- 消息区 ---------- */
.messages{
  flex:1 1 auto;
  overflow-y:auto;
  padding:16px;
  display:flex;flex-direction:column;gap:8px;
  -webkit-overflow-scrolling:touch;
}

.msg{
  display:flex;flex-direction:column;
  max-width:min(78%,600px);
  animation:pop .18s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.msg.me{align-self:flex-end;align-items:flex-end;}
.msg.them{align-self:flex-start;align-items:flex-start;}

.bubble{
  padding:9px 13px;
  border-radius:var(--radius);
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:anywhere;
  line-height:1.5;
}
.msg.me .bubble{background:var(--bubble-me);color:#fff;border-bottom-right-radius:6px;}
.msg.them .bubble{background:var(--bubble-them);color:var(--fg);border-bottom-left-radius:6px;}

.msg time{
  margin-top:3px;padding:0 4px;
  font-size:11px;color:var(--muted);
  user-select:none;
}

.sticker-img{
  max-width:140px;max-height:140px;
  border-radius:12px;display:block;
  background:var(--bg-3);
}

.letter-card{
  padding:14px 16px;
  border-radius:var(--radius);
  background:linear-gradient(135deg,#2a1f3d,#1c2233);
  border:1px solid #3a3350;
  max-width:100%;
}
.letter-title{font-weight:600;margin-bottom:6px;font-size:14px;color:#c9b6ff;}
.letter-body{white-space:pre-wrap;word-break:break-word;color:#e8e3ff;font-size:14px;line-height:1.6;}

.typing{
  display:flex;gap:4px;
  padding:12px 14px;
  background:var(--bubble-them);
  border-radius:var(--radius);
  border-bottom-left-radius:6px;
  width:fit-content;
  align-self:flex-start;
}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}

/* ---------- 输入区 ---------- */
.composer-wrap{
  flex:0 0 auto;
  border-top:1px solid var(--line);
  background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom);
}
.composer{
  display:flex;align-items:flex-end;gap:8px;
  padding:10px 12px;
}
#input{
  flex:1 1 auto;
  max-height:140px;min-height:40px;
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--bg-2);
  color:var(--fg);
  line-height:1.4;
  resize:none;outline:none;
  transition:border-color .15s;
}
#input:focus{border-color:var(--accent);}
.send-btn{
  flex:0 0 auto;
  padding:9px 16px;
  border-radius:20px;
  background:var(--accent);
  color:#fff;font-weight:600;
  transition:opacity .15s,background .15s;
}
.send-btn:hover:not(:disabled){background:var(--accent-hover);}
.send-btn:disabled{opacity:.35;cursor:not-allowed;}

/* ---------- 表情面板 ---------- */
.sticker-panel{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(48px,1fr));
  gap:4px;
  max-height:220px;
  overflow-y:auto;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  background:var(--bg-2);
}
.sticker-panel[hidden]{display:none;}
.sticker-item{
  aspect-ratio:1;
  display:grid;place-items:center;
  border-radius:10px;
  font-size:24px;
  padding:0;
  transition:background .12s;
}
.sticker-item:hover{background:var(--bg-3);}
.sticker-item img{width:100%;height:100%;object-fit:contain;border-radius:10px;}

/* ---------- 设置页 ---------- */
#settings{background:var(--bg);}
.settings-header{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.settings-header h1{font-size:16px;margin:0;font-weight:600;}

.tabs{
  display:flex;gap:4px;
  padding:8px 12px;
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  flex:0 0 auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:7px 14px;
  border-radius:16px;
  font-size:14px;
  color:var(--muted);
  white-space:nowrap;
  transition:background .15s,color .15s;
}
.tab.active{background:var(--bg-3);color:var(--fg);font-weight:500;}

.panels{
  flex:1 1 auto;
  overflow-y:auto;
  padding:16px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.panel{display:none;}
.panel.active{display:block;}

.sec-title{
  font-size:13px;margin:0 0 12px;
  color:var(--muted);font-weight:500;
  letter-spacing:.02em;
}
.divider{
  height:1px;background:var(--line);
  margin:20px 0;
  border:none;
}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:13px;color:var(--muted);}
.field input,.field textarea,.field select{
  padding:9px 12px;
  background:var(--bg-2);
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
  transition:border-color .15s;
  width:100%;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:70px;line-height:1.5;}
.field-row{display:flex;gap:12px;}
.field-row > .field{flex:1;min-width:0;}
.inline-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.inline-row > span{font-size:15px;}

.btn{
  padding:9px 16px;
  border-radius:10px;
  background:var(--bg-3);
  font-size:14px;
  transition:background .15s;
}
.btn:hover{background:#2a2a33;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-hover);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.danger:hover{background:rgba(255,90,90,.1);}
.btn.block{width:100%;}

.rule{
  background:var(--bg-2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
}
.rule-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.rule-row input[type=text]{
  flex:1 1 140px;min-width:0;
  padding:7px 10px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:8px;
  outline:none;
  transition:border-color .15s;
}
.rule-row input[type=text]:focus{border-color:var(--accent);}
.rule-row select{
  padding:7px 8px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:8px;
  outline:none;
}
.rule-replies{
  width:100%;
  margin-top:8px;
  padding:8px 10px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:8px;
  resize:vertical;
  min-height:56px;
  line-height:1.5;
  outline:none;
  transition:border-color .15s;
}
.rule-replies:focus{border-color:var(--accent);}

.switch{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch span{
  position:absolute;inset:0;
  background:var(--bg-3);
  border-radius:24px;
  transition:background .2s;
  cursor:pointer;
}
.switch span::before{
  content:"";position:absolute;
  width:18px;height:18px;
  left:3px;top:3px;
  background:#fff;border-radius:50%;
  transition:transform .2s;
}
.switch input:checked + span{background:var(--accent);}
.switch input:checked + span::before{transform:translateX(18px);}

.storage-bar{
  height:8px;border-radius:4px;
  background:var(--bg-3);
  overflow:hidden;
  margin:8px 0 16px;
}
.storage-bar > div{
  height:100%;width:0;
  background:linear-gradient(90deg,#4f8cff,#9b5cff);
  border-radius:4px;
  transition:width .3s;
}
.stat-row{
  display:flex;justify-content:space-between;
  padding:7px 0;font-size:14px;
}
.stat-row span:last-child{color:var(--muted);}

.empty-hint{
  color:var(--muted);font-size:13px;
  text-align:center;padding:20px 0;
}
</style>
</head>
<body>

<!-- ===================== 主页面 ===================== -->
<div id="app" class="view">

  <header class="topbar">
    <div class="peer">
      <div class="avatar" id="peerAvatar">对</div>
      <div class="peer-meta">
        <span class="peer-name" id="peerName">对方</span>
        <span class="peer-sub">私人空间 · 仅此一处</span>
      </div>
    </div>
    <button class="icon-btn" id="openSettings" type="button" aria-label="设置">⚙</button>
  </header>

  <main id="messages" class="messages"></main>

  <div class="composer-wrap">
    <div class="sticker-panel" id="stickerPanel" hidden></div>
    <form class="composer" id="composer" autocomplete="off">
      <button class="icon-btn" id="toggleStickers" type="button" aria-label="表情">😊</button>
      <textarea id="input" rows="1" placeholder="输入消息…"
                enterkeyhint="send" autocomplete="off"></textarea>
      <button class="send-btn" id="sendBtn" type="submit" disabled>发送</button>
    </form>
  </div>

</div>

<!-- ===================== 设置页 ===================== -->
<div id="settings" class="view" hidden>

  <header class="settings-header">
    <button class="icon-btn" id="closeSettings" type="button" aria-label="返回">←</button>
    <h1>设置</h1>
  </header>

  <nav class="tabs">
    <button class="tab active" type="button" data-tab="autoreply">自动回复</button>
    <button class="tab" type="button" data-tab="stickers">表情包</button>
    <button class="tab" type="button" data-tab="letters">信件</button>
    <button class="tab" type="button" data-tab="storage">存储</button>
  </nav>

  <div class="panels">

    <!-- ---------- 自动回复 ---------- -->
    <section class="panel active" data-panel="autoreply">

      <h3 class="sec-title">对话设置</h3>

      <div class="field">
        <label>对方名称</label>
        <input type="text" id="peerNameInput" maxlength="20" placeholder="对方">
      </div>

      <div class="field">
        <label>对方头像文字（1–2 个字）</label>
        <input type="text" id="peerAvatarInput" maxlength="2" placeholder="对">
      </div>

      <hr class="divider">

      <h3 class="sec-title">自动回复</h3>

      <div class="inline-row">
        <span>启用自动回复</span>
        <label class="switch"><input type="checkbox" id="arEnabled"><span></span></label>
      </div>

      <div class="field-row">
        <div class="field">
          <label>延迟最小值（毫秒）</label>
          <input type="number" id="arDelayMin" min="0" max="10000" step="100">
        </div>
        <div class="field">
          <label>延迟最大值（毫秒）</label>
          <input type="number" id="arDelayMax" min="0" max="10000" step="100">
        </div>
      </div>

      <div class="field">
        <label>兜底回复（没有规则命中时使用，每行一条，随机选；留空则不回复）</label>
        <textarea id="arFallback" rows="3" placeholder="嗯…&#10;我在听。"></textarea>
      </div>

      <hr class="divider">

      <h3 class="sec-title">回复规则</h3>
      <div id="ruleList"></div>
      <button class="btn primary block" id="addRule" type="button">+ 新增规则</button>

    </section>

    <!-- ---------- 表情包 ---------- -->
    <section class="panel" data-panel="stickers">

      <h3 class="sec-title">上传自定义表情</h3>
      <div class="field">
        <label>支持 PNG / GIF / WebP，建议小于 256KB</label>
        <input type="file" id="stickerUpload" accept="image/*">
      </div>

      <hr class="divider">

      <h3 class="sec-title">我的表情</h3>
      <div id="stickerList" class="sticker-panel"
           style="border:none;padding:0;background:transparent;max-height:none;"></div>

      <hr class="divider">

      <h3 class="sec-title">内置表情（点击插入输入框）</h3>
      <div id="builtinList" class="sticker-panel"
           style="border:none;padding:0;background:transparent;max-height:none;"></div>

    </section>

    <!-- ---------- 信件 ---------- -->
    <section class="panel" data-panel="letters">

      <h3 class="sec-title">写一封信</h3>

      <div class="field">
        <label>标题</label>
        <input type="text" id="letterTitle" maxlength="60" placeholder="例如：给三个月后的自己">
      </div>

      <div class="field">
        <label>内容</label>
        <textarea id="letterContent" rows="4" maxlength="5000"
                  placeholder="写点什么…"></textarea>
      </div>

      <div class="field">
        <label>开启时间</label>
        <input type="datetime-local" id="letterOpenAt">
      </div>

      <button class="btn primary block" id="addLetter" type="button">封存这封信</button>

      <hr class="divider">

      <h3 class="sec-title">我的信件</h3>
      <div id="letterList"></div>

    </section>

    <!-- ---------- 存储 ---------- -->
    <section class="panel" data-panel="storage">

      <h3 class="sec-title">存储用量</h3>

      <div class="stat-row"><span>已用空间</span><span id="stUsage">—</span></div>
      <div class="storage-bar"><div id="stBar"></div></div>
      <div class="stat-row"><span>可用配额</span><span id="stQuota">—</span></div>
      <div class="stat-row"><span>持久化存储</span><span id="stPersist">—</span></div>
      <div class="stat-row"><span>消息总数</span><span id="stMsgs">—</span></div>

      <button class="btn block" id="requestPersist" type="button"
              style="margin:12px 0;">申请持久化存储</button>

      <hr class="divider">

      <h3 class="sec-title">数据管理</h3>

      <button class="btn block" id="exportData" type="button"
              style="margin-bottom:10px;">导出全部数据（JSON）</button>

      <button class="btn danger block" id="clearAll" type="button">清空所有数据</button>

      <p class="empty-hint" style="margin-top:20px;text-align:left;line-height:1.7;">
        数据只保存在这台设备的浏览器里，不会上传到任何服务器。<br>
        清理浏览器数据会一并删除，建议定期导出备份。
      </p>

    </section>

  </div>
</div>

<script>
(() => {
  'use strict';

  /* ============================================================
     常量
     ============================================================ */

  const DB_NAME = 'private-chat';
  const DB_VERSION = 1;
  const PAGE_SIZE = 60;

  const DEFAULT_SETTINGS = {
    peerName: '对方',
    peerAvatar: '对',
    autoReplyEnabled: true,
    delayMin: 600,
    delayMax: 1400,
    fallback: '',
  };

  const BUILTIN_EMOJI = [
    '😀','😄','😁','😊','🙂','😉','😍','😘','😜','🤔',
    '😅','😢','😭','😡','🥺','😴','🤗','🙃','😎','🤩',
    '👋','👍','👎','🙏','💪','❤️','💔','🎉','🔥','✨',
    '🌙','☀️','🍀','🌸','⭐','💤','😳','😇','🤝','👏'
  ];

  /* ============================================================
     小工具
     ============================================================ */

  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  const pad   = n => String(n).padStart(2, '0');
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const pickOne = arr =>
    (Array.isArray(arr) && arr.length) ? arr[Math.floor(Math.random() * arr.length)] : null;

  function clampInt(v, min, max, fallback) {
    const n = parseInt(v, 10);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  /* ============================================================
     IndexedDB 封装
     ============================================================ */

  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);

      req.onupgradeneeded = (e) => {
        const d = e.target.result;

        if (!d.objectStoreNames.contains('messages')) {
          const s = d.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
          s.createIndex('ts', 'ts');
        }
        if (!d.objectStoreNames.contains('autoreply')) {
          d.createObjectStore('autoreply', { keyPath: 'id', autoIncrement: true });
        }
        if (!d.objectStoreNames.contains('stickers')) {
          d.createObjectStore('stickers', { keyPath: 'id', autoIncrement: true });
        }
        if (!d.objectStoreNames.contains('letters')) {
          d.createObjectStore('letters', { keyPath: 'id', autoIncrement: true });
        }
        if (!d.objectStoreNames.contains('settings')) {
          d.createObjectStore('settings', { keyPath: 'key' });
        }
      };

      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  }

  const os = (name, mode = 'readonly') => db.transaction(name, mode).objectStore(name);

  const pr = (req) => new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });

  /* ============================================================
     设置
     ============================================================ */

  let settings = { ...DEFAULT_SETTINGS };

  async function loadSettings() {
    const row = await pr(os('settings').get('main'));
    if (row && row.value) settings = { ...DEFAULT_SETTINGS, ...row.value };
    return settings;
  }

  const saveSettings = () =>
    pr(os('settings', 'readwrite').put({ key: 'main', value: settings }));

  /* ============================================================
     消息读写
     ============================================================ */

  async function addMessage(m) {
    const id = await pr(os('messages', 'readwrite').add(m));
    return { ...m, id };
  }

  function pageMessages(before) {
    return new Promise((resolve, reject) => {
      const out = [];
      const range = (before === null || before === undefined)
        ? null
        : IDBKeyRange.upperBound(before, true);

      const req = os('messages').openCursor(range, 'prev');

      req.onsuccess = (e) => {
        const cur = e.target.result;
        if (!cur || out.length >= PAGE_SIZE) {
          resolve(out.reverse());
          return;
        }
        out.push(cur.value);
        cur.continue();
      };

      req.onerror = () => reject(req.error);
    });
  }

  /* ============================================================
     DOM 引用
     ============================================================ */

  const appEl        = $('#app');
  const settingsEl   = $('#settings');
  const messagesEl   = $('#messages');
  const composerEl   = $('#composer');
  const inputEl      = $('#input');
  const sendBtn      = $('#sendBtn');
  const stickerPanel = $('#stickerPanel');

  const state = {
    oldestId: null,
    hasMore: true,
    loading: false,
    typingEl: null,
    replyBusy: false,
  };

  /* ============================================================
     格式化
     ============================================================ */

  function fmtTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (d.toDateString() === now.toDateString()) return t;
    return `${d.getMonth() + 1}月${d.getDate()}日 ${t}`;
  }

  function fmtFull(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} `
         + `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function countdown(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    if (d > 0) return `${d} 天 ${h} 小时`;
    if (h > 0) return `${h} 小时 ${m} 分`;
    return `${m} 分`;
  }

  function fmtBytes(n) {
    if (!n) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    let v = n;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return v.toFixed(v >= 100 || i === 0 ? 0 : 1) + ' ' + units[i];
  }

    const el = document.createElement('div');
    el.className = 'msg ' + (m.role === 'me' ? 'me' : 'them');

      title.textContent = '📮 ' + (m.title || '一封信');

      card.append(title, body);

    } else {

  const isNearBottom = () =>
    messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;

  const scrollToBottom = (smooth = false) => {
    messagesEl.scrollTo({
      top: messagesEl.scrollHeight,
      behavior: smooth ? 'smooth' : 'auto',
    });

    const stick = isNearBottom();
    messagesEl.appendChild(buildMessageEl(m));
    if (stick || m.role === 'me') scrollToBottom();

  /* ============================================================
     分页加载
     ============================================================ */

  async function initChat() {
    const msgs = await pageMessages(null);

    state.oldestId = msgs.length ? msgs[0].id : null;
    state.hasMore  = msgs.length === PAGE_SIZE;

    const frag = document.createDocumentFragment();
    for (const m of msgs) frag.appendChild(buildMessageEl(m));

    messagesEl.replaceChildren(frag);
    scrollToBottom();
  }

  async function loadOlder() {
    if (state.loading || !state.hasMore) return;
    state.loading = true;

    try {
      const msgs = await pageMessages(state.oldestId);
      if (!msgs.length) { state.hasMore = false; return; }

      const prevHeight = messagesEl.scrollHeight;
      const prevTop    = messagesEl.scrollTop;

      const frag = document.createDocumentFragment();
      for (const m of msgs) frag.appendChild(buildMessageEl(m));
      messagesEl.insertBefore(frag, messagesEl.firstChild);

      state.oldestId = msgs[0].id;
      if (msgs.length < PAGE_SIZE) state.hasMore = false;

      messagesEl.scrollTop = prevTop + (messagesEl.scrollHeight - prevHeight);

    } finally {
      state.loading = false;
    }
  }

  messagesEl.addEventListener('scroll', () => {
    if (messagesEl.scrollTop < 80) loadOlder();
  }, { passive: true });

  /* ============================================================
     自动回复
     ============================================================ */

  function matchRule(rule, text) {
    const kws = String(rule.keyword || '')
      .split('|')
      .map(s => s.trim())
      .filter(Boolean);

    if (!kws.length) return false;

    const lower = text.toLowerCase();

    for (const kw of kws) {
      const k = kw.toLowerCase();

      if (rule.mode === 'exact') {
        if (lower === k) return true;

      } else if (rule.mode === 'regex') {
        try {
          if (new RegExp(kw, 'i').test(text)) return true;
        } catch { /* 无效正则，忽略 */ }

      } else {
        if (lower.includes(k)) return true;
      }
    }

    return false;
  }

  function showTyping() {
    if (state.typingEl) return;

    const el = document.createElement('div');
    el.className = 'typing';
    el.innerHTML = '<span></span><span></span><span></span>';

    messagesEl.appendChild(el);
    state.typingEl = el;

    if (isNearBottom()) scrollToBottom();
  }

  function hideTyping() {
    if (state.typingEl) {
      state.typingEl.remove();
      state.typingEl = null;
    }
  }

  async function maybeAutoReply(userText) {
    if (!settings.autoReplyEnabled) return;
    if (state.replyBusy) return;

    const rules = await pr(os('autoreply').getAll());

    let reply = null;

    for (const rule of rules) {
      if (rule.enabled === false) continue;
      if (matchRule(rule, userText)) {
        reply = pickOne(rule.replies);
        break;
      }
    }

    if (!reply && settings.fallback) {
      const lines = settings.fallback
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);
      if (lines.length) reply = pickOne(lines);
    }

    if (!reply) return;

    const spread = Math.max(0, settings.delayMax - settings.delayMin);
    const delay  = Math.max(0, settings.delayMin + Math.random() * spread);

    state.replyBusy = true;
    showTyping();

    try {
      await sleep(delay);
      hideTyping();

      const m = await addMessage({
        role: 'them',
        type: 'text',
        text: reply,
        ts: Date.now(),
      });

      appendMessageEl(m);

    } finally {
      state.replyBusy = false;
      hideTyping();
    }
  }

  async function renderLetters() {

    letters.sort((a, b) => a.openAt - b.openAt);

    const listEl = $('#letterList');
    listEl.replaceChildren();

    if (!letters.length) {

      return;
    }

    const now = Date.now();

    for (const l of letters) {
      const el = document.createElement('div');
      el.className = 'rule';

      const title = document.createElement('div');
      title.style.cssText = 'font-weight:600;font-size:14px;margin-bottom:4px;';
      title.textContent = (l.opened ? '📭 ' : '📮 ') + (l.title || '无标题');

      const meta = document.createElement('div');
      meta.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:10px;';

      const openDate = new Date(l.openAt);

      if (l.opened) {
        meta.textContent = '已于 ' + fmtFull(openDate) + ' 拆开';
      } else if (l.openAt > now) {
        meta.textContent =
          '将于 ' + fmtFull(openDate) + ' 开启 · 还有 ' + countdown(l.openAt - now);
      } else {
        meta.textContent = '已到期，可以拆开了';
      }

      const parts = [title, meta];

      if (l.opened) {
        const body = document.createElement('div');
        body.style.cssText =
          'font-size:13px;white-space:pre-wrap;margin-bottom:10px;' +
          'padding:10px;background:var(--bg);border-radius:8px;line-height:1.7;';
        body.textContent = l.content;
        parts.push(body);
      }

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';

      if (!l.opened && l.openAt <= now) {
        const openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.className = 'btn primary';
        openBtn.textContent = '拆开';
        openBtn.addEventListener('click', () => openLetter(l));
        actions.appendChild(openBtn);
      }

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn danger';
      delBtn.textContent = '删除';
      delBtn.addEventListener('click', async () => {
        if (!confirm('确定删除这封信？')) return;
        await pr(os('letters', 'readwrite').delete(l.id));
        renderLetters();
      });
      actions.appendChild(delBtn);

      parts.push(actions);
      el.append(...parts);
      listEl.appendChild(el);
    }
  }

    const openAt = new Date(openAtStr).getTime();

    if (openAt <= Date.now()) { alert('开启时间需要晚于当前时间'); return; }

    await pr(os('letters', 'readwrite').add({

      createdAt: Date.now(),

  async function renderStorage() {
    let usage = 0;
    let quota = 0;

    try {
      if (navigator.storage && navigator.storage.estimate) {
        const est = await navigator.storage.estimate();
        usage = est.usage || 0;
        quota = est.quota || 0;
      }
    } catch { /* 忽略 */ }

    $('#stUsage').textContent = fmtBytes(usage);
    $('#stQuota').textContent = quota ? fmtBytes(quota) : '未知';
    $('#stBar').style.width = quota
      ? Math.min(100, (usage / quota) * 100).toFixed(2) + '%'
      : '0%';

    let persisted = false;
    try {
      if (navigator.storage && navigator.storage.persisted) {
        persisted = await navigator.storage.persisted();
      }
    } catch { /* 忽略 */ }

    $('#stPersist').textContent = persisted ? '已启用' : '未启用';

    const total = await pr(os('messages').count());
    $('#stMsgs').textContent = total + ' 条';
  }

    const ok = await navigator.storage.persist();
    alert(ok
      ? '已获得持久化存储权限'

  async function renderRules() {
    const rules = await pr(os('autoreply').getAll());
    const listEl = $('#ruleList');
    listEl.replaceChildren();

    if (!rules.length) {
      const d = document.createElement('p');
      d.className = 'empty-hint';
      d.textContent = '还没有规则，点击下方按钮新增。';
      listEl.appendChild(d);

    for (const rule of rules) {
      listEl.appendChild(buildRuleEl(rule));
    }

  function buildRuleEl(rule) {
    const el = document.createElement('div');
    el.className = 'rule';
    el.dataset.id = rule.id;

    /* --- 第一行 --- */
    const row = document.createElement('div');
    row.className = 'rule-row';

    const kw = document.createElement('input');
    kw.type = 'text';
    kw.value = rule.keyword || '';
    kw.placeholder = '关键词，用 | 分隔';
    kw.addEventListener('change', () => saveRuleField(rule, 'keyword', kw.value));

    const mode = document.createElement('select');
    [['contains', '包含'], ['exact', '完全匹配'], ['regex', '正则']]
      .forEach(([v, label]) => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = label;
        if (rule.mode === v) o.selected = true;
        mode.appendChild(o);
      });
    mode.addEventListener('change', () => saveRuleField(rule, 'mode', mode.value));

    const sw = document.createElement('label');
    sw.className = 'switch';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = rule.enabled !== false;
    cb.addEventListener('change', () => saveRuleField(rule, 'enabled', cb.checked));

    const swSpan = document.createElement('span');
    sw.append(cb, swSpan);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'icon-btn';
    del.textContent = '🗑';
    del.style.cssText = 'width:32px;height:32px;font-size:15px;';
    del.addEventListener('click', async () => {
      await pr(os('autoreply', 'readwrite').delete(rule.id));
      renderRules();
    });

    row.append(kw, mode, sw, del);

    /* --- 回复列表 --- */
    const replies = document.createElement('textarea');
    replies.className = 'rule-replies';
    replies.placeholder = '回复内容，每行一条（随机选一条）';
    replies.value = (rule.replies || []).join('\n');
    replies.addEventListener('change', () => {
      const val = replies.value
        .split('\n')
        .map(s => s.trim())
        .filter(Boolean);
      saveRuleField(rule, 'replies', val);
    });

    el.append(row, replies);
    return el;
  }

  async function saveRuleField(rule, key, value) {
    rule[key] = value;
    await pr(os('autoreply', 'readwrite').put(rule));
  }

        enabled: true,
        replies: ['在的，怎么啦？', '我在呢 👋', '嗯，我在。'],
      },
      {
        keyword: '晚安|睡了|拜拜|再见',
        mode: 'contains',
        enabled: true,
        replies: ['晚安，做个好梦 🌙', '晚安，明天见。'],
      },
      {
        keyword: '累|好累|烦|难过|emo|不开心',
        mode: 'contains',
        enabled: true,
        replies: ['怎么了？跟我说说。', '辛苦啦，抱抱你。', '要不要先休息一会儿？'],
      },
      {
        keyword: '开心|高兴|太好了|哈哈',
        mode: 'contains',
        enabled: true,
        replies: ['听起来不错 😊', '真好，替你开心。'],
      },
    ];

    for (const s of seeds) {
      await pr(os('autoreply', 'readwrite').add(s));
    }
  }

  async function boot() {
    try {
      db = await openDB();
    } catch (err) {
      document.body.innerHTML =
        '<p style="padding:40px;color:#fff;font-size:15px;line-height:1.8;">' +
        '无法初始化本地数据库：' + err + '<br>' +
        '请确认没有在无痕模式 / 禁用存储的环境下打开。</p>';
      return;
    }

    await loadSettings();
    applyPeer();

    await seedRulesIfEmpty();

    resetLetterTime();

    await initChat();
    await renderStickers();

    inputEl.focus();

    /* 每 30 秒检查信件是否到期 */
    setInterval(() => {
      if (!settingsEl.hidden) {
        const active = $('.panel.active');
        if (active && active.dataset.panel === 'letters') renderLetters();
      }
    }, 30000);
  }

  boot();

})();
</script>
</body>
</html>
